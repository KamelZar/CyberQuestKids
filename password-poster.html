<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Force d'un mot de passe — CyberQuestKids</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Syne:wght@400;700;800;900&display=swap" rel="stylesheet" />
  <style>
    @page { size: A3 landscape; margin: 8mm; }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #060810;
      --surface: #0d1117;
      --card:    #11161f;
      --border:  #1e2535;
      --accent:  #00ffd0;
      --text:    #e6edf3;
      --muted:   #5a6580;
      --mono:    'Share Tech Mono', 'Courier New', monospace;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      padding: 14px 16px 20px;
      min-height: 100vh;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    @media screen {
      body::before {
        content: '';
        position: fixed; inset: 0; pointer-events: none; z-index: 900;
        background: repeating-linear-gradient(
          0deg, transparent, transparent 2px,
          rgba(0,255,208,.012) 2px, rgba(0,255,208,.012) 4px
        );
      }
    }

    /* ── Top bar : sélecteur attaquant + langue ──────────────────── */
    .top-bar {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 12px; flex-wrap: wrap;
    }
    .top-bar h1 {
      font-size: 22px; font-weight: 900; letter-spacing: .1em;
      text-transform: uppercase; color: var(--accent);
      text-shadow: 0 0 28px rgba(0,255,208,.35);
      flex: 1; white-space: nowrap;
    }

    /* Attacker selector */
    .atk-selector { display: flex; gap: 6px; }
    .atk-btn {
      display: flex; flex-direction: column; align-items: center;
      gap: 2px; padding: 8px 14px; border-radius: 10px;
      border: 2px solid var(--border); background: var(--card);
      cursor: pointer; transition: all .25s; min-width: 120px;
    }
    .atk-btn .btn-icon  { font-size: 20px; line-height: 1; }
    .atk-btn .btn-name  { font-size: 11px; font-weight: 700; font-family: 'Syne', sans-serif; }
    .atk-btn .btn-rate  { font-family: var(--mono); font-size: 9px; color: var(--muted); }

    .atk-btn[data-atk="0"]:hover,
    .atk-btn[data-atk="0"].active { border-color: #ff9500; background: rgba(255,149,0,.12); }
    .atk-btn[data-atk="0"].active .btn-name { color: #ff9500; }
    .atk-btn[data-atk="0"].active .btn-rate { color: #ff9500; opacity: .7; }

    .atk-btn[data-atk="1"]:hover,
    .atk-btn[data-atk="1"].active { border-color: #ffd60a; background: rgba(255,214,10,.1); }
    .atk-btn[data-atk="1"].active .btn-name { color: #ffd60a; }
    .atk-btn[data-atk="1"].active .btn-rate { color: #ffd60a; opacity: .7; }

    .atk-btn[data-atk="2"]:hover,
    .atk-btn[data-atk="2"].active { border-color: #ff3b6b; background: rgba(255,59,107,.12); }
    .atk-btn[data-atk="2"].active .btn-name { color: #ff3b6b; }
    .atk-btn[data-atk="2"].active .btn-rate { color: #ff3b6b; opacity: .7; }

    /* Lang switcher */
    .sep { width: 1px; height: 44px; background: var(--border); }
    .lang-sw { display: flex; gap: 5px; }
    .lang-btn {
      background: var(--card); border: 2px solid var(--border);
      color: var(--muted); padding: 8px 13px; border-radius: 8px;
      cursor: pointer; font-family: var(--mono); font-size: 13px;
      font-weight: 700; transition: all .2s;
    }
    .lang-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(0,255,208,.08); }
    @media print { .top-bar .atk-selector, .top-bar .sep, .lang-sw { display: none; } }

    /* ── Grid ────────────────────────────────────────────────────── */
    .grid-wrap { overflow-x: auto; }
    .grid {
      display: grid;
      grid-template-columns: 60px repeat(4, 1fr);
      gap: 5px;
    }

    /* Corner */
    .corner { display: flex; align-items: flex-end; justify-content: flex-end; padding-bottom: 4px; padding-right: 4px; }
    .corner span { font-size: 8px; color: var(--muted); text-align: right; font-family: var(--mono); line-height: 1.3; }

    /* Column header */
    .col-hdr {
      background: var(--card); border: 1.5px solid var(--border);
      border-radius: 10px; padding: 9px 8px; text-align: center;
    }
    .col-hdr .cs-name  { font-size: 12px; font-weight: 800; line-height: 1.2; }
    .col-hdr .cs-ex    { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-top: 3px; }
    .col-hdr .cs-count { font-size: 26px; font-weight: 900; line-height: 1; margin-top: 4px; }
    .col-hdr .cs-step  { font-size: 9px; color: var(--muted); margin-top: 2px; font-family: var(--mono); }

    /* Row header */
    .row-hdr {
      background: var(--card); border: 1.5px solid var(--border);
      border-radius: 10px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 1px;
    }
    .row-hdr .len { font-size: 24px; font-weight: 900; color: var(--accent); line-height: 1; }
    .row-hdr .lbl { font-size: 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }

    /* ── Data cell ───────────────────────────────────────────────── */
    .cell {
      border-radius: 10px; padding: 8px 10px 7px;
      border: 1.5px solid; position: relative;
      display: flex; flex-direction: column; gap: 0;
      /* Smooth transition when switching attacker */
      transition: background-color .35s ease, border-color .35s ease;
    }
    .cell-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .risk-badge {
      font-size: 8px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .07em; padding: 2px 5px; border-radius: 3px;
      transition: background-color .35s, color .35s;
    }
    .combos { font-family: var(--mono); font-size: 9px; color: rgba(255,255,255,.3); }

    .main-time {
      font-size: 19px; font-weight: 900; text-align: center;
      line-height: 1.1; margin-bottom: 5px;
      transition: color .35s ease;
    }

    .cell-div { height: 1px; background: rgba(255,255,255,.08); margin: 3px 0; }

    /* Attacker detail rows */
    .atk-row {
      display: flex; align-items: center; gap: 4px;
      font-family: var(--mono); font-size: 10px; line-height: 1.7;
      transition: opacity .25s;
    }
    .atk-row .ico { font-size: 11px; flex-shrink: 0; }
    .atk-row .lbl { color: rgba(255,255,255,.35); flex: 1; font-size: 9px; }
    .atk-row .val { font-weight: 700; text-align: right; }
    /* Dim inactive rows, highlight active */
    .atk-row.dim  { opacity: .35; }
    .atk-row.cur  { opacity: 1; }
    .atk-row.cur .lbl { color: rgba(255,255,255,.6); }

    /* ── Risk colour classes ──────────────────────────────────────── */
    .r0 { background: rgba(255,59,107,.13);  border-color: #ff3b6b; }
    .r0 .main-time  { color: #ff3b6b; }
    .r0 .risk-badge { background: rgba(255,59,107,.25); color: #ff3b6b; }

    .r1 { background: rgba(255,101,53,.13); border-color: #ff6535; }
    .r1 .main-time  { color: #ff6535; }
    .r1 .risk-badge { background: rgba(255,101,53,.25); color: #ff6535; }

    .r2 { background: rgba(255,149,0,.13);  border-color: #ff9500; }
    .r2 .main-time  { color: #ff9500; }
    .r2 .risk-badge { background: rgba(255,149,0,.25); color: #ff9500; }

    .r3 { background: rgba(255,214,10,.11); border-color: #ffd60a; }
    .r3 .main-time  { color: #ffd60a; }
    .r3 .risk-badge { background: rgba(255,214,10,.2); color: #ffd60a; }

    .r4 { background: rgba(82,196,26,.11);  border-color: #52c41a; }
    .r4 .main-time  { color: #52c41a; }
    .r4 .risk-badge { background: rgba(82,196,26,.2); color: #52c41a; }

    .r5 { background: rgba(22,119,255,.11); border-color: #1677ff; }
    .r5 .main-time  { color: #1677ff; }
    .r5 .risk-badge { background: rgba(22,119,255,.2); color: #1677ff; }

    .r6 { background: rgba(0,255,208,.09);  border-color: #00ffd0; }
    .r6 .main-time  { color: #00ffd0; }
    .r6 .risk-badge { background: rgba(0,255,208,.18); color: #00ffd0; }

    /* ── Cellule surlignée (position du mot de passe testé) ─────── */
    @keyframes pulse-you {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255,255,255,.55), 0 0 20px rgba(255,255,255,.1); }
      50%       { box-shadow: 0 0 0 6px rgba(255,255,255,.0), 0 0 28px rgba(255,255,255,.25); }
    }
    .cell.you-are-here {
      outline: 3px solid #fff;
      outline-offset: -2px;
      animation: pulse-you 1.6s ease-in-out infinite;
      position: relative; z-index: 5;
    }

    /* ── Footer ──────────────────────────────────────────────────── */
    .footer-strip {
      margin-top: 10px; display: flex; gap: 8px; align-items: stretch;
    }
    .legend {
      display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 8px; padding: 7px 12px; flex: 1;
    }
    .legend-title { font-size: 9px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-right: 4px; }
    .leg { display: flex; align-items: center; gap: 4px; font-size: 10px; }
    .leg-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
    .note {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 8px; padding: 7px 12px;
      font-size: 10px; color: var(--muted); line-height: 1.5; max-width: 320px;
    }
    .brand {
      display: flex; flex-direction: column; justify-content: center;
      align-items: center; gap: 2px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 14px; white-space: nowrap;
    }
    .brand .logo  { font-size: 18px; }
    .brand .bname { font-size: 11px; font-weight: 800; color: var(--accent); }
    .brand .bsub  { font-size: 9px; color: var(--muted); }

    /* ── Responsive mobile (≤ 640px) ────────────────────────────── */
    @media (max-width: 640px) {
      body { padding: 10px 10px 16px; }

      /* Top bar : titre pleine largeur, puis contrôles sur la ligne suivante */
      .top-bar { flex-direction: column; align-items: stretch; gap: 8px; margin-bottom: 10px; }
      .top-bar > div:first-child { flex: 0 0 100%; }
      .top-bar h1 { font-size: 15px; white-space: normal; text-align: center; }
      #h-subtitle { display: none; }

      /* Contrôles : une seule ligne centrée */
      .atk-selector { justify-content: center; flex-wrap: wrap; }
      .atk-btn      { min-width: unset; flex: 1; padding: 6px 8px; border-radius: 8px; }
      .atk-btn .btn-icon { font-size: 16px; }
      .atk-btn .btn-name { font-size: 9px; }
      .atk-btn .btn-rate { display: none; }      /* hash rate masqué sur mobile */

      .sep { display: none; }
      .lang-sw { justify-content: center; }
      .lang-btn { padding: 6px 12px; font-size: 11px; }

      /* Grid : colonnes plus étroites */
      .grid { grid-template-columns: 38px repeat(4, 1fr); gap: 3px; }

      /* En-têtes de colonnes : compact */
      .col-hdr          { padding: 5px 3px; border-radius: 7px; }
      .col-hdr .cs-name { font-size: 9px; }
      .col-hdr .cs-ex   { display: none; }   /* exemples masqués */
      .col-hdr .cs-count{ font-size: 16px; margin-top: 2px; }
      .col-hdr .cs-step { display: none; }   /* ×N charset masqué */

      /* En-têtes de lignes */
      .row-hdr      { border-radius: 7px; }
      .row-hdr .len { font-size: 17px; }
      .row-hdr .lbl { display: none; }       /* "caractères" masqué */

      /* Cellules de données */
      .cell       { padding: 5px 5px 4px; border-radius: 7px; }
      .cell-top   { margin-bottom: 2px; }
      .risk-badge { font-size: 6px; padding: 1px 3px; letter-spacing: .03em; }
      .combos     { display: none; }
      .main-time  { font-size: 13px; margin-bottom: 2px; }
      .cell-div   { display: none; }

      /* Lignes attaquants : masquer les inactives, simplifier l'active */
      .atk-row.dim  { display: none; }
      .atk-row      { font-size: 7px; line-height: 1.4; gap: 2px; }
      .atk-row .ico { font-size: 9px; }
      .atk-row .lbl { display: none; }       /* label texte masqué, garde ico + val */

      /* Footer : empiler verticalement */
      .footer-strip { flex-direction: column; gap: 6px; margin-top: 8px; }
      .note { max-width: 100%; }
      .brand { flex-direction: row; gap: 8px; justify-content: flex-start; padding: 8px 12px; }
    }
  </style>
</head>
<body>

<!-- ── Top bar ───────────────────────────────────────────────────── -->
<div class="top-bar">
  <div style="flex:1; min-width:0;">
    <h1 id="h-title">FORCE D'UN MOT DE PASSE</h1>
    <div id="h-subtitle" style="font-size:11px; color:var(--muted); font-family:var(--mono); margin-top:3px; letter-spacing:.04em;"></div>
  </div>

  <!-- Attacker selector -->
  <div class="atk-selector" id="atk-selector"><!-- JS --></div>

  <div class="sep"></div>

  <!-- Lang switcher -->
  <div class="lang-sw">
    <button class="lang-btn active" onclick="setLang('fr')">FR</button>
    <button class="lang-btn" onclick="setLang('nl')">NL</button>
    <button class="lang-btn" onclick="setLang('en')">EN</button>
  </div>
</div>

<!-- Bannière contextuelle (visible uniquement si mot de passe trouvé) -->
<div id="found-banner" style="display:none; margin-bottom:10px; padding:12px 16px;
  background:rgba(255,149,0,.12); border:1px solid rgba(255,149,0,.5);
  border-radius:8px; font-size:12px; color:#ff9500; line-height:1.6;">
</div>

<!-- ── Grid ──────────────────────────────────────────────────────── -->
<div class="grid-wrap">
  <div class="grid" id="main-grid"><!-- JS --></div>
</div>

<!-- ── Footer ────────────────────────────────────────────────────── -->
<div class="footer-strip">
  <div class="legend" id="legend"><!-- JS --></div>
  <div class="note"   id="note"><!-- JS --></div>
  <div class="brand">
    <div class="logo">🔐</div>
    <div class="bname">CyberQuestKids</div>
    <div class="bsub" id="b-sub">Outil pédagogique</div>
  </div>
</div>

<!-- ── Script ────────────────────────────────────────────────────── -->
<script>
/* ── Translations ─────────────────────────────────────────────── */
const T = {
  fr: {
    title:    "Combien de temps pour tester toutes les combinaisons d'un mot de passe ?",
    subtitle: "Tableau brute force — temps maximum estimé (mot de passe aléatoire)",
    foundBanner: (elapsed, method) =>
      `⚠ Votre mot de passe a été trouvé en <strong>${elapsed}s</strong> par attaque <strong>${method}</strong> — `
      + `le tableau ci-dessous montre le temps en brute force pur. Un mot du dictionnaire ou une variante se craque en quelques secondes, peu importe sa longueur.`,
    chars:    'car.',
    colNames: ['Minuscules', '+ Chiffres', '+ Majuscules', '+ Symboles'],
    colEx:    ['a–z', 'a–z, 0–9', 'A–Z, a–z, 0–9', 'A–Z, a–z, 0–9, !@#$…'],
    atk: [
      { ico: '🐍', name: 'Script Python',  rate: '2 millions / s',    short: 'Script' },
      { ico: '⚡', name: 'GPU (RTX 4090)', rate: '22 milliards / s',  short: 'GPU'    },
      { ico: '💀', name: 'Professionnel',  rate: '100 milliards / s', short: 'Pro'    },
    ],
    risk: ['Instantané','Secondes','Minutes','Heures','Jours','Années','Siècles ✓'],
    legTitle: 'Légende (temps avec l\'attaquant sélectionné)',
    combos:   'combos',
    note:     '⚡ Passez de "Script" à "GPU" pour voir ce qu\'un vrai attaquant ferait.\n\n🛡 12+ caractères · min + MAJ + chiffres + symboles = hors de portée même d\'un professionnel.',
    brand:    'Outil pédagogique',
  },
  nl: {
    title:    'Hoe lang om alle combinaties van een wachtwoord te testen?',
    subtitle: "Brute force tabel — maximale geschatte tijd (willekeurig wachtwoord)",
    foundBanner: (elapsed, method) =>
      `⚠ Uw wachtwoord werd gevonden in <strong>${elapsed}s</strong> via <strong>${method}</strong> aanval — `
      + `de tabel hieronder toont de tijd bij pure brute force. Een woordenboekwoord of variant kraak je in seconden, ongeacht de lengte.`,
    chars:    'tek.',
    colNames: ['Kleine letters', '+ Cijfers', '+ Hoofdletters', '+ Symbolen'],
    colEx:    ['a–z', 'a–z, 0–9', 'A–Z, a–z, 0–9', 'A–Z, a–z, 0–9, !@#$…'],
    atk: [
      { ico: '🐍', name: 'Python-script',  rate: '2 miljoen / s',   short: 'Script' },
      { ico: '⚡', name: 'GPU (RTX 4090)', rate: '22 miljard / s',  short: 'GPU'    },
      { ico: '💀', name: 'Professioneel',  rate: '100 mrd / s',     short: 'Pro'    },
    ],
    risk: ['Onmiddellijk','Seconden','Minuten','Uren','Dagen','Jaren','Eeuwen ✓'],
    legTitle: 'Legende (tijd met de geselecteerde aanvaller)',
    combos:   "combo's",
    note:     "⚡ Schakel van 'Script' naar 'GPU' om te zien wat een echte aanvaller zou doen.\n\n🛡 12+ tekens · kleine + GROTE letters + cijfers + symbolen = onkraakbaar.",
    brand:    'Educatief hulpmiddel',
  },
  en: {
    title:    'How long to test all combinations of a password?',
    subtitle: "Brute force table — maximum estimated time (random password)",
    foundBanner: (elapsed, method) =>
      `⚠ Your password was found in <strong>${elapsed}s</strong> via <strong>${method}</strong> attack — `
      + `the table below shows brute force time only. A dictionary word or variant cracks in seconds regardless of its length.`,
    chars:    'chr.',
    colNames: ['Lowercase only', '+ Digits', '+ Uppercase', '+ Symbols'],
    colEx:    ['a–z', 'a–z, 0–9', 'A–Z, a–z, 0–9', 'A–Z, a–z, 0–9, !@#$…'],
    atk: [
      { ico: '🐍', name: 'Python Script',  rate: '2 million / s',    short: 'Script' },
      { ico: '⚡', name: 'GPU (RTX 4090)', rate: '22 billion / s',   short: 'GPU'    },
      { ico: '💀', name: 'Professional',   rate: '100 billion / s',  short: 'Pro'    },
    ],
    risk: ['Instant','Seconds','Minutes','Hours','Days','Years','Centuries ✓'],
    legTitle: 'Legend (time with selected attacker)',
    combos:   'combos',
    note:     "⚡ Switch from 'Script' to 'GPU' to see what a real attacker would do.\n\n🛡 12+ characters · lower + UPPER + digits + symbols = out of reach.",
    brand:    'Educational tool',
  },
};

/* ── Config ───────────────────────────────────────────────────── */
const CHARSETS      = [26, 36, 62, 95];
const LENGTHS       = [6, 7, 8, 9, 10, 12, 14, 16];
const RATES         = [2e6, 22e9, 100e9];
const RISK_COLORS   = ['#ff3b6b','#ff6535','#ff9500','#ffd60a','#52c41a','#1677ff','#00ffd0'];
const CS_COLORS     = ['#ff9500','#ffd60a','#52c41a','#00ffd0'];

let curLang    = 'fr';
let curAttacker = 0;   // 0=Script  1=GPU  2=Pro

/* ── Helpers ──────────────────────────────────────────────────── */
function fmtTime(s, lang) {
  if (s < 0.001) return '< 1 ms';
  if (s < 1)     return (s*1000).toFixed(0) + ' ms';
  if (s < 60)    return s.toFixed(1) + ' s';
  if (s < 3600)  { const m=Math.floor(s/60),r=Math.floor(s%60); return r?`${m}min ${r}s`:`${m} min`; }
  if (s < 86400) { const h=Math.floor(s/3600),m=Math.floor((s%3600)/60); return m?`${h}h ${m}min`:`${h}h`; }
  if (s < 86400*365) {
    const d=Math.floor(s/86400);
    return lang==='nl'?`${d} dag${d>1?'en':''}`:lang==='en'?`${d} day${d>1?'s':''}`: `${d} jour${d>1?'s':''}`;
  }
  const y=s/(86400*365);
  if (y < 1e3)  { const yr=Math.round(y); return lang==='nl'?`${yr} jaar`:lang==='en'?`${yr} yr${yr>1?'s':''}`: `${yr} an${yr>1?'s':''}`; }
  if (y < 1e6)  return `${(y/1e3).toFixed(0)}k ${lang==='nl'?'jaar':lang==='en'?'yrs':'ans'}`;
  if (y < 1e9)  return `${(y/1e6).toFixed(0)}M ${lang==='nl'?'jaar':lang==='en'?'yrs':'ans'}`;
  if (y < 1e12) return `${(y/1e9).toFixed(0)}Md ${lang==='nl'?'jaar':lang==='en'?'yrs':'ans'}`;
  return lang==='nl'?'∞ veilig':lang==='en'?'∞ safe':'∞ sûr';
}

function fmtCombos(n) {
  if (n<1e3)  return n.toFixed(0);
  if (n<1e6)  return (n/1e3).toFixed(0)+'K';
  if (n<1e9)  return (n/1e6).toFixed(0)+'M';
  if (n<1e12) return (n/1e9).toFixed(1)+'B';
  if (n<1e15) return (n/1e12).toFixed(1)+'T';
  if (n<1e18) return (n/1e15).toFixed(0)+' P';
  return n.toExponential(1);
}

function riskLevel(t) {
  if (t < 1)           return 0;
  if (t < 60)          return 1;
  if (t < 3600)        return 2;
  if (t < 86400)       return 3;
  if (t < 86400*365)   return 4;
  if (t < 86400*36500) return 5;
  return 6;
}

/* ── Switch attacker (lightweight DOM update — no full re-render) ─ */
function switchAttacker(n) {
  curAttacker = n;
  const L = T[curLang];

  // Update selector buttons
  document.querySelectorAll('.atk-btn').forEach(b =>
    b.classList.toggle('active', +b.dataset.atk === n));

  // Update each cell
  document.querySelectorAll('.cell').forEach(cell => {
    const times = JSON.parse(cell.dataset.times);
    const t  = times[n];
    const r  = riskLevel(t);

    // Risk class
    cell.className = `cell r${r}`;

    // Main time
    cell.querySelector('.main-time').textContent = fmtTime(t, curLang);

    // Risk badge
    cell.querySelector('.risk-badge').textContent = L.risk[r];

    // Attacker rows: highlight current, dim others
    cell.querySelectorAll('.atk-row').forEach((row, i) => {
      row.classList.toggle('cur', i === n);
      row.classList.toggle('dim', i !== n);
    });
  });

  // Legend labels (risk names unchanged, but title says which attacker)
  document.getElementById('legend-title').textContent = L.legTitle;
}

/* ── Full render (on lang change or initial load) ─────────────── */
function render(lang) {
  curLang = lang;
  const L = T[lang];

  document.getElementById('h-title').textContent    = L.title;
  document.getElementById('h-subtitle').textContent = L.subtitle;
  document.getElementById('b-sub').textContent      = L.brand;
  document.getElementById('note').innerHTML =
    L.note.replace(/\n\n/g,'<br><br>').replace(/\n/g,'<br>');

  /* Attacker selector */
  document.getElementById('atk-selector').innerHTML = L.atk.map((a, i) => `
    <button class="atk-btn ${i===curAttacker?'active':''}" data-atk="${i}"
            onclick="switchAttacker(${i})">
      <span class="btn-icon">${a.ico}</span>
      <span class="btn-name">${a.name}</span>
      <span class="btn-rate">${a.rate}</span>
    </button>`).join('');

  /* Lang buttons */
  document.querySelectorAll('.lang-btn').forEach(b =>
    b.classList.toggle('active', b.textContent === lang.toUpperCase()));

  /* Grid */
  const grid = document.getElementById('main-grid');
  grid.innerHTML = '';

  // Corner
  grid.insertAdjacentHTML('beforeend',
    `<div class="corner"><span>len → charset ↓</span></div>`);

  // Column headers
  CHARSETS.forEach((cs, i) => {
    grid.insertAdjacentHTML('beforeend', `
      <div class="col-hdr">
        <div class="cs-name">${L.colNames[i]}</div>
        <div class="cs-ex">${L.colEx[i]}</div>
        <div class="cs-count" style="color:${CS_COLORS[i]}">${cs}</div>
        <div class="cs-step">${i>0?`×${(cs/CHARSETS[i-1]).toFixed(2)} charset`:'— base'}</div>
      </div>`);
  });

  // Rows
  LENGTHS.forEach(len => {
    grid.insertAdjacentHTML('beforeend', `
      <div class="row-hdr">
        <div class="len">${len}</div>
        <div class="lbl">${L.chars}</div>
      </div>`);

    CHARSETS.forEach((cs, i) => {
      const combos = Math.pow(cs, len);
      const times  = RATES.map(r => combos / r);
      const t      = times[curAttacker];
      const risk   = riskLevel(t);

      const atkRows = L.atk.map((a, ai) => `
        <div class="atk-row ${ai===curAttacker?'cur':'dim'}">
          <span class="ico">${a.ico}</span>
          <span class="lbl">${a.short}</span>
          <span class="val">${fmtTime(times[ai], lang)}</span>
        </div>`).join('');

      grid.insertAdjacentHTML('beforeend', `
        <div class="cell r${risk}" data-times='${JSON.stringify(times)}' data-len="${len}" data-cs="${i}">
          <div class="cell-top">
            <span class="risk-badge">${L.risk[risk]}</span>
            <span class="combos">${fmtCombos(combos)} ${L.combos}</span>
          </div>
          <div class="main-time">${fmtTime(t, lang)}</div>
          <div class="cell-div"></div>
          ${atkRows}
        </div>`);
    });
  });

  /* Legend */
  document.getElementById('legend').innerHTML =
    `<span class="legend-title" id="legend-title">${L.legTitle}</span>` +
    L.risk.map((label, i) => `
      <div class="leg">
        <div class="leg-dot" style="background:${RISK_COLORS[i]}"></div>
        <span>${label}</span>
      </div>`).join('');

  /* Note */
  document.getElementById('note').innerHTML =
    L.note.replace(/\n\n/g,'<br><br>').replace(/\n/g,'<br>');
}

/* ── Highlight "vous êtes ici" ────────────────────────────────── */
const YOU_LABEL = { fr: '← VOUS', nl: '← U BENT HIER', en: '← YOU' };

function highlightCell(len, csIdx) {
  // Retire l'ancien highlight
  document.querySelectorAll('.cell.you-are-here').forEach(c => {
    c.classList.remove('you-are-here');
    const lbl = c.querySelector('.you-label');
    if (lbl) lbl.remove();
  });
  if (len == null || csIdx == null) return;

  // Clamp : trouver la longueur la plus proche dans LENGTHS
  const clampedLen = LENGTHS.reduce((prev, cur) =>
    Math.abs(cur - len) < Math.abs(prev - len) ? cur : prev);
  const clampedCs  = Math.max(0, Math.min(3, +csIdx));

  const cell = document.querySelector(
    `.cell[data-len="${clampedLen}"][data-cs="${clampedCs}"]`);
  if (!cell) return;

  cell.classList.add('you-are-here');

  // Label dynamique selon la langue
  const lbl = document.createElement('div');
  lbl.className = 'you-label';
  lbl.style.cssText = 'position:absolute;top:-22px;left:50%;transform:translateX(-50%);' +
    'background:#fff;color:#000;font-size:9px;font-weight:900;font-family:Syne,sans-serif;' +
    'padding:2px 7px;border-radius:4px;white-space:nowrap;letter-spacing:.08em;pointer-events:none;';
  lbl.textContent = YOU_LABEL[curLang] || YOU_LABEL.fr;
  cell.style.position = 'relative';
  cell.appendChild(lbl);

  // Scroll vers la cellule
  setTimeout(() => cell.scrollIntoView({ behavior: 'smooth', block: 'center' }), 400);
}

/* ── Entry points ─────────────────────────────────────────────── */
function setLang(l) { render(l); highlightCell(_hlLen, _hlCs); }

/* Keyboard shortcuts: 1/2/3 = attacker, F/N/E = lang */
document.addEventListener('keydown', e => {
  if (e.key==='1') switchAttacker(0);
  if (e.key==='2') switchAttacker(1);
  if (e.key==='3') switchAttacker(2);
  if (e.key.toLowerCase()==='f') setLang('fr');
  if (e.key.toLowerCase()==='n') setLang('nl');
  if (e.key.toLowerCase()==='e') setLang('en');
});

/* ── Init depuis les paramètres URL ──────────────────────────── */
const _params  = new URLSearchParams(window.location.search);
const _hlLen   = _params.has('len')     ? +_params.get('len')     : null;
const _hlCs    = _params.has('cs')      ? +_params.get('cs')      : null;
const _hlLang  = ['fr','nl','en'].includes(_params.get('lang')) ? _params.get('lang') : 'fr';
const _hlAtk   = [0,1,2].includes(+_params.get('atk')) ? +_params.get('atk') : 0;
const _found   = _params.get('found')   === '1';
const _elapsed = _params.get('elapsed') || '?';
const _method  = _params.get('method')  || '?';

curAttacker = _hlAtk;
render(_hlLang);
highlightCell(_hlLen, _hlCs);

// Bannière contextuelle si le mot de passe a été trouvé
if (_found) {
  const banner = document.getElementById('found-banner');
  banner.innerHTML = T[_hlLang].foundBanner(_elapsed, _method);
  banner.style.display = 'block';
}
</script>
</body>
</html>
