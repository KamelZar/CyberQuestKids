<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CyberQuest Defense</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
/* ===== VARIABLES ===== */
:root {
  --bg:        #06060f;
  --bg2:       #0c0c1e;
  --green:     #00ff41;
  --cyan:      #00e5ff;
  --magenta:   #ff00cc;
  --red:       #ff3355;
  --yellow:    #ffe600;
  --orange:    #ff8800;
  --text:      #b8f0b8;
  --text-dim:  #3a6a3a;
  --card-bg:   rgba(0,255,65,0.04);
  --card-border:rgba(0,255,65,0.22);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{height:100%;}
body{background:var(--bg);color:var(--text);font-family:'Share Tech Mono','Courier New',monospace;min-height:100vh;overflow-x:hidden;}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.12) 3px,rgba(0,0,0,0.12) 4px);pointer-events:none;z-index:9999;}
#matrix{position:fixed;inset:0;pointer-events:none;opacity:0.12;z-index:0;}

/* ===== SCREENS ===== */
.screen{display:none;min-height:100vh;position:relative;z-index:1;flex-direction:column;align-items:center;}
.screen.active{display:flex;}

/* ===== ANIMATIONS ===== */
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.05);}}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.4;}}
@keyframes shake{0%,100%{transform:translateX(0)rotate(0);}25%{transform:translateX(-5px)rotate(-3deg);}75%{transform:translateX(5px)rotate(3deg);}}
@keyframes glow{0%,100%{text-shadow:0 0 10px currentColor;}50%{text-shadow:0 0 30px currentColor,0 0 60px currentColor;}}
@keyframes slideIn{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
@keyframes badFade{0%{background:rgba(255,51,85,0.3);}100%{background:transparent;}}
@keyframes goodFade{0%{background:rgba(0,255,65,0.3);}100%{background:transparent;}}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}

/* ===== HP BAR ===== */
#hp-bar{position:fixed;top:0;left:0;right:0;z-index:200;padding:.5rem 1rem;background:rgba(6,6,15,0.92);border-bottom:1px solid var(--card-border);display:none;align-items:center;gap:.8rem;}
.hp-label{font-size:.6rem;color:var(--text-dim);letter-spacing:.12em;white-space:nowrap;}
.hp-bar-outer{flex:1;height:8px;background:rgba(255,255,255,0.08);border-radius:4px;overflow:hidden;}
.hp-bar-inner{height:100%;border-radius:4px;transition:width .6s ease,background .6s;}
.hp-value{font-family:'Orbitron',monospace;font-size:.75rem;font-weight:700;min-width:42px;text-align:right;}
.hp-level-indicator{font-size:.6rem;color:var(--text-dim);letter-spacing:.1em;white-space:nowrap;}

/* ===== LANGUAGE SCREEN ===== */
#screen-lang{justify-content:center;gap:2.5rem;padding:2rem 1rem;text-align:center;}
.lang-logo{font-family:'Orbitron',monospace;font-size:clamp(2rem,8vw,4rem);font-weight:900;color:var(--green);letter-spacing:.12em;text-shadow:0 0 20px var(--green),0 0 50px var(--green);}
.lang-sub{font-size:.7rem;letter-spacing:.2em;color:var(--cyan);text-transform:uppercase;}
.lang-shield{font-size:5rem;animation:float 3s ease-in-out infinite;filter:drop-shadow(0 0 20px var(--cyan));}
.lang-desc{font-size:.75rem;color:var(--text-dim);max-width:320px;line-height:1.6;text-align:center;}
.lang-buttons{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;}
.btn-lang{padding:1rem 2rem;font-family:'Orbitron',monospace;font-size:1rem;font-weight:700;letter-spacing:.12em;border:2px solid var(--cyan);color:var(--cyan);background:rgba(0,229,255,0.06);border-radius:4px;transition:all .2s;}
.btn-lang:hover{background:rgba(0,229,255,0.18);box-shadow:0 0 24px var(--cyan);transform:translateY(-2px);}

/* ===== MAP SCREEN ===== */
#screen-map{padding:4.5rem 1rem 3rem;gap:.5rem;align-items:center;}
.map-header{text-align:center;margin-bottom:.5rem;}
.map-title{font-family:'Orbitron',monospace;font-size:clamp(.9rem,3.5vw,1.4rem);font-weight:700;color:var(--green);letter-spacing:.12em;text-shadow:0 0 12px var(--green);}
.map-sub{font-size:.65rem;color:var(--text-dim);letter-spacing:.18em;margin-top:.3rem;}
.map-hp-summary{font-size:.7rem;color:var(--cyan);margin-top:.4rem;}

.map-path{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:flex-start;padding:.5rem 1rem;}
.map-row{display:flex;align-items:center;gap:0;width:100%;}
.map-node{
  display:flex;align-items:center;gap:.9rem;padding:.6rem .8rem;cursor:pointer;
  transition:all .25s;border-radius:8px;flex:1;
  animation:slideIn .4s ease both;
}
.map-node:hover.unlocked{background:rgba(0,229,255,0.06);transform:translateX(4px);}
.map-node-circle{
  width:54px;height:54px;border-radius:50%;border:2px solid var(--card-border);
  display:flex;align-items:center;justify-content:center;font-size:1.4rem;
  background:var(--card-bg);transition:all .35s;flex-shrink:0;
}
.map-node.completed .map-node-circle{border-color:var(--green);background:rgba(0,255,65,0.08);box-shadow:0 0 14px rgba(0,255,65,0.5);}
.map-node.unlocked .map-node-circle{border-color:var(--cyan);background:rgba(0,229,255,0.08);box-shadow:0 0 14px rgba(0,229,255,0.5);animation:pulse 2s infinite;}
.map-node.locked .map-node-circle{opacity:.35;filter:grayscale(.9);}
.map-node-info{flex:1;}
.map-node-name{font-family:'Orbitron',monospace;font-size:.7rem;font-weight:700;letter-spacing:.06em;}
.map-node.locked .map-node-name{color:var(--text-dim);}
.map-node.completed .map-node-name{color:var(--green);}
.map-node.unlocked .map-node-name{color:var(--cyan);}
.map-node-loc{font-size:.58rem;color:var(--text-dim);margin-top:.2rem;}
.map-node-badge{display:inline-block;font-size:.58rem;padding:.15rem .45rem;border-radius:3px;margin-top:.3rem;}
.badge-done{background:rgba(0,255,65,0.1);color:var(--green);border:1px solid rgba(0,255,65,0.4);}
.badge-play{background:rgba(0,229,255,0.1);color:var(--cyan);border:1px solid rgba(0,229,255,0.4);animation:blink 1.5s infinite;}
.badge-lock{background:rgba(255,255,255,0.04);color:var(--text-dim);border:1px solid rgba(255,255,255,0.1);}
.map-connector-v{width:2px;height:20px;background:var(--card-border);margin-left:calc(1rem + 27px - 1px);}
.map-connector-v.done{background:var(--green);box-shadow:0 0 6px var(--green);}

/* ===== LEVEL SCREEN ===== */
#screen-level{padding:5rem 1rem 2rem;gap:1rem;max-width:580px;margin:0 auto;width:100%;}
.level-header{text-align:center;}
.level-num{font-size:.6rem;color:var(--magenta);letter-spacing:.2em;text-transform:uppercase;}
.level-title{font-family:'Orbitron',monospace;font-size:clamp(1rem,4vw,1.6rem);font-weight:700;color:var(--cyan);text-shadow:0 0 14px var(--cyan);margin:.3rem 0;}
.level-loc{font-size:.65rem;color:var(--text-dim);letter-spacing:.1em;}
.level-scene{background:var(--card-bg);border:1px solid var(--card-border);border-radius:8px;padding:1.2rem;animation:slideIn .4s ease;}
.level-icon{font-size:2.8rem;text-align:center;margin-bottom:.8rem;filter:drop-shadow(0 0 12px var(--cyan));}
.level-narrative{font-size:.8rem;line-height:1.75;color:var(--text);white-space:pre-line;}
.level-narrative .hl{color:var(--yellow);}
.level-narrative .danger{color:var(--red);}

/* State flags */
.state-flags{display:flex;flex-wrap:wrap;gap:.4rem;}
.flag-badge{font-size:.58rem;padding:.18rem .45rem;border-radius:3px;display:flex;align-items:center;gap:.25rem;}
.flag-good{background:rgba(0,255,65,0.08);color:var(--green);border:1px solid rgba(0,255,65,0.3);}
.flag-bad{background:rgba(255,51,85,0.08);color:var(--red);border:1px solid rgba(255,51,85,0.3);}
.flag-warn{background:rgba(255,230,0,0.08);color:var(--yellow);border:1px solid rgba(255,230,0,0.3);}

/* Enemy alert */
.enemy-alert{display:none;align-items:center;gap:1rem;padding:.8rem 1rem;background:rgba(255,51,85,0.08);border:1px solid rgba(255,51,85,0.5);border-radius:6px;animation:slideIn .4s ease;}
.enemy-alert.visible{display:flex;}
.enemy-sprite{font-size:2.2rem;animation:shake .6s infinite;}
.enemy-info-box{flex:1;}
.enemy-name{font-size:.65rem;color:var(--red);font-family:'Orbitron',monospace;letter-spacing:.1em;}
.enemy-desc{font-size:.62rem;color:var(--text-dim);margin-top:.2rem;line-height:1.4;}

/* Choices */
.choices-label{font-size:.6rem;color:var(--text-dim);letter-spacing:.18em;text-transform:uppercase;}
.choices-grid{display:flex;flex-direction:column;gap:.7rem;}
.btn-choice{
  width:100%;padding:.9rem 1.1rem;background:var(--card-bg);
  border:1px solid var(--card-border);border-radius:6px;text-align:left;
  transition:all .22s;display:flex;align-items:center;gap:.9rem;
  animation:slideIn .4s ease both;
}
.btn-choice:hover{background:rgba(0,229,255,0.07);border-color:var(--cyan);box-shadow:0 0 14px rgba(0,229,255,0.2);transform:translateX(5px);}
.choice-icon{font-size:1.6rem;flex-shrink:0;}
.choice-text{font-size:.78rem;color:var(--text);line-height:1.4;}

/* ===== OUTCOME SCREEN ===== */
#screen-outcome{justify-content:center;align-items:center;padding:5.5rem 1.5rem 2rem;gap:1.4rem;max-width:580px;margin:0 auto;width:100%;text-align:center;}
.outcome-icon{font-size:5rem;animation:pulse 1s infinite;}
.outcome-title{font-family:'Orbitron',monospace;font-size:clamp(.95rem,4vw,1.5rem);font-weight:700;letter-spacing:.1em;}
.outcome-hp-change{font-family:'Orbitron',monospace;font-size:2rem;font-weight:900;animation:glow 1.5s infinite;}
.outcome-message{font-size:.82rem;line-height:1.7;max-width:420px;}
.outcome-context{
  font-size:.72rem;color:var(--text-dim);background:var(--card-bg);
  border:1px solid var(--card-border);border-radius:6px;padding:1rem;
  text-align:left;width:100%;max-width:420px;line-height:1.65;
}
.outcome-chain{
  font-size:.7rem;background:rgba(255,51,85,0.06);border:1px solid rgba(255,51,85,0.3);
  border-radius:6px;padding:.8rem 1rem;text-align:left;width:100%;max-width:420px;line-height:1.6;
  color:var(--red);display:none;
}
.outcome-chain.visible{display:block;}
.btn-continue{
  padding:.9rem 3rem;font-family:'Orbitron',monospace;font-weight:700;
  letter-spacing:.1em;font-size:.88rem;border:2px solid var(--cyan);
  color:var(--cyan);background:rgba(0,229,255,0.08);border-radius:4px;transition:all .2s;
}
.btn-continue:hover{background:rgba(0,229,255,0.22);box-shadow:0 0 22px var(--cyan);}

/* ===== END SCREEN ===== */
#screen-end{justify-content:center;align-items:center;padding:5rem 1.5rem 3rem;gap:1.4rem;text-align:center;}
.end-grade{font-family:'Orbitron',monospace;font-size:clamp(4rem,18vw,9rem);font-weight:900;animation:glow 2s infinite;}
.end-title{font-family:'Orbitron',monospace;font-size:clamp(.9rem,4vw,1.6rem);font-weight:700;letter-spacing:.1em;}
.end-msg{font-size:.8rem;line-height:1.7;max-width:400px;color:var(--text-dim);}
.end-report{width:100%;max-width:420px;background:var(--card-bg);border:1px solid var(--card-border);border-radius:8px;padding:1.2rem;}
.end-report-title{font-family:'Orbitron',monospace;font-size:.62rem;color:var(--text-dim);letter-spacing:.18em;margin-bottom:.8rem;}
.report-item{display:flex;align-items:flex-start;gap:.5rem;font-size:.7rem;color:var(--text);margin:.35rem 0;line-height:1.4;}
.ri-icon{flex-shrink:0;margin-top:.05rem;}
.report-item.good .ri-icon{color:var(--green);}
.report-item.bad .ri-icon{color:var(--red);}
.report-item.warn .ri-icon{color:var(--yellow);}
.btn-replay{
  padding:.9rem 3rem;font-family:'Orbitron',monospace;font-weight:700;
  letter-spacing:.1em;font-size:.88rem;border:2px solid var(--green);
  color:var(--green);background:rgba(0,255,65,0.06);border-radius:4px;transition:all .2s;
}
.btn-replay:hover{background:rgba(0,255,65,0.18);box-shadow:0 0 22px var(--green);}
</style>
</head>
<body>
<canvas id="matrix"></canvas>

<!-- HP BAR -->
<div id="hp-bar">
  <span class="hp-label" id="hp-label-txt">SÉCURITÉ</span>
  <div class="hp-bar-outer"><div class="hp-bar-inner" id="hp-bar-inner"></div></div>
  <span class="hp-value" id="hp-value-txt">100</span>
  <span class="hp-level-indicator" id="hp-level-txt"></span>
</div>

<!-- SCREEN: LANG -->
<div class="screen active" id="screen-lang">
  <div class="lang-logo">CYBERQUEST</div>
  <div class="lang-sub">DEFENSE // CHOOSE YOUR LANGUAGE</div>
  <div class="lang-shield">🛡️</div>
  <p class="lang-desc" id="lang-desc">Apprends à te défendre contre les cyberattaques en faisant les bons choix !</p>
  <div class="lang-buttons">
    <button class="btn-lang" onclick="startGame('fr')">🇫🇷 Français</button>
    <button class="btn-lang" onclick="startGame('nl')">🇧🇪 Nederlands</button>
    <button class="btn-lang" onclick="startGame('en')">🇬🇧 English</button>
  </div>
</div>

<!-- SCREEN: MAP -->
<div class="screen" id="screen-map">
  <div class="map-header">
    <div class="map-title" id="map-title"></div>
    <div class="map-sub" id="map-sub"></div>
    <div class="map-hp-summary" id="map-hp-summary"></div>
  </div>
  <div class="map-path" id="map-path"></div>
</div>

<!-- SCREEN: LEVEL -->
<div class="screen" id="screen-level">
  <div class="level-header">
    <div class="level-num" id="level-num"></div>
    <div class="level-title" id="level-title"></div>
    <div class="level-loc" id="level-loc"></div>
  </div>
  <div class="level-scene">
    <div class="level-icon" id="level-icon"></div>
    <div class="level-narrative" id="level-narrative"></div>
  </div>
  <div class="enemy-alert" id="enemy-alert">
    <div class="enemy-sprite" id="enemy-sprite"></div>
    <div class="enemy-info-box">
      <div class="enemy-name" id="enemy-name"></div>
      <div class="enemy-desc" id="enemy-desc"></div>
    </div>
  </div>
  <div class="state-flags" id="state-flags"></div>
  <div class="choices-label" id="choices-label"></div>
  <div class="choices-grid" id="choices-grid"></div>
</div>

<!-- SCREEN: OUTCOME -->
<div class="screen" id="screen-outcome">
  <div class="outcome-icon" id="outcome-icon"></div>
  <div class="outcome-title" id="outcome-title"></div>
  <div class="outcome-hp-change" id="outcome-hp-change"></div>
  <div class="outcome-message" id="outcome-message"></div>
  <div class="outcome-chain" id="outcome-chain"></div>
  <div class="outcome-context" id="outcome-context"></div>
  <button class="btn-continue" id="btn-continue" onclick="continueFromOutcome()"></button>
</div>

<!-- SCREEN: END -->
<div class="screen" id="screen-end">
  <div class="end-grade" id="end-grade"></div>
  <div class="end-title" id="end-title"></div>
  <div class="end-msg" id="end-msg"></div>
  <div class="end-report" id="end-report">
    <div class="end-report-title" id="end-report-title"></div>
    <div id="report-items"></div>
  </div>
  <button class="btn-replay" id="btn-replay" onclick="resetGame()"></button>
</div>

<script>
// ===== MATRIX RAIN =====
(function(){
  const c=document.getElementById('matrix'),ctx=c.getContext('2d');
  function resize(){c.width=innerWidth;c.height=innerHeight;}
  resize();window.addEventListener('resize',resize);
  const chars='アイウエオカキクサシスセソタチツテトナニヌネノ01';
  let drops=Array(Math.floor(innerWidth/16)).fill(1);
  setInterval(()=>{
    ctx.fillStyle='rgba(6,6,15,0.05)';ctx.fillRect(0,0,c.width,c.height);
    ctx.fillStyle='#00ff41';ctx.font='14px monospace';
    drops.forEach((y,i)=>{ctx.fillText(chars[Math.floor(Math.random()*chars.length)],i*16,y*16);if(y*16>c.height&&Math.random()>.975)drops[i]=0;drops[i]++;});
  },50);
})();

// ===== GAME STATE =====
let lang = 'fr';
let hp = 100;
let currentLevelIndex = 0;
let lastChoiceIndex = -1;
let flags = {
  phoneUpdated: false,
  onPublicWifi: false,
  usingVPN: false,
  suspiciousApp: false,
  clickedPhishing: false,
  allCookiesAccepted: false,
  weakPassword: false,
  phoneCompromised: false,
};
let choiceHistory = [];
let levelsDone = 0;

// ===== TRANSLATIONS =====
const T = {
  fr: {
    langDesc: "Apprends à te défendre contre les cyberattaques en faisant les bons choix !",
    hpLabel: "SÉCURITÉ",
    mapTitle: "CARTE DES MISSIONS",
    mapSub: "SÉLECTIONNE TA PROCHAINE MISSION",
    mapHpSummary: hp => `Niveau de sécurité actuel : ${hp}/100`,
    choicesLabel: "// CHOISIS TON ACTION :",
    continueBtn: "CONTINUER →",
    replayBtn: "↺ REJOUER",
    reportTitle: "// RAPPORT DE MISSION",
    statusDone: "✓ FAIT",
    statusPlay: "▶ JOUER",
    statusLock: "🔒 VERROUILLÉ",
    levelOf: (n,t) => `MISSION ${n} / ${t}`,
    flags: {
      phoneUpdated:      { label: "📱 Téléphone à jour", type: "good" },
      onPublicWifi:      { label: "📡 WiFi public", type: "warn" },
      usingVPN:          { label: "🔐 VPN actif", type: "good" },
      suspiciousApp:     { label: "☠️ App malveillante", type: "bad" },
      clickedPhishing:   { label: "🎣 Phishing cliqué", type: "bad" },
      allCookiesAccepted:{ label: "🍪 Tous cookies acceptés", type: "warn" },
      weakPassword:      { label: "🔓 Mot de passe faible", type: "bad" },
      phoneCompromised:  { label: "⚠️ Appareil compromis", type: "bad" },
    },
    grades: {
      S: { emoji:"🏆", title:"EXPERT CYBER",         msg:"Incroyable ! Tu maîtrises la cybersécurité. Tes données sont en sécurité et tu es un exemple pour ton entourage !" },
      A: { emoji:"🥇", title:"PROTECTEUR DIGITAL",   msg:"Très bien joué ! Tu as fait les bons choix dans la plupart des situations. Continue ainsi !" },
      B: { emoji:"🥈", title:"APPRENTI CYBER",       msg:"Pas mal ! Tu comprends les enjeux mais quelques mauvaises habitudes persistent. Recommence pour faire mieux !" },
      C: { emoji:"🥉", title:"UTILISATEUR VULNÉRABLE",msg:"Attention ! Plusieurs de tes choix ont affaibli ta sécurité. Un hacker aurait pu en profiter..." },
      D: { emoji:"💀", title:"CIBLE FACILE",         msg:"Tes données sont probablement compromises. Un vrai hacker profiterait de chacun de ces mauvais choix. Recommence et apprends !" },
    },
    levels: [
      {
        id:1, icon:"📱", name:"MISE À JOUR CRITIQUE",
        loc:"🏠 Ta chambre · 07h30",
        narrative:"Ton réveil sonne. Tu attrapes ton téléphone et tu vois : <span class='hl'>⚠️ Mise à jour système disponible (correctif de sécurité)</span>.\n\nTu as cours dans 30 minutes. La mise à jour prend environ 10 minutes.",
        enemy: null,
        choices:[
          { icon:"⬆️", text:"Mettre à jour maintenant (10 min)" },
          { icon:"⏰", text:"Me rappeler dans 1 heure" },
          { icon:"❌", text:"Ignorer la notification" },
          { icon:"🚫", text:"Désactiver les mises à jour automatiques" },
        ],
        outcomes:[
          { hpDelta:10, positive:true,  icon:"✅", title:"EXCELLENT CHOIX !", msg:"Ton téléphone est maintenant protégé contre les dernières failles connues.", context:"💡 Les mises à jour corrigent des failles que les hackers exploitent activement. Un appareil à jour est bien plus difficile à pirater.", chain:null, stateChanges:{ phoneUpdated:true } },
          { hpDelta:-5, positive:false, icon:"⚠️", title:"RISQUE TEMPORAIRE", msg:"Tant que la mise à jour n'est pas installée, ton téléphone reste vulnérable.", context:"💡 'Plus tard' devient souvent 'jamais'. Chaque heure sans mise à jour est une heure d'exposition aux failles connues.", chain:null, stateChanges:{} },
          { hpDelta:-15,positive:false, icon:"🔓", title:"VULNÉRABILITÉ OUVERTE !", msg:"En ignorant la mise à jour, tu laisses une porte ouverte. La faille reste exploitable.", context:"💡 Les correctifs existent parce que des chercheurs ont trouvé des failles RÉELLES. Les ignorer, c'est prendre un risque volontaire.", chain:null, stateChanges:{} },
          { hpDelta:-25,positive:false, icon:"☠️", title:"GROSSE ERREUR !", msg:"Sans mises à jour automatiques, ton appareil ne sera jamais corrigé. Tu seras de plus en plus vulnérable.", context:"⚠️ Sans mises à jour, chaque nouvelle faille découverte reste exploitable sur ton appareil pour toujours.", chain:null, stateChanges:{} },
        ]
      },
      {

              const danger = flags.clickedPhishing || flags.suspiciousApp || flags.phoneCompromised;
              if (danger) { dmg -= 20; extra = " WORSE: a hacker with access to your device can now use these cookies to log into your accounts without a password!"; }
              return { hpDelta:dmg, icon:danger?"💀":"🍪", title:danger?"🚨 CRITICAL DANGER!":"BAD HABIT", msg:"You've accepted dozens of trackers that will monitor everything you do online."+extra, chainMsg:danger?"⚠️ Combined with your previous problems, these cookies become a gateway for hackers.":null, extraFlags:{} };

        ]
      },
      {
        id:6, icon:"🔒", name:"PASSWORD",

        enemy:null,
        dynamicEnemy:(flags) => flags.clickedPhishing
          ? { sprite:"🔓", name:"BRUTE FORCE RUNNING", desc:"The phisher is already testing your known passwords on hundreds of sites!" }

        choices:[
          { icon:"🔑", text:"Reuse \"gaming2010\" (it's easier)" },

              let dmg = -20, extra = "";
              if (flags.clickedPhishing) { dmg -= 25; extra += " And since the phisher already knows 'gaming2010', they just gained access to your Gmail and all your other accounts!"; }
              if (flags.allCookiesAccepted && (flags.suspiciousApp || flags.phoneCompromised)) { dmg -= 10; extra += " Combined with the accepted cookies, your complete identity is now in an attacker's hands."; }
              return { hpDelta:dmg, title:dmg<=-40?"💀 ALL ACCOUNTS HACKED!":"CREDENTIAL STUFFING!", msg:"Reusing a password is very dangerous. If this site is hacked, your Gmail is also compromised!"+extra, chainMsg:extra?"⚠️ The accumulation of your bad choices has made this attack devastating.":null, extraFlags:{} };
            }
          },
          { hpDelta:15, positive:true,  icon:"✅", title:"STRONG PASSWORD!", msg:"Long, unique, with uppercase/numbers/symbols = nearly impossible to guess or brute-force.", context:"💡 A 15+ character mixed password would take millions of years to crack. And since it's unique, even if this site is hacked, your other accounts are safe.", chain:null, stateChanges:{} },
          { hpDelta:20, positive:true,  icon:"🏆", title:"PERFECT DECISION!", msg:"A password manager generates ultra-complex, unique passwords for each site. You only need to remember one master password!", context:"💡 Free examples: Bitwarden, KeePass. Recommended by all security experts. 1 password per site = limited damage if a site is hacked.", chain:null, stateChanges:{} },
          { hpDelta:-35,positive:false, icon:"☠️", title:"CRITICAL ERROR!", msg:"'123456' is the most used password in the world. It's on every hacker list. Cracked in under a second.", context:"⚠️ Hackers use 'dictionaries' containing millions of common passwords. '123456', 'password', 'qwerty' = cracked instantly. NEVER.", chain:null, stateChanges:{ weakPassword:true } },
        ]

// ===== GAME ENGINE =====
function getLang(){ return T[lang]; }

function startGame(l){
  lang = l;
  hp = 100;
  currentLevelIndex = 0;
  lastChoiceIndex = -1;
  levelsDone = 0;
  flags = { phoneUpdated:false, onPublicWifi:false, usingVPN:false, suspiciousApp:false, clickedPhishing:false, allCookiesAccepted:false, weakPassword:false, phoneCompromised:false };
  choiceHistory = [];
  document.getElementById('hp-bar').style.display = 'flex';
  updateHPBar();
  showMap();
}

function updateHPBar(){
  hp = Math.max(0, Math.min(100, hp));
  const bar = document.getElementById('hp-bar-inner');
  const val = document.getElementById('hp-value-txt');
  const lbl = document.getElementById('hp-label-txt');
  const lvl = document.getElementById('hp-level-txt');
  const L = getLang();
  lbl.textContent = L.hpLabel;
  bar.style.width = hp + '%';
  val.textContent = hp;
  if(hp >= 70){ bar.style.background='var(--green)'; val.style.color='var(--green)'; }
  else if(hp >= 40){ bar.style.background='var(--yellow)'; val.style.color='var(--yellow)'; }
  else { bar.style.background='var(--red)'; val.style.color='var(--red)'; }
  const missionNum = Math.min(levelsDone + 1, L.levels.length);
  lvl.textContent = L.levelOf(missionNum, L.levels.length);
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-'+id).classList.add('active');
  window.scrollTo(0,0);
}

// ===== MAP =====
function showMap(){
  const L = getLang();
  document.getElementById('map-title').textContent = L.mapTitle;
  document.getElementById('map-sub').textContent = L.mapSub;
  document.getElementById('map-hp-summary').textContent = L.mapHpSummary(hp);

  const path = document.getElementById('map-path');
  path.innerHTML = '';

  L.levels.forEach((lv, i) => {
    const isDone = i < levelsDone;
    const isUnlocked = i === levelsDone;
    const isLocked = i > levelsDone;
    const state = isLocked ? 'locked' : (isDone ? 'completed' : 'unlocked');

    // Connector above (except first)
    if(i > 0){
      const conn = document.createElement('div');
      conn.className = 'map-connector-v' + (i <= levelsDone ? ' done' : '');
      path.appendChild(conn);
    }

    const row = document.createElement('div');
    row.className = 'map-row';

    const node = document.createElement('div');
    node.className = `map-node ${state}`;
    node.style.animationDelay = (i * 0.08) + 's';
    if(!isLocked) node.onclick = () => startLevel(i);

    const badgeText = isDone ? L.statusDone : (isUnlocked ? L.statusPlay : L.statusLock);
    const badgeClass = isDone ? 'badge-done' : (isUnlocked ? 'badge-play' : 'badge-lock');

    node.innerHTML = `
      <div class="map-node-circle">${lv.icon}</div>
      <div class="map-node-info">
        <div class="map-node-name">${lv.name}</div>
        <div class="map-node-loc">${lv.loc}</div>
        <span class="map-node-badge ${badgeClass}">${badgeText}</span>
      </div>`;
    row.appendChild(node);
    path.appendChild(row);
  });

  showScreen('map');
}

// ===== LEVEL =====
function startLevel(idx){
  currentLevelIndex = idx;
  const L = getLang();
  const lv = L.levels[idx];

  document.getElementById('level-num').textContent = L.levelOf(idx+1, L.levels.length);
  document.getElementById('level-title').textContent = lv.name;
  document.getElementById('level-loc').textContent = lv.loc;
  document.getElementById('level-icon').textContent = lv.icon;
  document.getElementById('level-narrative').innerHTML = lv.narrative.replace(/\n/g,'<br>');
  document.getElementById('choices-label').textContent = L.choicesLabel;

  // Enemy
  const enemyEl = document.getElementById('enemy-alert');
  let enemy = null;
  if(typeof lv.dynamicEnemy === 'function') enemy = lv.dynamicEnemy(flags);
  else if(lv.enemy) enemy = lv.enemy;

  if(enemy){
    document.getElementById('enemy-sprite').textContent = enemy.sprite;
    document.getElementById('enemy-name').textContent = enemy.name;
    document.getElementById('enemy-desc').textContent = enemy.desc;
    enemyEl.classList.add('visible');
  } else {
    enemyEl.classList.remove('visible');
  }

  // State flags
  renderFlags();

  // Choices
  const grid = document.getElementById('choices-grid');
  grid.innerHTML = '';
  lv.choices.forEach((ch, i) => {
    const btn = document.createElement('button');
    btn.className = 'btn-choice';
    btn.style.animationDelay = (i * 0.1) + 's';
    btn.innerHTML = `<span class="choice-icon">${ch.icon}</span><span class="choice-text">${ch.text}</span>`;
    btn.onclick = () => makeChoice(i);
    grid.appendChild(btn);
  });

  showScreen('level');
}

function renderFlags(){
  const L = getLang();
  const container = document.getElementById('state-flags');
  container.innerHTML = '';
  Object.entries(flags).forEach(([key, val]) => {
    if(!val) return;
    const def = L.flags[key];
    if(!def) return;
    const badge = document.createElement('span');
    badge.className = `flag-badge flag-${def.type}`;
    badge.textContent = def.label;
    container.appendChild(badge);
  });
}

// ===== CHOICE =====
function makeChoice(choiceIdx){
  const L = getLang();
  const lv = L.levels[currentLevelIndex];
  let outcome = lv.outcomes[choiceIdx];

  // Resolve dynamic outcome if present
  let hpDelta = outcome.hpDelta;
  let title = outcome.title;
  let msg = outcome.msg;
  let chainMsg = outcome.chain;
  let icon = outcome.icon;
  let extraFlags = {};
  let positive = outcome.positive;

  if(typeof outcome.dynamic === 'function'){
    const dyn = outcome.dynamic(flags);
    hpDelta = dyn.hpDelta;
    title = dyn.title;
    msg = dyn.msg;
    chainMsg = dyn.chainMsg || null;
    if(dyn.icon) icon = dyn.icon;
    extraFlags = dyn.extraFlags || {};
    positive = hpDelta >= 0;
  }

  // Apply state changes
  Object.assign(flags, outcome.stateChanges || {}, extraFlags);

  // Apply HP
  hp += hpDelta;
  hp = Math.max(0, Math.min(100, hp));
  updateHPBar();
  levelsDone = Math.max(levelsDone, currentLevelIndex + 1);
  choiceHistory.push({ level: currentLevelIndex, choice: choiceIdx, hpDelta });

  // Show outcome
  const isPos = positive !== undefined ? positive : hpDelta >= 0;
  document.getElementById('outcome-icon').textContent = icon || (isPos ? '✅' : '❌');
  document.getElementById('outcome-icon').style.color = isPos ? 'var(--green)' : 'var(--red)';
  document.getElementById('outcome-title').textContent = title || '';
  document.getElementById('outcome-title').style.color = isPos ? 'var(--green)' : 'var(--red)';

  const hpEl = document.getElementById('outcome-hp-change');
  hpEl.textContent = hpDelta > 0 ? `+${hpDelta} HP` : (hpDelta < 0 ? `${hpDelta} HP` : '±0 HP');
  hpEl.style.color = hpDelta > 0 ? 'var(--green)' : (hpDelta < 0 ? 'var(--red)' : 'var(--cyan)');

  document.getElementById('outcome-message').textContent = msg || '';

  const chainEl = document.getElementById('outcome-chain');
  if(chainMsg){ chainEl.textContent = chainMsg; chainEl.classList.add('visible'); }
  else { chainEl.classList.remove('visible'); }

  const ctxEl = document.getElementById('outcome-context');
  ctxEl.textContent = outcome.context || '';
  ctxEl.style.display = outcome.context ? 'block' : 'none';

  document.getElementById('btn-continue').textContent = L.continueBtn;

  // Body flash
  document.body.style.animation = 'none';
  document.body.offsetHeight; // reflow
  document.body.style.animation = isPos ? 'goodFade 0.8s ease' : 'badFade 0.8s ease';

  showScreen('outcome');
}

function continueFromOutcome(){
  const L = getLang();
  if(levelsDone >= L.levels.length){
    showEndScreen();
  } else {
    showMap();
  }
}

// ===== END SCREEN =====
function showEndScreen(){
  const L = getLang();

  let grade, gradeColor;
  if(hp >= 90)      { grade='S'; gradeColor='var(--green)'; }
  else if(hp >= 70) { grade='A'; gradeColor='var(--cyan)'; }
  else if(hp >= 50) { grade='B'; gradeColor='var(--yellow)'; }
  else if(hp >= 30) { grade='C'; gradeColor='var(--orange)'; }
  else              { grade='D'; gradeColor='var(--red)'; }

  const gradeInfo = L.grades[grade];
  document.getElementById('end-grade').textContent = gradeInfo.emoji;
  document.getElementById('end-grade').style.color = gradeColor;
  document.getElementById('end-title').textContent = gradeInfo.title;
  document.getElementById('end-title').style.color = gradeColor;
  document.getElementById('end-msg').textContent = gradeInfo.msg;
  document.getElementById('end-report-title').textContent = L.reportTitle;

  // Report items
  const items = document.getElementById('report-items');
  items.innerHTML = '';

  const reportDefs = [
    { flag:'phoneUpdated',       good:true,  textGood:{ fr:'📱 Téléphone mis à jour ✔', nl:'📱 Telefoon bijgewerkt ✔', en:'📱 Phone updated ✔' }, textBad:{ fr:'📱 Téléphone non mis à jour ✘', nl:'📱 Telefoon niet bijgewerkt ✘', en:'📱 Phone not updated ✘' } },
    { flag:'onPublicWifi',       good:false, textBad:{ fr:'📡 Connexion sur WiFi public', nl:'📡 Verbonden op openbaar WiFi', en:'📡 Connected to public WiFi' }, textGood:{ fr:'📡 WiFi public évité ✔', nl:'📡 Openbaar WiFi vermeden ✔', en:'📡 Avoided public WiFi ✔' } },
    { flag:'usingVPN',           good:true,  textGood:{ fr:'🔐 VPN utilisé ✔', nl:'🔐 VPN gebruikt ✔', en:'🔐 VPN used ✔' }, textBad:null },
    { flag:'suspiciousApp',      good:false, textBad:{ fr:'☠️ App malveillante installée ✘', nl:'☠️ Schadelijke app geïnstalleerd ✘', en:'☠️ Malicious app installed ✘' }, textGood:null },
    { flag:'clickedPhishing',    good:false, textBad:{ fr:'🎣 Lien de phishing cliqué ✘', nl:'🎣 Phishing-link geklikt ✘', en:'🎣 Clicked a phishing link ✘' }, textGood:null },
    { flag:'allCookiesAccepted', good:false, textBad:{ fr:'🍪 Tous les cookies acceptés', nl:'🍪 Alle cookies aanvaard', en:'🍪 Accepted all cookies' }, textGood:null },
    { flag:'weakPassword',       good:false, textBad:{ fr:'🔓 Mot de passe faible/réutilisé ✘', nl:'🔓 Zwak/hergebruikt wachtwoord ✘', en:'🔓 Weak/reused password ✘' }, textGood:null },
    { flag:'phoneCompromised',   good:false, textBad:{ fr:'⚠️ Appareil compromis ✘', nl:'⚠️ Toestel gecompromitteerd ✘', en:'⚠️ Device compromised ✘' }, textGood:null },
  ];

  reportDefs.forEach(def => {
    const val = flags[def.flag];
    let text = null, type = 'warn';
    if(val && !def.good){
      text = def.textBad ? def.textBad[lang] : null;
      type = 'bad';
    } else if(!val && def.good){
      text = def.textBad ? def.textBad[lang] : null;
      type = 'bad';
    } else if(val && def.good){
      text = def.textGood ? def.textGood[lang] : null;
      type = 'good';
    }
    if(!text) return;
    const div = document.createElement('div');
    div.className = `report-item ${type}`;
    div.innerHTML = `<span class="ri-icon">${type==='good'?'✓':type==='bad'?'✗':'⚠'}</span><span>${text}</span>`;
    items.appendChild(div);
  });

  document.getElementById('btn-replay').textContent = L.replayBtn;
  document.getElementById('hp-bar').style.display = 'none';
  showScreen('end');
}

function resetGame(){
  document.getElementById('hp-bar').style.display = 'none';
  showScreen('lang');
}
