<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CyberQuest Kids</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
/* ===== VARIABLES ===== */
:root {
  --bg:        #06060f;
  --bg2:       #0c0c1e;
  --green:     #00ff41;
  --cyan:      #00e5ff;
  --magenta:   #ff00cc;
  --red:       #ff3355;
  --yellow:    #ffe600;
  --text:      #b8f0b8;
  --text-dim:  #3a6a3a;
  --card-bg:   rgba(0,255,65,0.04);
  --card-border: rgba(0,255,65,0.22);
  --sel-bg:    rgba(0,229,255,0.12);
  --sel-border:#00e5ff;
  --ok-bg:     rgba(0,255,65,0.12);
  --ok-border: #00ff41;
}

/* ===== RESET ===== */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{height:100%;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Share Tech Mono','Courier New',monospace;
  min-height:100vh;
  overflow-x:hidden;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;}

/* ===== SCANLINES ===== */
body::before{
  content:'';
  position:fixed;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.12) 3px,rgba(0,0,0,0.12) 4px);
  pointer-events:none;z-index:9999;
}

/* ===== MATRIX CANVAS ===== */
#matrix{
  position:fixed;inset:0;
  pointer-events:none;
  opacity:0.12;
  z-index:0;
}

/* ===== SCREENS ===== */
.screen{
  display:none;
  min-height:100vh;
  position:relative;
  z-index:1;
  flex-direction:column;
  align-items:center;
}
.screen.active{display:flex;}

/* =============================
   SCREEN 1 — LANGUAGE SELECTION
   ============================= */
#screen-lang{
  justify-content:center;
  gap:2.5rem;
  padding:2rem 1rem;
  text-align:center;
}
.lang-logo{
  font-family:'Orbitron',monospace;
  font-size:clamp(2.5rem,10vw,5rem);
  font-weight:900;
  color:var(--green);
  letter-spacing:.12em;
  text-shadow:0 0 20px var(--green),0 0 50px var(--green);
}
.lang-tagline{
  font-size:.85rem;
  letter-spacing:.2em;
  color:var(--cyan);
  text-transform:uppercase;
}
.lang-buttons{
  display:flex;
  gap:1rem;
  flex-wrap:wrap;
  justify-content:center;
}
.btn-lang{
  padding:1rem 1.8rem;
  font-family:'Orbitron',monospace;
  font-size:1rem;
  font-weight:700;
  color:var(--cyan);
  border:2px solid var(--cyan);
  clip-path:polygon(10px 0%,100% 0%,calc(100% - 10px) 100%,0% 100%);
  transition:all .2s;
  min-width:140px;
  letter-spacing:.1em;
}
.btn-lang:hover,.btn-lang:active{
  background:rgba(0,229,255,.15);
  box-shadow:0 0 25px var(--cyan);
  transform:scale(1.05);
}

/* =============================
   SCREEN 2 — GAME
   ============================= */
#screen-game{
  padding-bottom:1.5rem;
}

/* --- HEADER --- */
.g-header{
  width:100%;
  max-width:860px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:.6rem 1rem;
  border-bottom:1px solid var(--card-border);
  flex-shrink:0;
}
.g-logo{
  font-family:'Orbitron',monospace;
  font-size:1rem;
  font-weight:900;
  color:var(--green);
  text-shadow:0 0 12px var(--green);
  letter-spacing:.1em;
}
.g-right{display:flex;align-items:center;gap:1rem;}
.g-score{
  font-family:'Orbitron',monospace;
  font-size:.95rem;
  color:var(--cyan);
  white-space:nowrap;
}
.g-round{
  font-size:.75rem;
  color:var(--text-dim);
  white-space:nowrap;
}
.lang-mini-row{display:flex;gap:.3rem;}
.lang-mini{
  font-size:.7rem;
  color:var(--text-dim);
  border:1px solid var(--card-border);
  padding:.2rem .45rem;
  transition:all .15s;
  font-family:'Share Tech Mono',monospace;
}
.lang-mini.on,.lang-mini:hover{
  color:var(--green);
  border-color:var(--green);
}

/* --- CATEGORY --- */
.g-category{
  font-family:'Orbitron',monospace;
  font-size:.85rem;
  font-weight:700;
  color:var(--magenta);
  letter-spacing:.15em;
  border:1px solid var(--magenta);
  padding:.4rem 1.4rem;
  margin:.7rem 0 .4rem;
  box-shadow:0 0 18px rgba(255,0,204,.25);
  text-transform:uppercase;
}

/* --- INSTRUCTION --- */
.g-instr{
  font-size:.78rem;
  color:var(--text-dim);
  letter-spacing:.05em;
  margin-bottom:.5rem;
  padding:0 1rem;
  text-align:center;
  transition:color .2s;
}
.g-instr.active-term{color:var(--cyan);}

/* --- PROGRESS DOTS --- */
.g-dots{
  display:flex;gap:.5rem;
  margin-bottom:.7rem;
}
.dot{
  width:10px;height:10px;
  border:1px solid var(--card-border);
  transition:all .3s;
}
.dot.lit{
  background:var(--green);
  border-color:var(--green);
  box-shadow:0 0 8px var(--green);
}

/* --- GAME AREA --- */
.g-area{
  width:100%;
  max-width:860px;
  padding:0 .75rem;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:.8rem;
}

/* TERMS column */
.col-terms,.col-defs{display:flex;flex-direction:column;gap:.5rem;}
.col-label{
  font-size:.65rem;
  color:var(--text-dim);
  text-transform:uppercase;
  letter-spacing:.15em;
  padding:.2rem 0;
  border-bottom:1px solid var(--card-border);
  margin-bottom:.1rem;
}

/* ===== CARDS ===== */
.term-card,.def-card{
  border:1px solid var(--card-border);
  background:var(--card-bg);
  padding:.65rem .9rem;
  min-height:54px;
  display:flex;
  align-items:center;
  cursor:pointer;
  transition:all .2s;
  position:relative;
  user-select:none;
  -webkit-user-select:none;
  line-height:1.35;
  font-size:.83rem;
}

.term-card{
  font-weight:bold;
  color:var(--cyan);
  font-size:.88rem;
  justify-content:center;
  text-align:center;
  clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);
}
.term-card::before{
  content:'';
  position:absolute;left:0;top:10%;bottom:10%;
  width:3px;background:var(--cyan);
}

.def-card{color:var(--text);}
.def-card::before{
  content:'';
  position:absolute;right:0;top:10%;bottom:10%;
  width:3px;background:var(--green);
}

/* hover */
.term-card:hover:not(.ok):not(.no-hover),
.def-card:hover:not(.ok):not(.no-hover){
  background:rgba(0,229,255,.07);
  box-shadow:0 0 14px rgba(0,229,255,.2);
}

/* selected term */
.term-card.sel{
  background:var(--sel-bg);
  border-color:var(--sel-border);
  box-shadow:0 0 22px rgba(0,229,255,.4);
  transform:scale(1.02);
}

/* matched = correct */
.term-card.ok,.def-card.ok{
  background:var(--ok-bg);
  border-color:var(--ok-border);
  opacity:.65;
  pointer-events:none;
  cursor:default;
}
.term-card.ok::after,.def-card.ok::after{
  content:'✓';
  position:absolute;top:3px;right:5px;
  font-size:.7rem;color:var(--green);
}

/* ===== ANIMATIONS ===== */
@keyframes shake{
  0%,100%{transform:translateX(0);}
  20%{transform:translateX(-7px);}
  40%{transform:translateX(7px);}
  60%{transform:translateX(-5px);}
  80%{transform:translateX(5px);}
}
@keyframes wrongFlash{
  0%,100%{border-color:var(--card-border);background:var(--card-bg);}
  50%{border-color:var(--red);background:rgba(255,51,85,.12);}
}
@keyframes correctPulse{
  0%{box-shadow:0 0 5px var(--green);}
  50%{box-shadow:0 0 35px var(--green),0 0 70px rgba(0,255,65,.4);}
  100%{box-shadow:none;}
}
@keyframes glitch{
  0%,85%,100%{}
  87%{text-shadow:-2px 0 var(--magenta),2px 0 var(--cyan),0 0 20px var(--green);transform:skewX(-2deg);}
  90%{text-shadow:2px 0 var(--magenta),-2px 0 var(--cyan),0 0 20px var(--green);transform:skewX(2deg);}
  93%{text-shadow:none;transform:skewX(0);}
}
@keyframes fadeUp{
  0%{opacity:1;transform:translateY(0) scale(1);}
  100%{opacity:0;transform:translateY(-55px) scale(1.4);}
}
@keyframes popIn{
  0%{opacity:0;transform:scale(.8);}
  60%{transform:scale(1.05);}
  100%{opacity:1;transform:scale(1);}
}

.shake{animation:shake .4s ease-in-out;}
.wrong-flash{animation:wrongFlash .4s ease-in-out;}
.correct-pulse{animation:correctPulse .5s ease-in-out;}
.glitch{animation:glitch 5s infinite;}
.pop-in{animation:popIn .35s ease-out;}

/* ===== SCORE POPUP ===== */
.score-pop{
  position:fixed;
  font-family:'Orbitron',monospace;
  font-size:1.4rem;font-weight:900;
  color:var(--green);
  text-shadow:0 0 12px var(--green);
  pointer-events:none;
  z-index:800;
  animation:fadeUp .9s ease-out forwards;
}

/* ===== ROUND OVERLAY ===== */
#overlay{
  display:none;
  position:fixed;inset:0;
  background:rgba(6,6,15,.96);
  z-index:600;
  align-items:center;justify-content:center;
  flex-direction:column;
  gap:1.5rem;
  text-align:center;
  padding:2rem;
}
#overlay.show{display:flex;}
.ov-title{
  font-family:'Orbitron',monospace;
  font-size:clamp(1.6rem,6vw,3rem);
  font-weight:900;
  color:var(--green);
  text-shadow:0 0 30px var(--green);
}
.ov-pts{
  font-family:'Orbitron',monospace;
  font-size:clamp(1.2rem,4vw,1.8rem);
  color:var(--cyan);
}
.ov-tip{
  font-size:.82rem;
  color:var(--text-dim);
  max-width:360px;
  line-height:1.6;
  padding:0 1rem;
}
.btn-next{
  font-family:'Orbitron',monospace;
  font-size:.95rem;font-weight:700;
  color:var(--green);
  border:2px solid var(--green);
  padding:.75rem 2rem;
  clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);
  letter-spacing:.1em;
  transition:all .2s;
  text-transform:uppercase;
}
.btn-next:hover{
  background:rgba(0,255,65,.12);
  box-shadow:0 0 22px var(--green);
}

/* ===== END SCREEN ===== */
#screen-end{
  justify-content:center;
  gap:1.4rem;
  padding:2rem 1rem;
  text-align:center;
}
.end-title{
  font-family:'Orbitron',monospace;
  font-size:clamp(1.8rem,7vw,3.5rem);
  font-weight:900;
  color:var(--green);
  text-shadow:0 0 20px var(--green),0 0 45px var(--green);
}
.end-rank{
  font-family:'Orbitron',monospace;
  font-size:clamp(.9rem,3.5vw,1.3rem);
  color:var(--magenta);
  text-shadow:0 0 15px var(--magenta);
  letter-spacing:.15em;
}
.end-score{
  font-family:'Orbitron',monospace;
  font-size:clamp(2.5rem,10vw,5rem);
  font-weight:900;
  color:var(--cyan);
  text-shadow:0 0 25px var(--cyan);
}
.end-max{
  font-size:.8rem;
  color:var(--text-dim);
  letter-spacing:.1em;
}
.end-msg{
  font-size:.88rem;
  color:var(--text);
  max-width:380px;
  line-height:1.7;
}
.end-bar{
  width:280px;max-width:90vw;
  height:6px;
  background:rgba(0,255,65,.12);
  border:1px solid var(--card-border);
  overflow:hidden;
}
.end-bar-fill{
  height:100%;
  background:var(--green);
  box-shadow:0 0 10px var(--green);
  transition:width 1s ease-out;
  width:0%;
}

/* ===== LIVES ===== */
.g-lives{
  display:flex;gap:.25rem;
  align-items:center;
}
.heart{
  font-size:1.1rem;
  transition:all .3s;
  line-height:1;
}
.heart.full{
  color:var(--red);
  text-shadow:0 0 8px var(--red);
  filter:drop-shadow(0 0 4px var(--red));
}
.heart.empty{
  color:#2a2a2a;
  text-shadow:none;
  filter:none;
}
@keyframes heartLose{
  0%  {transform:scale(1.5);color:var(--red);}
  40% {transform:scale(.6);}
  70% {transform:scale(1.1);}
  100%{transform:scale(1);color:#2a2a2a;filter:none;}
}
.heart.losing{
  animation:heartLose .5s ease-out forwards;
}

/* ===== GAME OVER OVERLAY ===== */
#overlay-go{
  display:none;
  position:fixed;inset:0;
  background:rgba(6,6,15,.97);
  z-index:700;
  align-items:center;justify-content:center;
  flex-direction:column;
  gap:1.4rem;
  text-align:center;
  padding:2rem;
}
#overlay-go.show{display:flex;}
.go-title{
  font-family:'Orbitron',monospace;
  font-size:clamp(2rem,8vw,4rem);
  font-weight:900;
  color:var(--red);
  text-shadow:0 0 25px var(--red),0 0 55px var(--red);
  letter-spacing:.1em;
}
.go-hearts{
  display:flex;gap:.5rem;font-size:2rem;
}
.go-score{
  font-family:'Orbitron',monospace;
  font-size:clamp(1rem,4vw,1.5rem);
  color:var(--cyan);
}
.go-msg{
  font-size:.88rem;
  color:var(--text-dim);
  max-width:340px;
  line-height:1.7;
}
.btn-danger{
  font-family:'Orbitron',monospace;
  font-size:.95rem;font-weight:700;
  color:var(--red);
  border:2px solid var(--red);
  padding:.75rem 2rem;
  clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);
  letter-spacing:.1em;
  transition:all .2s;
  text-transform:uppercase;
}
.btn-danger:hover{
  background:rgba(255,51,85,.15);
  box-shadow:0 0 22px var(--red);
}

/* ===== RESPONSIVE ===== */
@media(max-width:520px){
  .g-area{gap:.5rem;}
  .term-card{font-size:.78rem;padding:.55rem .65rem;min-height:46px;}
  .def-card{font-size:.73rem;padding:.55rem .65rem;min-height:46px;}
  .g-category{font-size:.72rem;padding:.35rem 1rem;}
  .g-logo{font-size:.85rem;}
  .g-score{font-size:.82rem;}
}
@media(max-width:380px){
  .term-card{font-size:.7rem;}
  .def-card{font-size:.67rem;}
}
</style>
</head>
<body>

<!-- MATRIX RAIN CANVAS -->
<canvas id="matrix"></canvas>

<!-- ============================
     SCREEN 1 : LANGUAGE PICK
     ============================ -->
<div id="screen-lang" class="screen active">
  <div class="lang-logo glitch">CYBERQUEST</div>
  <div class="lang-tagline" id="lt">Select your language / Choisissez / Kies uw taal</div>
  <div class="lang-buttons">
    <button class="btn-lang" onclick="startGame('fr')">🇫🇷 FRANÇAIS</button>
    <button class="btn-lang" onclick="startGame('nl')">🇧🇪 NEDERLANDS</button>
    <button class="btn-lang" onclick="startGame('en')">🇬🇧 ENGLISH</button>
  </div>
</div>

<!-- ============================
     SCREEN 2 : GAME
     ============================ -->
<div id="screen-game" class="screen">
  <!-- Header -->
  <div class="g-header">
    <div class="g-logo glitch">CYBERQUEST</div>
    <div class="g-right">
      <div class="lang-mini-row">
        <button class="lang-mini" id="ml-fr" onclick="switchLang('fr')">FR</button>
        <button class="lang-mini" id="ml-nl" onclick="switchLang('nl')">NL</button>
        <button class="lang-mini" id="ml-en" onclick="switchLang('en')">EN</button>
      </div>
      <div class="g-lives" id="g-lives">
        <span class="heart full" id="h1">♥</span>
        <span class="heart full" id="h2">♥</span>
        <span class="heart full" id="h3">♥</span>
      </div>
      <div class="g-round" id="g-round">LVL 1/4</div>
      <div class="g-score"><span id="lbl-score">SCORE</span>: <span id="g-score-val">0</span></div>
    </div>
  </div>
  <!-- Category -->
  <div class="g-category" id="g-cat">🔐 PASSWORDS</div>
  <!-- Instruction -->
  <div class="g-instr" id="g-instr">...</div>
  <!-- Progress dots -->
  <div class="g-dots" id="g-dots"></div>
  <!-- Play area -->
  <div class="g-area">
    <div class="col-terms">
      <div class="col-label" id="lbl-terms">TERMS</div>
      <div id="terms-col"></div>
    </div>
    <div class="col-defs">
      <div class="col-label" id="lbl-defs">DEFINITIONS</div>
      <div id="defs-col"></div>
    </div>
  </div>
</div>

<!-- ============================
     SCREEN 3 : END
     ============================ -->
<div id="screen-end" class="screen">
  <div class="end-title glitch" id="end-title">MISSION COMPLETE</div>
  <div class="end-rank" id="end-rank">[ CYBER MASTER ]</div>
  <div class="end-score" id="end-score">0</div>
  <div class="end-max" id="end-max">/ 200 pts</div>
  <div class="end-bar"><div class="end-bar-fill" id="end-bar-fill"></div></div>
  <div class="end-msg" id="end-msg"></div>
  <button class="btn-next" id="btn-restart" onclick="restart()">↩ RESTART</button>
</div>

<!-- ============================
     OVERLAY : GAME OVER
     ============================ -->
<div id="overlay-go">
  <div class="go-title glitch" id="go-title">GAME OVER</div>
  <div class="go-hearts">💀</div>
  <div class="go-score" id="go-score">SCORE: 0</div>
  <div class="go-msg" id="go-msg">Tu as épuisé toutes tes vies. Retente ta chance !</div>
  <button class="btn-danger" id="btn-go-restart" onclick="restart()">↩ RESTART</button>
</div>

<!-- ============================
     OVERLAY : ROUND COMPLETE
     ============================ -->
<div id="overlay">
  <div class="ov-title glitch pop-in" id="ov-title">LEVEL COMPLETE!</div>
  <div class="ov-pts pop-in" id="ov-pts">+50 POINTS</div>
  <div class="ov-tip pop-in" id="ov-tip"></div>
  <button class="btn-next pop-in" id="btn-next-lvl" onclick="nextRound()">NEXT LEVEL ▶</button>
</div>

<script>
/* =============================================
   TRANSLATIONS + CONTENT
   ============================================= */
const T = {
  fr:{
    score:'SCORE', terms:'TERMES', defs:'DÉFINITIONS',
    lvl:'NVX',
    instr:'Sélectionne un terme, puis sa définition',
    instrSel: t=>`« ${t} » — Sélectionne la bonne définition`,
    instrNone:'Sélectionne d\'abord un terme !',
    lvlComplete:'NIVEAU TERMINÉ !',
    pts: n=>`+${n} POINTS`,
    nextLvl:'NIVEAU SUIVANT ▶',
    results:'RÉSULTATS ▶',
    missionComplete:'MISSION ACCOMPLIE',
    restart:'↩ REJOUER',
    scoreOn: n=>`/ ${n} pts`,
    gameOver:'GAME OVER',
    gameOverMsg:'Tu as épuisé tes 3 vies. Retente ta chance !',
    gameOverScore: n=>`SCORE FINAL : ${n}`,
    goRestart:'↩ RÉESSAYER',
    tips:[
      'Utilise un gestionnaire de mots de passe comme Bitwarden ou KeePass — gratuit et sécurisé !',
      'Active toujours la double authentification (2FA) sur tes comptes importants.',
      'Ne partage jamais tes données personnelles sur des sites non vérifiés.',
      'Mets à jour tes appareils dès qu\'une mise à jour est disponible — ça bouche les failles !',
    ],
    ranks:[
      {min:0,  title:'SCRIPT KIDDIE',   msg:'Continue à t\'entraîner, tu peux faire mieux ! La cybersécurité s\'apprend pas à pas.'},
      {min:50, title:'APPRENTI CYBER',  msg:'Pas mal ! Tes bases commencent à se former. Continue !'},
      {min:100,title:'CYBER DEFENDER',  msg:'Bien joué ! Tu sais te protéger en ligne. Continue d\'apprendre !'},
      {min:160,title:'CYBER MASTER',    msg:'Excellent ! Tu maîtrises la cybersécurité comme un pro. Bravo !'},
    ],
    rounds:[
      {
        cat:'🔐 MOTS DE PASSE',
        pairs:[
          {term:'Phishing',             def:'Faux e-mail pour voler tes identifiants'},
          {term:'2FA',                  def:'2ème vérification pour sécuriser ton compte'},
          {term:'Mot de passe fort',    def:'12+ caractères : lettres, chiffres, symboles'},
          {term:'Gestionnaire',         def:'Coffre-fort numérique pour tes mots de passe'},
          {term:'Brute force',          def:'L\'ordi teste toutes les combinaisons possibles'},
        ]
      },
      {
        cat:'⚠️ MENACES',
        pairs:[
          {term:'Malware',             def:'Logiciel malveillant qui attaque ton appareil'},
          {term:'Ransomware',          def:'Virus qui bloque tes fichiers contre rançon'},
          {term:'Social engineering', def:'Manipulation pour te faire divulguer des infos'},
          {term:'DDoS',               def:'Attaque qui paralyse un serveur avec du trafic'},
          {term:'Zero-day',           def:'Faille inconnue exploitée avant d\'être corrigée'},
        ]
      },

/* =============================================
   GAME STATE
   ============================================= */
let lang = 'fr';
let roundIdx = 0;
let score = 0;
let lives = 3;
let selTermIdx = null;   // currently selected term index (in shuffledT)
let matchedCount = 0;
let shuffledT = [];      // shuffled term objects {term, def, origIdx}
let shuffledD = [];      // shuffled def objects  {term, def, origIdx}
let matchedTSet = new Set();
let matchedDSet = new Set();

/* =============================================
   MATRIX RAIN
   ============================================= */
(function(){
  const canvas = document.getElementById('matrix');
  const ctx = canvas.getContext('2d');
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*/\\<>{}[]ΩΦΨπδλ';
  let cols, drops;

  function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    cols = Math.floor(canvas.width / 16);
    drops = Array(cols).fill(1);
  }
  resize();
  window.addEventListener('resize', resize);

  setInterval(()=>{
    ctx.fillStyle = 'rgba(6,6,15,0.05)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#00ff41';
    ctx.font = '13px Share Tech Mono, monospace';
    for(let i = 0; i < drops.length; i++){
      const c = chars[Math.floor(Math.random() * chars.length)];
      ctx.fillText(c, i * 16, drops[i] * 16);
      if(drops[i] * 16 > canvas.height && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
  }, 60);
})();

/* =============================================
   AUDIO (Web Audio API — minimal beeps)
   ============================================= */
let audioCtx = null;
function getAudioCtx(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function beep(freq, dur, type='square', vol=0.08){
  try{
    const ac = getAudioCtx();
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.connect(gain); gain.connect(ac.destination);
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
    osc.start(); osc.stop(ac.currentTime + dur);
  } catch(e){}
}
function soundOk(){  beep(880, .08); setTimeout(()=>beep(1200,.1),80); }
function soundErr(){ beep(180, .15,'sawtooth'); }
function soundLvl(){ beep(440,.1);setTimeout(()=>beep(660,.1),110);setTimeout(()=>beep(880,.2),220); }
function soundDead(){
  beep(220,.2,'sawtooth',.12);
  setTimeout(()=>beep(150,.3,'sawtooth',.12),200);
  setTimeout(()=>beep(100,.5,'sawtooth',.1),500);
}

/* =============================================
   HELPERS
   ============================================= */
function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function updateLangBtns(){
  ['fr','nl','en'].forEach(l=>{
    const b = document.getElementById('ml-'+l);
    if(b) b.classList.toggle('on', l===lang);
  });
}

/* =============================================
   GAME START / LANGUAGE
   ============================================= */
function startGame(l){
  lang = l;
  score = 0;
  lives = 3;
  roundIdx = 0;
  showScreen('screen-game');
  updateLangBtns();
  buildRound();
}
function switchLang(l){
  lang = l;
  updateLangBtns();
  // Rebuild current round in new language (preserve score & lives)
  buildRound();
}
function restart(){
  score = 0; roundIdx = 0; lives = 3;
  document.getElementById('overlay-go').classList.remove('show');
  showScreen('screen-lang');
}

/* =============================================
   BUILD ROUND
   ============================================= */
function buildRound(){
  const t = T[lang];
  const round = t.rounds[roundIdx];
  selTermIdx = null;
  matchedCount = 0;
  matchedTSet = new Set();
  matchedDSet = new Set();

  // Shuffle terms and defs independently
  const n = round.pairs.length;
  const tOrder = shuffle([...Array(n).keys()]);
  const dOrder = shuffle([...Array(n).keys()]);
  shuffledT = tOrder.map(i=>({...round.pairs[i], origIdx:i}));
  shuffledD = dOrder.map(i=>({...round.pairs[i], origIdx:i}));

  // Update header
  document.getElementById('g-cat').textContent = round.cat;
  document.getElementById('g-round').textContent = `${t.lvl} ${roundIdx+1}/4`;
  document.getElementById('g-score-val').textContent = score;
  document.getElementById('lbl-score').textContent = t.score;
  document.getElementById('lbl-terms').textContent = t.terms;
  document.getElementById('lbl-defs').textContent = t.defs;
  document.getElementById('g-instr').textContent = t.instr;
  document.getElementById('g-instr').classList.remove('active-term');

  // Progress dots
  const dots = document.getElementById('g-dots');
  dots.innerHTML = '';
  for(let i=0;i<n;i++){
    const d = document.createElement('div');
    d.className = 'dot'; d.id = 'dot-'+i;
    dots.appendChild(d);
  }

  // Lives display
  updateLivesDisplay();

  // Render cards
  renderCards();
}

/* =============================================
   LIVES
   ============================================= */
function updateLivesDisplay(losingIdx){
  // losingIdx = 0,1,2 (the heart that just broke), or undefined
  for(let i=1;i<=3;i++){
    const h = document.getElementById('h'+i);
    if(!h) continue;
    if(i <= lives){
      h.className = 'heart full';
    } else {
      if(losingIdx !== undefined && i === lives+1){
        // trigger break animation
        h.className = 'heart losing';
        setTimeout(()=>{ h.classList.remove('losing'); h.classList.add('empty'); }, 500);
      } else {
        h.className = 'heart empty';
      }
    }
  }
}

function showGameOver(){
  soundDead();
  const t = T[lang];
  document.getElementById('go-title').textContent  = t.gameOver;
  document.getElementById('go-score').textContent  = t.gameOverScore(score);
  document.getElementById('go-msg').textContent    = t.gameOverMsg;
  document.getElementById('btn-go-restart').textContent = t.goRestart;
  document.getElementById('overlay-go').classList.add('show');

  // Score partiel — highScore uniquement
  if (score > 0) _submitWorkshopScore('cyberquest-match', score);
}

function renderCards(){
  const tCol = document.getElementById('terms-col');
  const dCol = document.getElementById('defs-col');
  tCol.innerHTML = ''; dCol.innerHTML = '';
  tCol.style.cssText = 'display:flex;flex-direction:column;gap:.5rem;';
  dCol.style.cssText = 'display:flex;flex-direction:column;gap:.5rem;';

  shuffledT.forEach((item,idx)=>{
    const el = document.createElement('div');
    el.className = 'term-card';
    el.id = 'tc-'+idx;
    el.textContent = item.term;
    if(matchedTSet.has(idx)) el.classList.add('ok');
    el.addEventListener('click',()=>onTermClick(idx));
    tCol.appendChild(el);
  });

  shuffledD.forEach((item,idx)=>{
    const el = document.createElement('div');
    el.className = 'def-card';
    el.id = 'dc-'+idx;
    el.textContent = item.def;
    if(matchedDSet.has(idx)) el.classList.add('ok');
    el.addEventListener('click',()=>onDefClick(idx));
    dCol.appendChild(el);
  });
}

/* =============================================
   INTERACTION
   ============================================= */
function onTermClick(idx){
  if(matchedTSet.has(idx)) return;
  const t = T[lang];

  // Deselect all terms
  document.querySelectorAll('.term-card.sel').forEach(c=>c.classList.remove('sel'));

  if(selTermIdx === idx){
    // Toggle off
    selTermIdx = null;
    document.getElementById('g-instr').textContent = t.instr;
    document.getElementById('g-instr').classList.remove('active-term');
  } else {
    selTermIdx = idx;
    document.getElementById('tc-'+idx).classList.add('sel');
    document.getElementById('g-instr').textContent = t.instrSel(shuffledT[idx].term);
    document.getElementById('g-instr').classList.add('active-term');
  }
}

function onDefClick(defIdx){
  if(matchedDSet.has(defIdx)) return;
  const t = T[lang];

  if(selTermIdx === null){
    // Hint: select term first
    const instr = document.getElementById('g-instr');
    const prev = instr.textContent;
    instr.style.color = 'var(--red)';
    instr.textContent = t.instrNone;
    setTimeout(()=>{ instr.style.color=''; instr.textContent = prev; }, 900);
    return;
  }

  const termOrig = shuffledT[selTermIdx].origIdx;
  const defOrig  = shuffledD[defIdx].origIdx;

  if(termOrig === defOrig){
    // ✅ CORRECT
    const tEl = document.getElementById('tc-'+selTermIdx);
    const dEl = document.getElementById('dc-'+defIdx);

    tEl.classList.remove('sel');
    tEl.classList.add('ok','correct-pulse');
    dEl.classList.add('ok','correct-pulse');

    matchedTSet.add(selTermIdx);
    matchedDSet.add(defIdx);

    document.getElementById('dot-'+matchedCount).classList.add('lit');
    matchedCount++;
    score += 10;
    document.getElementById('g-score-val').textContent = score;

    // Score popup
    showScorePop('+10', dEl);
    soundOk();

    selTermIdx = null;
    document.getElementById('g-instr').textContent = T[lang].instr;
    document.getElementById('g-instr').classList.remove('active-term');

    setTimeout(()=>{ tEl.classList.remove('correct-pulse'); dEl.classList.remove('correct-pulse'); }, 600);

    if(matchedCount === shuffledT.length) setTimeout(onRoundComplete, 700);

  } else {
    // ❌ WRONG — perd une vie
    const tEl = document.getElementById('tc-'+selTermIdx);
    const dEl = document.getElementById('dc-'+defIdx);
    tEl.classList.add('shake');
    dEl.classList.add('wrong-flash');
    soundErr();
    setTimeout(()=>{ tEl.classList.remove('shake'); dEl.classList.remove('wrong-flash'); }, 500);

    lives--;
    updateLivesDisplay(lives); // passe l'index du cœur qui vient de casser

    // Popup perte de vie
    showScorePop('💔', dEl);

    if(lives <= 0){
      setTimeout(showGameOver, 600);
    }
  }
}

function showScorePop(text, nearEl){
  const pop = document.createElement('div');
  pop.className = 'score-pop';
  pop.textContent = text;
  const r = nearEl.getBoundingClientRect();
  pop.style.left = (r.left + r.width/2 - 18) + 'px';
  pop.style.top  = (r.top + window.scrollY - 5) + 'px';
  document.body.appendChild(pop);
  setTimeout(()=>pop.remove(), 950);
}

/* =============================================
   ROUND COMPLETE
   ============================================= */
function onRoundComplete(){
  soundLvl();
  const t = T[lang];
  const pts = matchedCount * 10;
  const tipText = t.tips[roundIdx % t.tips.length];

  document.getElementById('ov-title').textContent = t.lvlComplete;
  document.getElementById('ov-pts').textContent = t.pts(pts);
  document.getElementById('ov-tip').textContent = '💡 ' + tipText;
  document.getElementById('btn-next-lvl').textContent = roundIdx < 3 ? t.nextLvl : t.results;
  document.getElementById('overlay').classList.add('show');
}

function nextRound(){
  document.getElementById('overlay').classList.remove('show');
  roundIdx++;
  if(roundIdx >= 4) showEnd();
  else buildRound();
}

/* =============================================
   END SCREEN
   ============================================= */
function showEnd(){
  showScreen('screen-end');
  const t = T[lang];
  const maxScore = 200;
  const pct = Math.round((score / maxScore) * 100);

  let rank = t.ranks[0];
  for(const r of t.ranks) if(score >= r.min) rank = r;

  document.getElementById('end-title').textContent = t.missionComplete;
  document.getElementById('end-rank').textContent = '[ ' + rank.title + ' ]';
  document.getElementById('end-score').textContent = score;
  document.getElementById('end-max').textContent = t.scoreOn(maxScore);
  document.getElementById('end-msg').textContent = rank.msg;
  document.getElementById('btn-restart').textContent = t.restart;

  // Animate bar
  setTimeout(()=>{
    document.getElementById('end-bar-fill').style.width = pct + '%';
  }, 200);

  // Submit score to workshop — highScore uniquement
  _submitWorkshopScore('cyberquest-match', score);
}

function _submitWorkshopScore(activity, points) {
  const teamId = (document.cookie.match('(?:^|;)\\s*cq_team=([^;]*)') || [])[1];
  if (!teamId || points <= 0) return;
  const key  = 'hs_' + activity;
  const prev = parseInt(sessionStorage.getItem(key) || '0', 10);
  if (points <= prev) return;
  sessionStorage.setItem(key, String(points));
  fetch('/workshop/score', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ team_id: decodeURIComponent(teamId), activity, points: points - prev }),
  }).catch(() => {});
}
