<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DO NOT PRESS — CyberQuest</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #020a02;
  --green:    #00ff41;
  --g2:       #00cc33;
  --gdim:     rgba(0,255,65,0.18);
  --gdark:    #001a08;
  --red:      #ff2222;
  --yellow:   #ffe600;
  --magenta:  #ff00cc;
  --cyan:     #00e5ff;
  --orange:   #ff8800;
  --text:     #b8f0b8;
  --textdim:  #3a6a3a;
  --card:     rgba(0,255,65,0.04);
  --cardb:    rgba(0,255,65,0.18);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;}
body{
  background:var(--bg);
  font-family:'Share Tech Mono',monospace;
  color:var(--text);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.1) 3px,rgba(0,0,0,0.1) 4px);pointer-events:none;z-index:9999;}
#matrix{position:fixed;inset:0;pointer-events:none;opacity:0.08;z-index:0;}

/* ===== ANIMATIONS ===== */
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.04);}}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.2;}}
@keyframes glow{0%,100%{text-shadow:0 0 10px currentColor;}50%{text-shadow:0 0 30px currentColor,0 0 60px currentColor;}}
@keyframes shake{0%,100%{transform:translate(0,0)}10%{transform:translate(-5px,3px)}20%{transform:translate(5px,-3px)}30%{transform:translate(-4px,5px)}40%{transform:translate(4px,-5px)}50%{transform:translate(-5px,2px)}60%{transform:translate(5px,-2px)}70%{transform:translate(-3px,5px)}80%{transform:translate(3px,-5px)}90%{transform:translate(-4px,3px)}}
@keyframes pop{from{opacity:0;transform:scale(.5)translateY(20px)}to{opacity:1;transform:scale(1)translateY(0)}}
@keyframes slideup{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes flash-g{0%{opacity:.7}100%{opacity:0}}
@keyframes flash-r{0%{opacity:.6}100%{opacity:0}}
@keyframes inv-pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,0,204,0)}50%{box-shadow:0 0 40px 8px rgba(255,0,204,0.25)}}
@keyframes btn-breathe{0%,100%{box-shadow:0 0 0 4px #001a08,0 0 0 7px rgba(0,255,65,0.2),0 0 30px 6px rgba(0,255,65,0.2),inset 0 -8px 20px rgba(0,0,0,.6)}50%{box-shadow:0 0 0 4px #001a08,0 0 0 7px rgba(0,255,65,0.5),0 0 55px 14px rgba(0,255,65,0.35),inset 0 -8px 20px rgba(0,0,0,.6)}}
@keyframes context-in{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}

/* ===== LANG BAR ===== */
.lang-bar{position:fixed;top:.8rem;right:.8rem;z-index:500;display:flex;gap:.4rem;}
.lbtn{padding:.28rem .65rem;font-family:'Orbitron',monospace;font-size:.58rem;letter-spacing:.1em;border:1px solid rgba(0,255,65,0.25);color:rgba(0,255,65,0.5);background:rgba(0,255,65,0.03);border-radius:3px;cursor:pointer;transition:all .2s;}
.lbtn:hover,.lbtn.on{border-color:var(--green);color:var(--green);background:rgba(0,255,65,0.08);}

/* ===== LEVEL COUNTER ===== */
.lvl-bar{position:fixed;top:.8rem;left:.8rem;z-index:500;font-family:'Orbitron',monospace;font-size:.6rem;color:var(--textdim);letter-spacing:.1em;}
.lvl-bar span{color:var(--green);}

/* ===== INVERSE BADGE ===== */
#inv-badge{
  position:fixed;top:2.8rem;left:50%;transform:translateX(-50%);
  z-index:500;display:none;
  font-family:'Orbitron',monospace;font-size:.65rem;font-weight:700;
  letter-spacing:.15em;
  background:rgba(255,0,204,0.12);border:1px solid rgba(255,0,204,0.5);
  color:var(--magenta);padding:.3rem 1rem;border-radius:3px;
  animation:blink 1s infinite;
}
#inv-badge.show{display:block;}
#mash-badge{
  position:fixed;top:2.8rem;left:50%;transform:translateX(-50%);
  z-index:500;display:none;
  font-family:'Orbitron',monospace;font-size:.65rem;font-weight:700;
  letter-spacing:.15em;
  background:rgba(255,136,0,0.12);border:1px solid rgba(255,136,0,0.6);
  color:var(--orange);padding:.3rem 1rem;border-radius:3px;
  animation:mash-bounce .6s infinite;
}
#mash-badge.show{display:block;}
#mash-info{display:none;flex-direction:column;align-items:center;gap:.2rem;margin-top:-.3rem;}
#mash-target-lbl{font-size:.65rem;letter-spacing:.12em;color:var(--orange);text-align:center;}

/* ===== MAIN LAYOUT ===== */
#game{
  position:relative;z-index:10;
  width:100%;max-width:540px;
  display:flex;flex-direction:column;
  align-items:center;
  gap:clamp(.8rem,2.5vh,1.5rem);
  padding:clamp(3.5rem,8vh,5rem) 1.2rem clamp(1rem,3vh,2rem);
}

/* ===== CONTEXT BOX ===== */
#context-box{
  width:100%;
  background:var(--card);
  border:1px solid var(--cardb);
  border-radius:8px;
  padding:clamp(.9rem,2.5vw,1.4rem);
  min-height:clamp(80px,18vh,130px);
  display:flex;align-items:center;justify-content:center;
  text-align:center;
  transition:border-color .4s,background .4s;
}
#context-box.inv{border-color:rgba(255,0,204,0.4);background:rgba(255,0,204,0.04);}
#context-txt{
  font-size:clamp(.78rem,2.2vw,1rem);
  line-height:1.7;
  color:var(--text);
  animation:context-in .35s ease both;
  white-space:pre-line;
}
#context-txt .hl{color:var(--yellow);}
#context-txt .red{color:var(--red);}
#context-txt .inv-tag{color:var(--magenta);font-weight:bold;}

/* ===== BUTTON AREA ===== */
.btn-area{
  position:relative;
  width:clamp(200px,42vw,300px);
  height:clamp(200px,42vw,300px);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.outer-glow{position:absolute;inset:-6px;border-radius:50%;pointer-events:none;transition:box-shadow .4s;}
.outer-glow.normal{box-shadow:0 0 40px 6px rgba(0,255,65,0.1);}
.outer-glow.inv{box-shadow:0 0 40px 10px rgba(255,0,204,0.15);}
.outer-glow.mash{box-shadow:0 0 40px 10px rgba(255,136,0,0.25);}
@keyframes mash-bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes orange-breathe{0%,100%{box-shadow:0 0 0 4px #1a0800,0 0 0 7px rgba(255,136,0,0.25),0 0 35px 8px rgba(255,136,0,0.2),inset 0 -8px 20px rgba(0,0,0,.6)}50%{box-shadow:0 0 0 4px #1a0800,0 0 0 7px rgba(255,136,0,0.55),0 0 55px 14px rgba(255,136,0,0.38),inset 0 -8px 20px rgba(0,0,0,.6)}}
#ring-canvas{position:absolute;inset:0;width:100%;height:100%;}

/* Main button */
#the-btn{
  position:relative;
  width:60%;height:60%;
  border-radius:50%;
  border:none;cursor:pointer;outline:none;
  background:radial-gradient(circle at 35% 35%, #1a3a1a, #0a1a0a 60%, var(--bg));
  transition:transform .12s,filter .3s,background .4s;
  animation:btn-breathe 2.8s ease-in-out infinite;
}
#the-btn.inv{
  background:radial-gradient(circle at 35% 35%, #3a0a30, #1a0514 60%, var(--bg));
  animation:inv-pulse 2s ease-in-out infinite;
}
#the-btn.mash{
  background:radial-gradient(circle at 35% 35%, #3a1800, #1a0a00 60%, var(--bg));
  animation:orange-breathe 1.2s ease-in-out infinite;
}
#the-btn:active{transform:scale(.93);}
#the-btn::after{content:'';position:absolute;top:12%;left:18%;width:36%;height:22%;background:radial-gradient(ellipse,rgba(255,255,255,0.07),transparent);border-radius:50%;transform:rotate(-20deg);pointer-events:none;}
.btn-inner{position:absolute;inset:0;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.25rem;padding:.8rem;}
#btn-txt{
  font-family:'Orbitron',monospace;
  font-size:clamp(.55rem,2.2vw,.82rem);
  font-weight:700;
  letter-spacing:.06em;
  text-align:center;
  line-height:1.3;
  color:var(--green);
  text-shadow:0 0 12px var(--green),0 0 25px rgba(0,255,65,0.3);
  transition:color .3s,text-shadow .3s;
  word-break:break-word;
}
#btn-txt.inv{color:var(--magenta);text-shadow:0 0 12px var(--magenta),0 0 25px rgba(255,0,204,0.3);}
#btn-txt.mash{color:var(--orange);text-shadow:0 0 12px var(--orange),0 0 25px rgba(255,136,0,0.4);font-size:clamp(.8rem,3vw,1.3rem);}

/* ===== TIMER ===== */
#timer-wrap{display:flex;flex-direction:column;align-items:center;gap:.15rem;}
#timer-val{font-family:'Orbitron',monospace;font-size:clamp(1.2rem,4vw,1.9rem);font-weight:700;letter-spacing:.1em;color:var(--green);text-shadow:0 0 10px var(--green);transition:color .3s,text-shadow .3s;}
#timer-val.warn{color:var(--yellow);text-shadow:0 0 10px var(--yellow);}
#timer-val.danger{color:var(--red);text-shadow:0 0 12px var(--red);animation:blink .4s infinite;}
#timer-lbl{font-size:.58rem;letter-spacing:.2em;color:var(--textdim);text-transform:uppercase;}

/* ===== OVERLAYS ===== */
#flash{position:fixed;inset:0;z-index:800;pointer-events:none;opacity:0;}
#flash.go-g{animation:flash-g .45s ease-out forwards;background:rgba(0,255,65,0.45);}
#flash.go-r{animation:flash-r .45s ease-out forwards;background:rgba(255,30,30,0.55);}

/* ===== GAME OVER ===== */
#over-screen{
  position:fixed;inset:0;z-index:600;
  display:none;flex-direction:column;
  align-items:center;justify-content:center;
  gap:1.2rem;text-align:center;padding:1.5rem;
  background:radial-gradient(circle at 50% 40%,rgba(60,0,0,.75),rgba(2,10,2,.97));
}
#over-screen.show{display:flex;}
.over-icon{font-size:clamp(3.5rem,12vw,6rem);animation:pop .4s cubic-bezier(.3,1.6,.5,1) both;}
.over-lvl{font-family:'Orbitron',monospace;font-size:.65rem;color:rgba(255,34,34,0.7);letter-spacing:.2em;animation:slideup .4s .05s both;}
.over-title{font-family:'Orbitron',monospace;font-size:clamp(1.2rem,5vw,2rem);font-weight:900;color:var(--red);animation:pop .45s .1s cubic-bezier(.3,1.6,.5,1) both;}
.over-why{
  font-size:clamp(.72rem,2.2vw,.88rem);line-height:1.75;max-width:440px;
  background:rgba(255,34,34,0.07);border:1px solid rgba(255,34,34,0.25);
  border-radius:6px;padding:1rem 1.2rem;color:#f0b8b8;
  animation:slideup .4s .2s both;
}
.over-tip{font-size:clamp(.65rem,2vw,.78rem);max-width:400px;color:var(--textdim);line-height:1.65;animation:slideup .4s .3s both;}
.btn-action{padding:.8rem 2.5rem;font-family:'Orbitron',monospace;font-weight:700;letter-spacing:.12em;font-size:.82rem;border-radius:4px;cursor:pointer;transition:all .2s;animation:slideup .4s .4s both;}
.btn-red{border:2px solid var(--red);color:var(--red);background:rgba(255,34,34,0.06);}
.btn-red:hover{background:rgba(255,34,34,0.2);box-shadow:0 0 20px var(--red);}

/* ===== VICTORY ===== */
#win-screen{
  position:fixed;inset:0;z-index:600;
  display:none;flex-direction:column;
  align-items:center;justify-content:center;
  gap:1rem;text-align:center;padding:1.5rem;
  background:radial-gradient(circle at 50% 40%,rgba(0,50,15,.7),rgba(2,10,2,.97));
  overflow-y:auto;
}
#win-screen.show{display:flex;}
.win-icon{font-size:clamp(3rem,10vw,5rem);animation:pop .5s cubic-bezier(.3,1.6,.5,1) both;}
.win-title{font-family:'Orbitron',monospace;font-size:clamp(1rem,4vw,1.8rem);font-weight:900;color:var(--green);animation:glow 2s infinite;letter-spacing:.1em;}
.win-msg{font-size:clamp(.72rem,2vw,.88rem);max-width:420px;color:var(--textdim);line-height:1.7;}
.lessons{width:100%;max-width:440px;background:var(--card);border:1px solid var(--cardb);border-radius:8px;padding:1rem 1.2rem;text-align:left;}
.lessons-title{font-family:'Orbitron',monospace;font-size:.6rem;color:var(--textdim);letter-spacing:.18em;margin-bottom:.7rem;}
.lesson-item{display:flex;align-items:flex-start;gap:.5rem;font-size:.68rem;line-height:1.5;margin:.3rem 0;color:var(--text);}
.lesson-item.good .li{color:var(--green);}
.lesson-item.bad .li{color:var(--red);}
.win-time{font-family:'Orbitron',monospace;font-size:clamp(.85rem,3vw,1.3rem);font-weight:700;color:var(--cyan);letter-spacing:.1em;text-shadow:0 0 12px var(--cyan);animation:glow 2s infinite;}
.btn-green{border:2px solid var(--green);color:var(--green);background:rgba(0,255,65,0.06);}
.btn-green:hover{background:rgba(0,255,65,0.18);box-shadow:0 0 20px var(--green);}
</style>
</head>
<body>
<canvas id="matrix"></canvas>
<div id="flash"></div>

<div class="lang-bar">
  <button class="lbtn on" id="lb-fr" onclick="setLang('fr')">FR</button>
  <button class="lbtn"    id="lb-nl" onclick="setLang('nl')">NL</button>
  <button class="lbtn"    id="lb-en" onclick="setLang('en')">EN</button>
</div>
<div class="lvl-bar" id="lvl-bar"></div>
<div id="inv-badge"></div>
<div id="mash-badge"></div>

<!-- GAME -->
<div id="game">
  <div id="context-box"><div id="context-txt"></div></div>
  <div class="btn-area">
    <div class="outer-glow normal" id="outer-glow"></div>
    <canvas id="ring-canvas"></canvas>
    <button id="the-btn" onclick="onPress()">
      <div class="btn-inner"><div id="btn-txt"></div></div>
    </button>
  </div>
  <div id="timer-wrap">
    <div id="timer-val">-</div>
    <div id="timer-lbl"></div>
  </div>
  <div id="mash-info">
    <div id="mash-target-lbl"></div>
  </div>
</div>

<!-- GAME OVER -->
<div id="over-screen">
  <div class="over-icon">💀</div>
  <div class="over-lvl" id="over-lvl"></div>
  <div class="over-title" id="over-title"></div>
  <div class="over-why" id="over-why"></div>
  <div class="over-tip" id="over-tip"></div>
  <button class="btn-action btn-red" id="btn-retry" onclick="resetGame()"></button>
</div>

<!-- VICTORY -->
<div id="win-screen">
  <div class="win-icon">🏆</div>
  <div class="win-title" id="win-title"></div>
  <div class="win-msg" id="win-msg"></div>
  <div class="win-time" id="win-time"></div>
  <div class="lessons" id="lessons">
    <div class="lessons-title" id="lessons-title"></div>
    <div id="lessons-list"></div>
  </div>
  <button class="btn-action btn-green" id="btn-replay" onclick="resetGame()"></button>
</div>

<script>
// ===== MATRIX =====
(function(){
  const c=document.getElementById('matrix'),ctx=c.getContext('2d');
  function r(){c.width=innerWidth;c.height=innerHeight;}r();

})();

let lang='fr', lvlIdx=0, timeLeft=0, interval=null, done=false;
let startTime=null, mashClicks=0;

// ===== LED RING =====
const rc=document.getElementById('ring-canvas');
const rctx=rc.getContext('2d');
let rsz=0;
function resizeRing(){
  const a=document.querySelector('.btn-area');
  if(!a)return;
  const s=a.offsetWidth;
  rc.width=s*devicePixelRatio; rc.height=s*devicePixelRatio;
  rctx.scale(devicePixelRatio,devicePixelRatio);
  rsz=s; drawRing(timeLeft/(LEVELS[lang][lvlIdx]?.timer||5),LEVELS[lang][lvlIdx]?.inv);
}
function drawRing(frac,isInv){
  if(!rsz)return;
  const s=rsz,cx=s/2,cy=s/2,N=36,gap=0.042;
  const ir=s*0.325,or=s*0.485;
  const active=Math.round(frac*N);
  rctx.clearRect(0,0,s,s);
  let col,dim;
  if(isInv){col='#ff00cc';dim='rgba(80,0,50,0.4)';}
  else if(frac>0.5){col='#00ff41';dim='rgba(0,60,15,0.4)';}
  else if(frac>0.25){col='#ffe600';dim='rgba(70,55,0,0.4)';}
  else{col='#ff2222';dim='rgba(70,5,5,0.4)';}
  for(let i=0;i<N;i++){
    const sa=(i/N)*Math.PI*2-Math.PI/2+gap;
    const ea=((i+1)/N)*Math.PI*2-Math.PI/2-gap;
    rctx.beginPath();
    rctx.arc(cx,cy,or,sa,ea);
    rctx.arc(cx,cy,ir,ea,sa,true);
    rctx.closePath();
    rctx.fillStyle=i<active?col:dim;
    if(i<active){rctx.shadowColor=col;rctx.shadowBlur=7;}
    rctx.fill();
    rctx.shadowBlur=0;
  }
}
window.addEventListener('resize',resizeRing);

// ===== LANG =====
function setLang(l){
  lang=l;
  ['fr','nl','en'].forEach(x=>document.getElementById('lb-'+x).classList.toggle('on',x===l));
  resetGame();
}

// ===== LOAD LEVEL =====
function loadLevel(){
  const lv=LEVELS[lang][lvlIdx];
  const ui=UI[lang];
  done=false;

  // Level bar
  document.getElementById('lvl-bar').innerHTML=`${ui.lvlOf(lvlIdx+1,LEVELS[lang].length)}`;

  // Context
  const cb=document.getElementById('context-box');
  const ct=document.getElementById('context-txt');
  cb.className='context-box'+(lv.inv?' inv':'');
  // re-trigger animation
  ct.style.animation='none';
  void ct.offsetWidth;
  ct.style.animation='context-in .35s ease both';
  ct.innerHTML=formatCtx(lv.ctx);

  // Button
  const btn=document.getElementById('the-btn');
  const btxt=document.getElementById('btn-txt');
  const isMash=lv.type==='mash';
  btn.className=isMash?'mash':(lv.inv?'inv':'');
  btxt.className=isMash?'mash':(lv.inv?'inv':'');
  btxt.textContent=lv.btn;

  // Glow
  document.getElementById('outer-glow').className='outer-glow '+(isMash?'mash':(lv.inv?'inv':'normal'));

  // Badges
  const ib=document.getElementById('inv-badge');
  ib.textContent=UI[lang].invBadge;
  ib.className=lv.inv?'show':'';
  const mb=document.getElementById('mash-badge');
  mb.textContent=UI[lang].mashBadge;
  mb.className=isMash?'show':'';

  // Mash info
  const mi=document.getElementById('mash-info');
  if(isMash){
    mashClicks=0;
    document.getElementById('mash-target-lbl').textContent=UI[lang].mashLbl(lv.target,lv.timer);
    mi.style.display='flex';
  } else {
    mi.style.display='none';
  }

  // Start global timer on first level
  if(startTime===null) startTime=Date.now();

  // Timer
  timeLeft=lv.timer;
  updateTimerDisplay();
  drawRing(1,lv.inv);

  clearInterval(interval);
  interval=setInterval(tick,1000);
}

function formatCtx(txt){
  return txt
    .replace(/\n/g,'<br>')
    .replace(/⚠️/g,'<span style="color:var(--yellow)">⚠️</span>')
    .replace(/📺/g,'<span style="color:var(--cyan)">📺</span>')
    .replace(/✅/g,'<span style="color:var(--green)">✅</span>')
    .replace(/🎉/g,'<span style="color:var(--yellow)">🎉</span>')
    .replace(/\[MODE INVERSE\]/g,'<span class="inv-tag">[MODE INVERSE]</span>')
    .replace(/\[OMGEKEERDE MODUS\]/g,'<span class="inv-tag">[OMGEKEERDE MODUS]</span>')
    .replace(/\[REVERSE MODE\]/g,'<span class="inv-tag">[REVERSE MODE]</span>');
}

// ===== TICK =====
function tick(){
  if(done)return;
  timeLeft=Math.max(0,timeLeft-1);
  updateTimerDisplay();
  const lv=LEVELS[lang][lvlIdx];
  drawRing(timeLeft/lv.timer,lv.inv);
  // Temptation: button grows slightly as time runs out
  if(timeLeft<=5&&timeLeft>0){
    const scale=1+(1-timeLeft/5)*0.07;
    document.getElementById('the-btn').style.transform=`scale(${scale})`;
  }
  if(timeLeft===0){
    clearInterval(interval);
    if(lv.type==='mash'){
      if(mashClicks>=lv.target){lvlIdx++;if(lvlIdx>=LEVELS[lang].length)showVictory();else loadLevel();}
      else showGameOver(lvlIdx+1,lv);
      return;
    }
    // Timer ran out = player chose NOT to press
    evaluate(false);
  }
}

function updateTimerDisplay(){
  const el=document.getElementById('timer-val');
  const lbl=document.getElementById('timer-lbl');
  el.textContent=timeLeft;
  lbl.textContent=UI[lang].timerLbl;
  el.className='';
  if(timeLeft<=5&&timeLeft>3)el.classList.add('warn');
  else if(timeLeft<=3)el.classList.add('danger');
}

// ===== PRESS =====
function onPress(){
  if(done)return;
  const lv=LEVELS[lang][lvlIdx];
  if(lv.type==='mash'){
    mashClicks++;
    const btxt=document.getElementById('btn-txt');
    btxt.textContent=mashClicks+' / '+lv.target;
    const btn=document.getElementById('the-btn');
    btn.style.transform='scale(1.1)';
    setTimeout(()=>{btn.style.transform='';},80);
    const fl=document.getElementById('flash');
    fl.className='';void fl.offsetWidth;fl.className='go-g';
    if(mashClicks>=lv.target){
      done=true;
      clearInterval(interval);
      setTimeout(()=>{lvlIdx++;if(lvlIdx>=LEVELS[lang].length)showVictory();else loadLevel();},350);
    }
    return;
  }
  done=true;
  clearInterval(interval);
  document.getElementById('the-btn').style.transform='scale(0.93)';
  setTimeout(()=>{document.getElementById('the-btn').style.transform='';},150);
  evaluate(true);
}

// ===== EVALUATE =====
function evaluate(pressed){
  done=true;
  const lv=LEVELS[lang][lvlIdx];
  const correct=(pressed===lv.press);

  // Flash
  const fl=document.getElementById('flash');
  fl.className='';void fl.offsetWidth;
  fl.className=correct?'go-g':'go-r';

  if(!correct){
    setTimeout(()=>showGameOver(lvlIdx+1,lv),500);
    return;
  }
  // Correct — next level
  lvlIdx++;
  if(lvlIdx>=LEVELS[lang].length){
    setTimeout(showVictory,400);
  } else {
    setTimeout(()=>{
      document.getElementById('the-btn').style.transform='';
      loadLevel();
    },350);
  }
}

// ===== GAME OVER =====
function showGameOver(num,lv){
  document.body.style.animation='shake .55s ease';
  setTimeout(()=>{document.body.style.animation='';},550);
  const ui=UI[lang];
  document.getElementById('over-lvl').textContent=ui.overLvl(num);
  document.getElementById('over-title').textContent=ui.overTitle;
  document.getElementById('over-why').textContent=lv.why;
  document.getElementById('over-tip').textContent=lv.tip;
  document.getElementById('btn-retry').textContent=ui.overRetry;
  document.getElementById('over-screen').classList.add('show');

  // Score progressif : niveauAtteint / total × 100 pts
  const total = LEVELS[lang].length;
  const pts   = Math.round(num / total * 100);
  _submitWorkshopScore('do-not-press', pts);
}

// ===== VICTORY =====
function showVictory(){
  const ui=UI[lang];
  const lvs=LEVELS[lang];
  const elapsed=Math.round((Date.now()-(startTime||Date.now()))/1000);
  document.getElementById('win-title').textContent=ui.winTitle;
  document.getElementById('win-msg').textContent=ui.winMsg;
  document.getElementById('win-time').textContent=ui.winTime(elapsed);
  document.getElementById('lessons-title').textContent=ui.lessonsTitle;
  const list=document.getElementById('lessons-list');
  list.innerHTML='';
  // Show key lessons (good choices)
  lvs.filter(l=>!l.isAnnounce&&!l.inv).forEach(l=>{
    const d=document.createElement('div');
    d.className='lesson-item '+(l.press?'good':'bad');
    d.innerHTML=`<span class="li">${l.press?'✓':'✗'}</span><span>${l.tip}</span>`;
    list.appendChild(d);
  });
  document.getElementById('btn-replay').textContent=ui.winReplay;
  document.getElementById('win-screen').classList.add('show');

  // Submit score : 150 pts base + bonus vitesse (max +50 si < 60s) — highScore uniquement
  const speedBonus = elapsed < 60 ? Math.round((60 - elapsed) / 60 * 50) : 0;
  _submitWorkshopScore('do-not-press', 150 + speedBonus);

}

function _submitWorkshopScore(activity, points) {
  const teamId = (document.cookie.match('(?:^|;)\\s*cq_team=([^;]*)') || [])[1];
  if (!teamId || points <= 0) return;
  const key  = 'hs_' + activity;
  const prev = parseInt(sessionStorage.getItem(key) || '0', 10);
  if (points <= prev) return;
  sessionStorage.setItem(key, String(points));
  fetch('/workshop/score', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ team_id: decodeURIComponent(teamId), activity, points: points - prev }),
  }).catch(() => {});
}

// ===== RESET =====
function resetGame(){
  clearInterval(interval);
  lvlIdx=0;
  startTime=null;
  mashClicks=0;
  document.getElementById('over-screen').classList.remove('show');
  document.getElementById('win-screen').classList.remove('show');
  document.getElementById('the-btn').style.transform='';
  document.getElementById('flash').className='';
  setTimeout(()=>{resizeRing();loadLevel();},60);
}

// ===== INIT =====
setTimeout(()=>{resizeRing();loadLevel();},120);
</script>
</body>
