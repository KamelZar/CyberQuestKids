<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CyberQuestKids — Tower Defense</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

body {
  background:#07090f;
  color:#aabbff;
  font-family:'Courier New',Courier,monospace;
  display:flex; flex-direction:column; align-items:center;
  height:100svh; overflow:hidden;
  user-select:none;
  transition: background .8s;
}

#intro-screen {
  position:fixed; top:0; left:0; width:100%; height:100%;
  background:#000;
  display:flex; flex-direction:column; align-items:center; justify-content:space-between;
  z-index:1000;
  overflow:hidden;
}

.stars {
  position:absolute; width:100%; height:100%; overflow:hidden;
}

.star {
  position:absolute; width:1px; height:1px;
  background:#fff; border-radius:50%;
  animation:twinkle 3s infinite;
}

@keyframes twinkle {
  0%, 100% { opacity:.3; }
  50% { opacity:1; }
}

.crawl {
  perspective:400px;
  height:60%;
  display:flex; align-items:flex-end; justify-content:center;
}

.crawl-text {
  transform:rotateX(55deg) translateZ(0);
  font-size:2.5vw;
  text-align:center;
  color:#ffd700;
  font-weight:bold;
  letter-spacing:2px;
  max-width:85%;
  line-height:1.6;
  opacity:0;
  animation:crawlup 8s ease-in forwards;
  text-shadow:0 0 30px rgba(255,215,0,.5);
}

@keyframes crawlup {
  0% { opacity:0; transform:rotateX(55deg) translateY(400px); }
  10% { opacity:1; }
  90% { opacity:1; }
  100% { opacity:0; transform:rotateX(55deg) translateY(-800px); }
}

.intro-btn {
  align-self:flex-start;
  margin:10px 20px;
  padding:8px 16px;
  background:rgba(255,215,0,.15);
  border:2px solid #ffd700;
  color:#ffd700;
  cursor:pointer;
  font-family:monospace;
  font-size:11px;
  font-weight:bold;
  letter-spacing:1px;
  border-radius:2px;
  z-index:10;
}

.intro-btn:hover { background:rgba(255,215,0,.25); }

.lang-selector {
  display:flex; gap:5px;
  margin:10px;
  z-index:10;
}

.lang-btn {
  padding:6px 12px;
  background:rgba(100,150,255,.15);
  border:2px solid rgba(255,255,255,.3);
  color:#aaa;
  cursor:pointer;
  font-family:monospace;
  font-size:10px;
  font-weight:bold;
  border-radius:2px;
}

.lang-btn.active {
  background:rgba(255,215,0,.3);
  color:#ffd700;
  border-color:#ffd700;
}

#game-screen {
  display:none;
  flex:1;
  width:100%; max-width:520px;
  display:flex;
  flex-direction:column;
  height:100svh;
  overflow:hidden;
}

#hud {
  width:100%;
  background:rgba(0,0,0,.35);
  border-bottom:2px solid #1a2860;
  padding:5px 12px;
  display:flex; justify-content:space-between; align-items:center;
  flex-shrink:0;
  backdrop-filter: blur(4px);
  transition: border-color .8s;
}

.hb { display:flex; flex-direction:column; align-items:center; gap:2px; }
.hl { font-size:7px; letter-spacing:1px; text-transform:uppercase; opacity:.55; }
.hv { font-size:15px; font-weight:bold; letter-spacing:1px; }
.hpw { width:64px; height:7px; background:rgba(0,0,0,.3); border:1px solid rgba(255,255,255,.2); margin-top:2px; border-radius:2px; }
.hpf { height:100%; border-radius:2px; transition: width .4s, background .8s; }

#wrap {
  flex:1; display:flex; align-items:center; justify-content:center;
  position:relative; overflow:hidden;
}

#c { image-rendering:pixelated; image-rendering:crisp-edges; display:block; }

#wavebanner {
  position:absolute; top:8px; left:50%; transform:translateX(-50%);
  background:rgba(180,30,30,.9); border:2px solid #ff3333;
  color:#fff; padding:5px 18px; font-size:11px; letter-spacing:2px;
  font-weight:bold; white-space:nowrap; pointer-events:none;
  animation:blink 1s infinite;
  display:none;
  z-index:5;
}

@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.55} }

#panel {
  width:100%;
  background:rgba(0,0,0,.3);
  border-top:2px solid rgba(255,255,255,.08);
  padding:5px 8px 8px;
  flex-shrink:0;
  backdrop-filter:blur(4px);
  transition: border-color .8s;
}

.ptabs {
  display:flex; gap:4px; margin-bottom:8px;
}

.ptab {
  flex:1; padding:6px;
  background:rgba(0,0,0,.35);
  border:2px solid rgba(255,255,255,.12);
  color:#888;
  text-align:center;
  font-size:9px;
  cursor:pointer;
  border-radius:2px;
  transition:border-color .3s, background .3s;
}

.ptab.active {
  border-color:#ffdd44;
  background:rgba(255,220,0,.1);
  color:#ffdd44;
}

.ptab-content { display:none; flex-direction:column; }
.ptab-content.active { display:flex; }

.plbl { font-size:7px; letter-spacing:1px; text-transform:uppercase; opacity:.3; text-align:center; margin-bottom:5px; }
.pbtns { display:flex; gap:6px; justify-content:center; flex-wrap:wrap; }
.pbtn {
  display:flex; flex-direction:column; align-items:center; gap:2px;
  background:rgba(0,0,0,.35); border:2px solid rgba(255,255,255,.12);
  padding:5px 8px; cursor:pointer; min-width:58px; border-radius:2px;
  transition: border-color .5s, background .5s, opacity .3s;
}
.pbtn.sel { border-color:#ffdd44; background:rgba(255,220,0,.08); }
.pbtn.disabled { opacity:.4; cursor:not-allowed; }
.pi { font-size:17px; }
.pn { font-size:7px; color:#8899bb; }
.pc { font-size:9px; color:#ffdd44; }

.quiz-question {
  background:rgba(100,100,150,.15);
  border:1px solid rgba(100,150,255,.3);
  padding:8px;
  border-radius:2px;
  font-size:9px;
  line-height:1.4;
  text-align:center;
}

.quiz-btns {
  display:flex; gap:4px;
}

.quiz-btn {
  flex:1;
  padding:6px;
  background:rgba(0,0,0,.35);
  border:2px solid rgba(100,150,255,.3);
  color:#aabbff;
  font-size:9px;
  font-weight:bold;
  cursor:pointer;
  border-radius:2px;
  transition:border-color .3s;
}

.quiz-btn:hover { border-color:#44ccff; }

.quiz-feedback {
  font-size:8px;
  text-align:center;
  min-height:14px;
  color:#ffdd44;
}

#gameover-screen {
  position:fixed; top:0; left:0; width:100%; height:100%;
  background:#000;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:1001;
  color:#fff;
  text-align:center;
  gap:20px;
  padding:20px;
}

.gameover-title {

  font-weight:bold;
  color:#ff3333;
  letter-spacing:2px;
  text-shadow:0 0 30px rgba(255,50,50,.8);
  animation:pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { text-shadow:0 0 30px rgba(255,50,50,.8); }
  50% { text-shadow:0 0 60px rgba(255,50,50,.4); }
}

.gameover-stats {
  font-size:1.5vw;
  color:#aabbff;
  line-height:2;
}

.gameover-message {
  font-size:1.1vw;
  max-width:90%;
  line-height:1.6;
  color:#cccccc;
  font-style:italic;
}

.gameover-btn {
  padding:12px 28px;
  background:rgba(255,215,0,.2);
  border:2px solid #ffd700;
  color:#ffd700;
  cursor:pointer;
  font-family:monospace;
  font-size:14px;
  font-weight:bold;
  border-radius:3px;
  margin-top:10px;
}

.gameover-btn:hover {
  background:rgba(255,215,0,.35);
}
</style>

function lerp(a,b,t){return a+(b-a)*t;}
function hexToRgb(h){
  const r=parseInt(h.slice(1,3),16), g=parseInt(h.slice(3,5),16), b=parseInt(h.slice(5,7),16);
  return [r,g,b];
}
function lerpHex(h1,h2,t){
  const [r1,g1,b1]=hexToRgb(h1), [r2,g2,b2]=hexToRgb(h2);
  return `rgb(${Math.round(lerp(r1,r2,t))},${Math.round(lerp(g1,g2,t))},${Math.round(lerp(b1,b2,t))})`;
}

function getTheme(hpPct){
  let lo=THEMES[THEMES.length-1], hi=THEMES[0];
  for(let i=0;i<THEMES.length-1;i++){
    if(hpPct<=THEMES[i].hp && hpPct>=THEMES[i+1].hp){
      hi=THEMES[i]; lo=THEMES[i+1]; break;
    }
  }
  if(hpPct>=100)return THEMES[0];
  if(hpPct<=0)return THEMES[THEMES.length-1];
  const range=hi.hp-lo.hp;
  const t=range===0?0:(hpPct-lo.hp)/range;
  return {
    bg:lerpHex(lo.bg,hi.bg,t),
    cell0:lerpHex(lo.cell0,hi.cell0,t),
    cell1:lerpHex(lo.cell1,hi.cell1,t),
    grid:hi.grid,
    hudBorder:lerpHex(lo.hudBorder,hi.hudBorder,t),
    panelBorder:lerpHex(lo.panelBorder,hi.panelBorder,t),
    hpColor:lerpHex(lo.hpColor,hi.hpColor,t),
  };
}

const FLOWERS=[
  {c:0,r:0},{c:1,r:1},{c:2,r:0},{c:0,r:2},{c:2,r:2},
  {c:11,r:0},{c:12,r:1},{c:11,r:2},{c:12,r:0},
  {c:0,r:10},{c:1,r:11},{c:0,r:12},{c:2,r:11},
  {c:10,r:10},{c:11,r:11},{c:12,r:10},{c:12,r:12},
  {c:1,r:5},{c:1,r:7},{c:11,r:5},{c:11,r:7},
  {c:5,r:1},{c:6,r:0},{c:7,r:1},{c:6,r:11},{c:7,r:12},{c:5,r:12},
];
const FLOWER_COLORS=['#ffee44','#ff88cc','#ffffff','#ffaa44','#ccff88','#ff6699'];

function drawFlower(x,y,s,seed,alpha){
  if(alpha<=0)return;
  const sway=Math.sin(tick*.03+seed)*.04;
  const cx=x+s*.5+sway*s, cy=y+s*.5;
  const pr=Math.max(1,Math.floor(s/8));
  const col=FLOWER_COLORS[seed%FLOWER_COLORS.length];
  const a=Math.min(1,alpha);
  ctx.globalAlpha=a*.9;
  ctx.fillStyle=col;
  ctx.fillRect(cx-pr*2.5,cy-pr*.5,pr*2,pr);
  ctx.fillRect(cx+pr*.5,cy-pr*.5,pr*2,pr);
  ctx.fillRect(cx-pr*.5,cy-pr*2.5,pr,pr*2);
  ctx.fillRect(cx-pr*.5,cy+pr*.5,pr,pr*2);
  ctx.fillStyle='#ffdd44';
  ctx.fillRect(cx-pr*.5,cy-pr*.5,pr,pr);
  ctx.fillStyle='#44aa22';
  ctx.globalAlpha=a*.7;
  ctx.fillRect(cx-pr*.5,cy+pr*1.5,pr,pr*2);
  ctx.globalAlpha=1;
}

function drawGrass(x,y,s,seed,alpha){
  if(alpha<=0)return;
  ctx.globalAlpha=alpha*.5;
  ctx.fillStyle='#5ab040';
  const pr=Math.max(1,Math.floor(s/10));
  const sway=Math.sin(tick*.025+seed)*.03*s;
  for(let i=0;i<3;i++){
    const bx=x+s*(.25+i*.25)+sway;
    ctx.fillRect(bx,y+s*.5,pr,s*.5);
    ctx.fillRect(bx+pr*.5*(i%2?1:-1),y+s*.25,pr,s*.28);
  }
  ctx.globalAlpha=1;
}

function drawFW(x,y,s,dmg,level){
  const pw=Math.max(1,Math.round(s/10));
  const isSunny=gameState.hp>70;
  const fwA=isSunny?'#8B6914':(dmg>.55?'#4a180a':'#b03a12');
  const fwB=isSunny?'#a07c22':'#d85022';
  const fwC=isSunny?'#6a500e':'#8a2a0a';
  ctx.fillStyle=fwA;
  ctx.fillRect(x,y,s,s);
  const bH=s/4;
  for(let r=0;r<4;r++){
    const off=(r%2===0)?0:s*.25;
    for(let b=-1;b<3;b++){
      const bx=x+b*(s*.5)+off, by=y+r*bH;
      const cx2=Math.max(bx+pw,x), cw=Math.min(bx+s*.5-pw,x+s)-cx2;
      if(cw>0){ctx.fillStyle=r%2===0?fwB:fwC;ctx.fillRect(cx2,by+pw,cw,bH-pw*2);}
    }
  }
  if(dmg>0){
    ctx.fillStyle=`rgba(0,0,0,${dmg*.6})`;
    ctx.fillRect(x,y,s,s*dmg);
    if(dmg>.25){
      ctx.strokeStyle='rgba(0,0,0,.7)';
      ctx.lineWidth=1;
      ctx.beginPath();
      ctx.moveTo(x+s*.3,y+2);
      ctx.lineTo(x+s*.52,y+s*dmg*.85);
      ctx.moveTo(x+s*.62,y+s*.08);
      ctx.lineTo(x+s*.44,y+s*dmg*.7);
      ctx.stroke();
    }
  }
}

function drawHouse(x,y,s,hr,hc){
  const hvA=gameState.hp>60?'#2a4a22':'#1e3420';
  const hvB=gameState.hp>60?'#1e3c18':'#162818';
  const winAlpha=gameState.hp>60?.5+.3*Math.sin(tick*.04+hc):.55+.45*Math.sin(tick*.04+hc);
  if(hr===0){
    ctx.fillStyle=hvB;
    ctx.fillRect(x,y,s,s);
    const tw=Math.max(2,Math.floor(s/5));
    ctx.fillStyle=hvA;
    for(let i=0;i<s;i+=tw*2)ctx.fillRect(x+i,y+s*.25,tw,s*.75);
    if(hc===2){ctx.fillStyle='#5a3520';ctx.fillRect(x+s*.65,y,s*.14,s*.46);}
  }else if(hr===1){
    ctx.fillStyle=hvA;
    ctx.fillRect(x,y,s,s);
    if(hc!==1){
      ctx.fillStyle=`rgba(68,238,136,${winAlpha})`;
      ctx.fillRect(x+s*.24,y+s*.18,s*.52,s*.48);
      ctx.fillStyle='#081408';
      ctx.fillRect(x+s*.49,y+s*.18,s*.04,s*.48);
      ctx.fillRect(x+s*.24,y+s*.4,s*.52,s*.04);
    }else{
      ctx.fillStyle=`rgba(68,238,136,${.35+.35*Math.sin(tick*.05)})`;
      ctx.fillRect(x+s*.32,y+s*.22,s*.36,s*.55);
    }
  }else{
    ctx.fillStyle=hvA;
    ctx.fillRect(x,y,s,s*.88);
    ctx.fillStyle=gameState.hp>60?'#2a5028':'#1a3a1a';
    ctx.fillRect(x,y+s*.88,s,s*.12);
    if(hc===1){
      ctx.fillStyle='#281408';
      ctx.fillRect(x+s*.3,y+s*.28,s*.4,s*.6);
      ctx.fillStyle='#ffcc44';
      ctx.fillRect(x+s*.61,y+s*.52,s*.06,s*.06);
    }
  }
}

  ctx.fillStyle='#441870';

    ctx.fillRect(x+s*.17,dy,s*.66,s*.2);

    ctx.fillRect(x+s*.67,dy+s*.05,s*.09,s*.1);
    ctx.fillStyle='#181828';
    ctx.fillRect(x+s*.19,dy+s*.04,s*.42,s*.12);
  }
  ctx.fillStyle='#33dd88';

}

function drawAV(x,y,s,angle){
  const cx=x+s/2, cy=y+s/2;
  ctx.fillStyle='#0e2e60';
  ctx.fillRect(x+s*.16,y+s*.52,s*.68,s*.44);
  ctx.fillStyle='#1a4888';
  ctx.fillRect(x+s*.2,y+s*.55,s*.6,s*.32);
  ctx.beginPath();
  ctx.arc(cx,cy,s*.36,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle='#2860a0';
  ctx.beginPath();
  ctx.arc(cx-s*.06,cy-s*.06,s*.25,0,Math.PI*2);
  ctx.fill();
  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(angle);
  ctx.fillStyle='#3080be';
  ctx.fillRect(s*.04,-s*.055,s*.46,s*.11);
  ctx.fillStyle='#40d8ff';
  ctx.fillRect(s*.4,-s*.04,s*.12,s*.08);
  ctx.restore();
  ctx.fillStyle=`rgba(64,216,255,${.55+.45*Math.sin(tick*.1+x)})`;
  ctx.beginPath();
  ctx.arc(cx,cy,s*.1,0,Math.PI*2);
  ctx.fill();
}

  const cx=x+s/2, cy=y+s/2+bob, r=s*.35;
  ctx.fillStyle='#7a3e10';
  ctx.beginPath();
  ctx.arc(cx+1,cy+1,r,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle='#b86820';
  ctx.beginPath();
  ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle='#3a1a06';
  [[.26,.3],[.6,.46],[.2,.64],[.56,.2],[.42,.66]].forEach(([fx,fy])=>{
    ctx.fillRect(cx-r+fx*r*2-s*.05,cy-r+fy*r*2-s*.05,s*.1,s*.08);
  });
  ctx.fillStyle='#ff1100';
  ctx.fillRect(cx-r*.38,cy-r*.14,s*.1,s*.09);
  ctx.fillRect(cx+r*.12,cy-r*.14,s*.1,s*.09);
  ctx.fillStyle='#000';
  ctx.fillRect(cx-r*.3,cy-r*.08,s*.05,s*.05);
  ctx.fillRect(cx+r*.2,cy-r*.08,s*.05,s*.05);
}

function drawVirusE(x,y,s,seed){
  const p=.9+.1*Math.sin(tick*.08+seed);
  const cx=x+s/2, cy=y+s/2, r=s*.3*p;
  ctx.fillStyle='#b81a00';
  for(let i=0;i<8;i++){
    const a=(i/8)*Math.PI*2+tick*.015;
    const sl=s*.13;
    ctx.save();
    ctx.translate(cx+Math.cos(a)*r*.88,cy+Math.sin(a)*r*.88);
    ctx.rotate(a);
    ctx.fillRect(-sl*.2,-sl,sl*.4,sl);
    ctx.restore();
  }
  ctx.fillStyle='#b81a00';
  ctx.beginPath();
  ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle='#ff3a1a';
  ctx.beginPath();
  ctx.arc(cx-r*.18,cy-r*.18,r*.72,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle='#ffee00';
  ctx.beginPath();
  ctx.arc(cx,cy,r*.34,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle='#000';
  ctx.beginPath();
  ctx.arc(cx+r*.12,cy,r*.15,0,Math.PI*2);
  ctx.fill();
}

function resize(){
  const aw=wrap.clientWidth-4, ah=wrap.clientHeight-4;
  const cs=Math.floor(Math.min(aw,ah)/COLS);
  canvas.width=canvas.height=cs*COLS;
}

resize();
window.addEventListener('resize',resize);

function S(){return canvas.width/COLS;}

function getWallCells(){
  const walls=new Set();
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      if(gameState.grid[r][c]===1)walls.add(`${c},${r}`);
    }
  }
  return walls;
}

function computePath(startC, startR){
  const walls=getWallCells();
  const target=new Set();
  for(let r=5;r<=7;r++){
    for(let c=5;c<=7;c++){
      target.add(`${c},${r}`);
    }
  }

  const queue=[[startC,startR]];
  const visited=new Set([`${startC},${startR}`]);
  const parent={};

  while(queue.length>0){
    const [c,r]=queue.shift();
    if(target.has(`${c},${r}`)){
      const path=[];
      let curr=`${c},${r}`;
      while(parent[curr]){
        const [pc,pr]=parent[curr].split(',').map(Number);
        path.unshift({c:pc, r:pr});
        curr=`${pc},${pr}`;
      }
      return path.length>0?path:[{c,r}];
    }

    for(let [dc,dr] of [[0,1],[1,0],[0,-1],[-1,0]]){
      const nc=c+dc, nr=r+dr;
      if(nc>=0&&nc<COLS&&nr>=0&&nr<ROWS&&!walls.has(`${nc},${nr}`)&&!visited.has(`${nc},${nr}`)){
        visited.add(`${nc},${nr}`);
        parent[`${nc},${nr}`]=`${c},${r}`;
        queue.push([nc,nr]);
      }
    }
  }

  return null;
}

function addPoints(n){
  gameState.points+=n;
}

function placeDefense(c, r){
  if(gameState.grid[r][c]!==0)return false;
  if(HOUSE_CELLS.has(`${c},${r}`))return false;
  if(gameState.points<DEFENSE_DEFS[gameState.selectedDefense].cost)return false;

  const def=gameState.selectedDefense;
  gameState.points-=DEFENSE_DEFS[def].cost;

  if(def==='FW'){
    gameState.grid[r][c]=1;
    gameState.defenses[`${c},${r}`]={type:'FW',level:1,hp:DEFENSE_DEFS['FW'].hp[0]};
  }else if(def==='AV'){
    gameState.grid[r][c]=2;
    gameState.defenses[`${c},${r}`]={type:'AV',level:1,hp:DEFENSE_DEFS['AV'].hp[0]};
    gameState.turrets[`${c},${r}`]={angle:0};
  }else if(def==='BKP'){
    gameState.grid[r][c]=3;
    gameState.defenses[`${c},${r}`]={type:'BKP',level:1,hp:DEFENSE_DEFS['BKP'].hp[0]};
  }

  return true;
}

function updateEnemies(dt){
  for(let i=gameState.enemies.length-1;i>=0;i--){
    const e=gameState.enemies[i];

    if(!e.path || e.pathIdx>=e.path.length){
      e.path=computePath(Math.floor(e.x), Math.floor(e.y));
      e.pathIdx=0;
    }

    if(e.path&&e.pathIdx<e.path.length){
      const node=e.path[e.pathIdx];
      const dx=node.c-e.x, dy=node.r-e.y;
      const d=Math.hypot(dx,dy);

      if(d<0.08){
        e.pathIdx++;
      }else{
        e.x+=dx/d*e.speed*dt;
        e.y+=dy/d*e.speed*dt;
      }
    }

    if(HOUSE_CELLS.has(`${Math.floor(e.x)},${Math.floor(e.y)}`)){
      gameState.hp-=e.dmgBase;
      gameState.enemies.splice(i,1);
      if(gameState.hp<=0)gameState.isGameOver=true;
      continue;
    }

    const turrets=Object.entries(gameState.defenses).filter(([_,d])=>d.type==='AV');
    for(let [key,def] of turrets){
      const [tc,tr]=key.split(',').map(Number);
      const dist=Math.hypot(e.x-tc, e.y-tr);
      if(dist<=4){
        e.hp-=25/60;
        gameState.turrets[key].angle=Math.atan2(e.y-tr, e.x-tc);

        if(e.hp<=0){
          gameState.enemies.splice(i,1);
          addPoints(10);
        }
        break;
      }
    }
  }
}

function updateWaves(dt){
  if(gameState.waveState==='idle'){
    gameState.wavePrep-=dt;
    if(gameState.wavePrep<=0){
      gameState.waveNum++;

      if(gameState.waveNum>=1)gameState.unlockedDefenses['AV']=true;
      if(gameState.waveNum>=2)gameState.unlockedDefenses['BKP']=true;
      if(gameState.waveNum>=3)gameState.unlockedDefenses['CLEAN']=true;

      gameState.waveState='spawning';
      spawnEnemies(gameState.waveNum);
    }
  }else if(gameState.waveState==='battle'){
    if(gameState.enemies.length===0){
      gameState.waveState='idle';
      gameState.wavePrep=8;
    }
  }
}

function spawnEnemies(waveNum){
  const specs={
    1:[{t:'virus',c:5}],
    2:[{t:'virus',c:4},{t:'ddos',c:5}],
    3:[{t:'virus',c:3},{t:'ddos',c:4},{t:'cookie',c:4}],
  };
  const spec=specs[waveNum]||[];
  let spawnIdx=0;

  function doSpawn(){
    if(spawnIdx>=spec.length){
      gameState.waveState='battle';
      return;
    }

    const s=spec[spawnIdx];
    const edges=[
      {c:0, r:Math.floor(Math.random()*ROWS)},
      {c:COLS-1, r:Math.floor(Math.random()*ROWS)},
      {r:0, c:Math.floor(Math.random()*COLS)},
      {r:ROWS-1, c:Math.floor(Math.random()*COLS)},
    ];
    const edge=edges[Math.floor(Math.random()*edges.length)];

    const en={
      x:edge.c||0.5, y:edge.r||0.5,
      type:s.t, hp:ENEMY_TYPES[s.t].hp, maxHp:ENEMY_TYPES[s.t].hp,
      speed:ENEMY_TYPES[s.t].speed/60, dmgBase:ENEMY_TYPES[s.t].dmgBase,
      dmgWall:ENEMY_TYPES[s.t].dmgWall, pathIdx:0, path:null,
    };

    gameState.enemies.push(en);
    spawnIdx++;
  }

  const spawnInterval=setInterval(()=>{
    doSpawn();
    if(spawnIdx>=spec.length)clearInterval(spawnInterval);
  }, 2000);
}

function initDefenseButtons(){
  const btns=document.getElementById('defense-buttons');
  btns.innerHTML='';

  const defs=[
    {key:'FW', icon:'🧱', cost:40},
    {key:'AV', icon:'🔫', cost:80},
    {key:'BKP', icon:'💾', cost:120},
    {key:'CLEAN', icon:'⬆️', cost:180},
  ];

  defs.forEach(d=>{
    const btn=document.createElement('div');
    btn.className='pbtn '+(gameState.selectedDefense===d.key?'sel':'');
    btn.setAttribute('data-def',d.key);

    const disabled=!gameState.unlockedDefenses[d.key];
    if(disabled)btn.classList.add('disabled');

    const name=TEXTS[lang][DEFENSE_DEFS[d.key].name]||d.key;
    btn.innerHTML=`<div class="pi">${d.icon}</div><div class="pn">${name}</div><div class="pc">${d.cost}🔐</div>`;
    btn.addEventListener('click',()=>{
      if(!disabled){
        gameState.selectedDefense=d.key;
        updateDefenseButtons();
      }
    });

    btns.appendChild(btn);
  });
}

function updateDefenseButtons(){
  document.querySelectorAll('.pbtn').forEach(btn=>{
    const def=btn.getAttribute('data-def');
    btn.classList.toggle('sel', gameState.selectedDefense===def);
    const cost=DEFENSE_DEFS[def].cost;
    btn.classList.toggle('disabled', gameState.points<cost || !gameState.unlockedDefenses[def]);
  });
}

function nextQuiz(){
  gameState.currentQuizIdx=(gameState.currentQuizIdx+1)%TEXTS[lang].quiz.length;
  gameState.quizAnswered=false;
  gameState.quizFeedback='';
  updateQuiz();
}

function updateQuiz(){
  const q=TEXTS[lang].quiz[gameState.currentQuizIdx];
  document.getElementById('quiz-question').textContent=q.q;
  document.getElementById('quiz-feedback').textContent='';
}

function answerQuiz(ans){
  if(gameState.quizAnswered)return;
  gameState.quizAnswered=true;

  const q=TEXTS[lang].quiz[gameState.currentQuizIdx];
  const correct=ans===q.a;
  const pts=correct?30:5;
  addPoints(pts);

  gameState.quizFeedback=(correct?'✓ ':'✗ ')+q.e;
  document.getElementById('quiz-feedback').textContent=gameState.quizFeedback;

  setTimeout(()=>nextQuiz(), 2000);
}

function setCookie(name, value){
  document.cookie=`${name}=${value};path=/;max-age=31536000`;
}

function getCookie(name){
  const match=document.cookie.match(new RegExp('(^|;) *'+name+'=([^;]*)'));
  return match?match[2]:'fr';
}

function setupIntro(){
  lang=getCookie('lang')||'fr';

  document.querySelectorAll('.lang-btn').forEach(btn=>{
    btn.classList.toggle('active', btn.getAttribute('data-lang')===lang);
    btn.addEventListener('click',()=>{
      lang=btn.getAttribute('data-lang');
      setCookie('lang',lang);
      document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active', b.getAttribute('data-lang')===lang));
      document.getElementById('crawl-text').textContent=TEXTS[lang].crawl;
    });
  });

  document.getElementById('crawl-text').textContent=TEXTS[lang].crawl;

  const starsDiv=document.getElementById('stars');
  starsDiv.innerHTML='';
  for(let i=0;i<100;i++){
    const star=document.createElement('div');
    star.className='star';
    star.style.left=Math.random()*100+'%';
    star.style.top=Math.random()*100+'%';
    star.style.animationDelay=(Math.random()*3)+'s';
    starsDiv.appendChild(star);
  }

  document.getElementById('skip-intro').addEventListener('click',()=>{
    introScreen.style.display='none';
    gameScreen.style.display='flex';
    startGame();
  });

  setTimeout(()=>{
    introScreen.style.display='none';
    gameScreen.style.display='flex';
    startGame();
  }, 9000);
}

function startGame(){
  gameState.waveNum=0;
  gameState.waveState='idle';
  gameState.wavePrep=5;
  gameState.hp=100;
  gameState.points=100;
  gameState.gameTime=0;
  gameState.isGameOver=false;
  gameState.enemies=[];
  gameState.defenses={};
  gameState.grid=Array(ROWS).fill(null).map(()=>Array(COLS).fill(0));
  gameState.selectedDefense='FW';
  gameState.unlockedDefenses={FW:true, AV:false, BKP:false, CLEAN:false};

  initDefenseButtons();
  updateThemeUI();
  nextQuiz();

  document.querySelectorAll('.ptab').forEach(t=>{
    t.addEventListener('click',()=>{
      document.querySelectorAll('.ptab').forEach(x=>x.classList.remove('active'));
      document.querySelectorAll('.ptab-content').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      const tab=t.getAttribute('data-tab');
      document.getElementById('tab-'+tab).classList.add('active');
    });
  });

  document.getElementById('quiz-true').addEventListener('click',()=>answerQuiz(true));
  document.getElementById('quiz-false').addEventListener('click',()=>answerQuiz(false));

  canvas.addEventListener('click',(e)=>{
    const rect=canvas.getBoundingClientRect();
    const s=S();
    const c=Math.floor((e.clientX-rect.left)/s);
    const r=Math.floor((e.clientY-rect.top)/s);

    placeDefense(c,r);
    updateDefenseButtons();
  });

  canvas.addEventListener('touchstart',(e)=>{
    const touch=e.touches[0];
    const rect=canvas.getBoundingClientRect();
    const s=S();
    const c=Math.floor((touch.clientX-rect.left)/s);
    const r=Math.floor((touch.clientY-rect.top)/s);

    placeDefense(c,r);
    updateDefenseButtons();
  }, {passive:true});
}

function draw(){
  const s=S();
  const th=getTheme(gameState.hp);
  ctx.clearRect(0,0,canvas.width,canvas.height);

  const nature=Math.max(0,Math.min(1,(gameState.hp-20)/80));
  const flowerAlpha=Math.max(0,(gameState.hp-60)/40);
  const grassAlpha=Math.max(0,(gameState.hp-30)/50);

  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      ctx.fillStyle=(r+c)%2===0?th.cell0:th.cell1;
      ctx.fillRect(c*s,r*s,s,s);
    }
  }

  if(nature>0){
    FLOWERS.forEach((f,i)=>{
      if(f.r<ROWS&&f.c<COLS&&gameState.grid[f.r][f.c]===0){
        if(flowerAlpha>0)drawFlower(f.c*s,f.r*s,s,i,flowerAlpha);
        else if(grassAlpha>0)drawGrass(f.c*s,f.r*s,s,i,grassAlpha);
      }
    });
  }

  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      const g=gameState.grid[r][c];
      if(g===1){
        const def=gameState.defenses[`${c},${r}`];
        const maxHp=DEFENSE_DEFS['FW'].hp[def.level-1];
        const dmg=1-(def.hp/maxHp);
        drawFW(c*s,r*s,s,dmg,def.level);
      }else if(g===2){
        const tur=gameState.turrets[`${c},${r}`];
        drawAV(c*s,r*s,s,tur?.angle||0);
      }else if(g===3){
        drawBackup(c*s,r*s,s);
      }else if(HOUSE_CELLS.has(`${c},${r}`)){
        const hr=r-5, hc=c-5;
        drawHouse(c*s,r*s,s,hr,hc);
      }
    }
  }

  gameState.enemies.forEach((e,i)=>{
    const x=e.x*s, y=e.y*s;
    if(e.type==='cookie')drawCookieE(x-s/2,y-s/2,s,i);
    else if(e.type==='virus')drawVirusE(x-s/2,y-s/2,s,i);
    else if(e.type==='ddos')drawDDoSE(x-s/2,y-s/2,s,i);

    const hpFrac=e.hp/e.maxHp;
    ctx.fillStyle='rgba(0,0,0,.55)';
    ctx.fillRect(x-s*.4,y-s*.58,s*.8,s*.09);
    ctx.fillStyle='#44ff88';
    ctx.fillRect(x-s*.4,y-s*.58,s*.8*hpFrac,s*.09);
  });

  if(nature<1){
    const vg=ctx.createRadialGradient(
      canvas.width*.5,canvas.height*.5,canvas.width*.22,
      canvas.width*.5,canvas.height*.5,canvas.width*.7
    );
    vg.addColorStop(0,'rgba(0,0,0,0)');
    vg.addColorStop(1,`rgba(0,0,0,${(1-nature)*.5})`);
    ctx.fillStyle=vg;
    ctx.fillRect(0,0,canvas.width,canvas.height);
  }
}

function update(dt){
  updateEnemies(dt);
  updateWaves(dt);
  updateDefenseButtons();
}

let lastTime=Date.now();

function gameLoop(){
  const now=Date.now();
  const dt=(now-lastTime)/1000;
  lastTime=now;

  tick++;
  update(dt);
  draw();

  document.getElementById('points').textContent=Math.floor(gameState.points);
  document.getElementById('wave').textContent=String(gameState.waveNum).padStart(2,'0');
  document.getElementById('hpval').textContent=gameState.hp.toFixed(0)+'%';

  gameState.gameTime+=dt;
  const m=Math.floor(gameState.gameTime/60);
  const s=Math.floor(gameState.gameTime%60);
  document.getElementById('timer').textContent=`${m}:${String(s).padStart(2,'0')}`;

  if(gameState.isGameOver){
    gameScreen.style.display='none';
    gameoverScreen.style.display='flex';
    document.getElementById('gameover-title').textContent=TEXTS[lang].gameoverTitle;
    document.getElementById('gameover-time').textContent=`${m}:${String(s).padStart(2,'0')}`;
    document.getElementById('gameover-wave').textContent=gameState.waveNum;
    document.getElementById('gameover-message').textContent=TEXTS[lang].gameoverMsg;
    document.getElementById('restart-btn').textContent=TEXTS[lang].restartBtn;
    document.getElementById('restart-btn').onclick=()=>{
      gameoverScreen.style.display='none';
      introScreen.style.display='flex';
      setupIntro();
    };
    return;
  }

  updateThemeUI();
  requestAnimationFrame(gameLoop);
}

setupIntro();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
