<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CyberQuest — Missions</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Syne:wght@400;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:      #0a0c10;
      --surface: #111520;
      --border:  #1e2535;
      --accent:  #00ffd0;
      --accent2: #ff9f43;
      --text:    #e8eaf2;
      --muted:   #5a6580;
      --card:    #13192a;
      --green:   #39d353;
      --red:     #ff4757;
      --yellow:  #ffd32a;
      --purple:  #a29bfe;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      padding-bottom: 60px;
    }

    /* scanlines */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 2px,
        rgba(0,255,208,0.012) 2px, rgba(0,255,208,0.012) 4px
      );
      pointer-events: none; z-index: 1000;
    }

    /* ── Lang switcher ── */
    .lang-switcher {
      position: fixed; top: 14px; right: 14px; z-index: 200;
      display: flex; gap: 6px;
    }
    .lang-btn {
      background: var(--surface); border: 1px solid var(--border);
      color: var(--muted); padding: 5px 10px; border-radius: 5px;
      cursor: pointer; font-family: 'Share Tech Mono', monospace; font-size: 12px;
      transition: all 0.2s;
    }
    .lang-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(0,255,208,0.07); }

    /* ── Briefing header ── */
    .briefing {
      position: relative;
      margin: 0 auto;
      max-width: 540px;
      padding: 40px 20px 0;
    }

    .stamp {
      display: inline-block;
      border: 2.5px solid var(--red);
      color: var(--red);
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px; font-weight: 700;
      letter-spacing: 3px; text-transform: uppercase;
      padding: 3px 10px; border-radius: 3px;
      margin-bottom: 16px;
      opacity: 0.85;
      transform: rotate(-2deg);
    }

    .briefing-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 10px;
      padding: 18px 20px;
      margin-bottom: 20px;
      position: relative;
    }
    .briefing-box::before {
      content: '//';
      position: absolute; top: 10px; right: 14px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 18px; color: var(--border); font-weight: bold;
    }

    .agent-line {
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px; color: var(--muted);
      text-transform: uppercase; letter-spacing: 2px;
      margin-bottom: 6px;
    }
    .agent-name {
      font-size: 1.5rem; font-weight: 800;
      color: var(--accent); text-transform: uppercase;
      letter-spacing: 2px; margin-bottom: 14px;
    }
    .briefing-text {
      font-size: 13px; line-height: 1.65;
      color: var(--text);
    }
    .briefing-text em {
      color: var(--accent2); font-style: normal; font-weight: 700;
    }
    .briefing-footer {
      margin-top: 12px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 12px; color: var(--accent);
      font-weight: 700;
    }

    /* ── Session status ── */
    .status-row {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 16px;
      margin-bottom: 20px; flex-wrap: wrap; gap: 10px;
    }
    .session-badge {
      font-family: 'Share Tech Mono', monospace; font-size: 12px;
      display: flex; align-items: center; gap: 8px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
    .dot.active { background: var(--green); box-shadow: 0 0 6px var(--green); animation: blink 1.4s infinite; }
    .dot.ended  { background: var(--red); }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .timer-display {
      font-family: 'Share Tech Mono', monospace;
      font-size: 18px; font-weight: 700; color: var(--accent);
      min-width: 50px; text-align: right;
    }
    .timer-display.danger { color: var(--red); }
    .score-display {
      font-family: 'Share Tech Mono', monospace;
      font-size: 14px; color: var(--yellow);
      font-weight: 700;
    }

    /* ── Tile grid ── */
    .tile-wrap {
      max-width: 540px;
      margin: 0 auto;
      padding: 0 20px 40px;
    }

    .tile-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    @media (max-width: 480px) {
      .tile-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    }
    @media (min-width: 481px) and (max-width: 700px) {
      .tile-grid { grid-template-columns: repeat(3, 1fr); }
    }

    .tile {
      background: rgba(19,25,42,0.35);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: border-color 0.25s, box-shadow 0.25s;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .tile:active { opacity: 0.85; }
    .tile.mystery:hover {
      border-color: rgba(0,255,208,0.25);
      box-shadow: 0 0 14px rgba(0,255,208,0.08);
    }
    .tile.revealed { border-color: rgba(255,255,255,0.08); }
    .tile.done     { border-color: rgba(57,211,83,0.35); opacity: 0.7; }

    /* Disappear animation */
    @keyframes tileVanish {
      0%   { transform: scale(1);   opacity: 1; }
      40%  { transform: scale(1.08); opacity: 0.9; }
      100% { transform: scale(0);   opacity: 0; }
    }
    .tile.vanishing {
      animation: tileVanish 0.35s ease-in forwards;
      pointer-events: none;
    }

    /* Mystery face */
    .tile-front {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
    }
    .tile-qmark {
      width: 62%; height: 62%;
      object-fit: contain;
      display: block;
    }

    /* Revealed face */
    .tile-revealed {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 8px;
      width: 100%;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }

    .tile-emoji { font-size: clamp(20px, 6vw, 28px); }
    .tile-label {
      font-family: 'Share Tech Mono', monospace;
      font-size: clamp(7px, 1.8vw, 9px);
      color: var(--muted);
      text-align: center;
      line-height: 1.3;
      max-width: 90%;
      word-break: break-word;
    }
    .tile-pts {
      font-family: 'Share Tech Mono', monospace;
      font-size: clamp(6px, 1.5vw, 8px);
      color: var(--green);
    }
    .tile-ext {
      font-family: 'Share Tech Mono', monospace;
      font-size: 7px; color: var(--muted);
      border: 1px solid var(--border);
      padding: 1px 4px; border-radius: 3px;
    }
    .tile-check {
      position: absolute; top: 5px; right: 6px;
      font-size: 11px; color: var(--green);
    }

    /* Loading state */
    .tile-loading {
      grid-column: 1 / -1;
      text-align: center;
      font-family: 'Share Tech Mono', monospace;
      font-size: 12px; color: var(--muted);
      padding: 30px 0;
    }

    /* ── Champions overlay ── */
    .champ-overlay {
      display: none;
      position: fixed; inset: 0; z-index: 500;
      background: rgba(10,12,16,0.92);
      backdrop-filter: blur(6px);
      align-items: center; justify-content: center;
      flex-direction: column; gap: 20px; text-align: center;
      padding: 32px;
    }
    .champ-overlay.show { display: flex; }
    .champ-overlay-icon { font-size: 72px; animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }
    .champ-overlay-title {
      font-size: 2rem; font-weight: 800; color: var(--accent);
      text-transform: uppercase; letter-spacing: 3px;
    }
    .champ-overlay-sub {
      font-family: 'Share Tech Mono', monospace; font-size: 14px;
      color: var(--muted); max-width: 340px; line-height: 1.6;
    }
    .champ-overlay-btn {
      display: inline-block;
      background: var(--accent); color: #0a0c10;
      font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 800;
      text-decoration: none; text-transform: uppercase; letter-spacing: 2px;
      padding: 16px 40px; border-radius: 10px;
      box-shadow: 0 0 24px rgba(0,255,208,0.4);
      transition: opacity 0.2s;
      margin-top: 8px;
    }
    .champ-overlay-btn:hover { opacity: 0.85; }
  </style>
</head>

// ── State ─────────────────────────────────────────────────────────────
let lang   = getCookie('cq_lang') || 'fr';
let teamId = getCookie('cq_team') || '';
const visited = new Set(JSON.parse(sessionStorage.getItem('missionsVisited') || '[]'));
let doneMissions   = {};
let workshopScore  = 0;
let sessionStartedAt = null;
let sessionDuration  = 1200;
let timerInterval    = null;

// Shuffled tile list — built once per page load (or lang change)
let tileList = [];

// ── Cookie helper ─────────────────────────────────────────────────────
function getCookie(n) {
  const m = document.cookie.match('(?:^|;)\\s*' + n + '=([^;]*)');
  return m ? decodeURIComponent(m[1]) : '';
}

// ── Shuffle (Fisher-Yates) ────────────────────────────────────────────
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ── Lang ──────────────────────────────────────────────────────────────
function setLang(l) {
  lang = l;
  document.querySelectorAll('.lang-btn').forEach(b =>
    b.classList.toggle('active', b.textContent === l.toUpperCase())
  );
  applyTranslations();
  initTileGrid();
}

function applyTranslations() {
  const t = T[lang] || T.fr;
  document.getElementById('stamp').textContent           = t.stamp;
  document.getElementById('agent-line').textContent      = t.agentLine;
  const displayName = (teamId || '???').charAt(0).toUpperCase() + (teamId || '???').slice(1);
  document.getElementById('briefing-text').innerHTML     = t.briefing(displayName);
  document.getElementById('briefing-footer').textContent = t.footer;
}

// ── Timer ─────────────────────────────────────────────────────────────
function startTimer(startedAt, duration) {
  sessionStartedAt = startedAt;
  sessionDuration  = duration;
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(tickTimer, 1000);
  tickTimer();
}

function tickTimer() {
  const elapsed = (Date.now() / 1000) - sessionStartedAt;
  const rem     = Math.max(0, sessionDuration - elapsed);
  const m = Math.floor(rem / 60);
  const s = Math.floor(rem % 60);
  const el = document.getElementById('timer-display');
  el.textContent = m + ':' + (s < 10 ? '0' : '') + s;
  el.className   = 'timer-display' + (rem < 120 ? ' danger' : '');
  if (rem === 0) {
    clearInterval(timerInterval);
    updateSessionUI(false, 0);
  }
}

function updateSessionUI(active, rem, stopped) {
  const t   = T[lang] || T.fr;
  const dot = document.getElementById('session-dot');
  const lbl = document.getElementById('session-label');
  if (stopped) {
    dot.className = 'dot ended'; lbl.textContent = t.sessionEnd;
    document.getElementById('timer-display').textContent = '0:00';
    document.getElementById('timer-display').classList.add('danger');
    showChampsOverlay();
  } else if (!sessionStartedAt) {
    dot.className = 'dot'; lbl.textContent = t.sessionOff;
    document.getElementById('timer-display').textContent = '20:00';
  } else if (active) {
    dot.className = 'dot active'; lbl.textContent = t.sessionOn;
  } else {
    dot.className = 'dot ended'; lbl.textContent = t.sessionEnd;
    document.getElementById('timer-display').textContent = '0:00';
    document.getElementById('timer-display').classList.add('danger');
    showChampsOverlay();
  }
}

let _champsOverlayShown = false;
function showChampsOverlay() {
  if (_champsOverlayShown) return;
  _champsOverlayShown = true;
  const t  = T[lang] || T.fr;
  const tc = t.champions;
  document.getElementById('co-title').textContent = tc.title;
  document.getElementById('co-sub').textContent   = tc.sub;
  document.getElementById('co-btn').textContent   = tc.btn;
  setTimeout(() => {
    document.getElementById('champ-overlay').classList.add('show');
    // Redirect automatique vers champions après 6s
    setTimeout(() => { window.location.href = '/champions'; }, 6000);
  }, 800);
}

// ── Scored videos (from sessionStorage, shared with video.html) ───────
function getScoredVideos() {
  return new Set(JSON.parse(sessionStorage.getItem('scoredVideos') || '[]'));

// ── Build tile list (fetch videos + combine missions + bonus) ─────────

  const t = T[lang] || T.fr;
  let videoTiles = [];

  try {
    const r = await fetch(`/activity/videos/list?lang=${lang.toUpperCase()}`);
    const videos = await r.json();
    videoTiles = videos.map(v => {
      const topic   = v.topic || 'GLOBAL';
      const icon    = t.videoIcons[topic]  || '📺';
      const topicName = t.videoTopics[topic] || topic;
      const name    = topicName + (v.bonus ? ' ⭐' : '');
      const pts     = v.bonus ? '100 pts' : '50 pts';
      return {
        id:      'video::' + v.url,
        videoUrl: v.url,
        icon,
        name,
        pts,
        isBonus: false,
        url: '/activity/videos?video_url=' + encodeURIComponent(v.url),
        target: '_self',
      };
    });
  } catch(e) {
    // Fallback: one generic tile leading to the video list
    videoTiles = [{
      id: 'video', icon: '🎬', name: 'Vidéos', pts: '50–100 pts',
      isBonus: false, url: '/activity/videos', target: '_self',
    }];
  }

  const missionTiles = t.missions.map(m => ({
    id: m.id, icon: m.icon, name: m.name, pts: m.pts,
    isBonus: false, url: m.url, target: '_self',
  }));

  const bonusTiles = t.bonus.map(m => ({
    id: m.id, icon: m.icon, name: m.name, pts: null,
    isBonus: true, url: m.url, target: '_blank',
  }));

  return shuffle([...videoTiles, ...missionTiles, ...bonusTiles]);
}

// ── Tile done state ───────────────────────────────────────────────────
function isTileDone(tile) {
  if (tile.id.startsWith('video::')) {
    return getScoredVideos().has(tile.videoUrl);
  }
  return !!doneMissions[tile.id];
}

// ── Render a single tile element ──────────────────────────────────────
function buildRevealedContent(tile) {
  const done = isTileDone(tile);
  const inner = document.createElement('div');
  inner.className = 'tile-revealed';

  const emoji = document.createElement('span');
  emoji.className = 'tile-emoji';
  emoji.textContent = tile.icon;
  inner.appendChild(emoji);

  const lbl = document.createElement('div');
  lbl.className = 'tile-label';
  lbl.textContent = tile.name;
  inner.appendChild(lbl);

  if (tile.pts) {
    const pts = document.createElement('div');
    pts.className = 'tile-pts';
    pts.style.color = done ? 'var(--green)' : (tile.isBonus ? 'var(--muted)' : 'var(--green)');
    pts.textContent = done ? '✓' : tile.pts;
    inner.appendChild(pts);
  } else if (tile.isBonus) {
    const ext = document.createElement('div');
    ext.className = 'tile-ext';
    ext.textContent = 'EXT';
    inner.appendChild(ext);
  }

  return inner;
}

function createTileEl(tile) {
  const isRevealed = visited.has(tile.id);
  const isDone     = isTileDone(tile);

  const el = document.createElement('div');
  el.className = 'tile ' + (isDone ? 'done' : isRevealed ? 'revealed' : 'mystery');
  el.dataset.id = tile.id;

  if (isDone || isRevealed) {
    el.appendChild(buildRevealedContent(tile));
    if (isDone) {
      const chk = document.createElement('span');
      chk.className = 'tile-check';
      chk.textContent = '✓';
      el.appendChild(chk);
    }
  } else {
    // Mystery face
    const front = document.createElement('div');
    front.className = 'tile-front';
    const img = document.createElement('img');
    img.src = '/images/Question_mark.png';
    img.alt = '?';
    img.className = 'tile-qmark';
    front.appendChild(img);
    el.appendChild(front);
  }

  // 3D tilt effect (desktop only)
  el.addEventListener('mousemove', handleTilt);
  el.addEventListener('mouseleave', resetTilt);

  // Click handler
  el.addEventListener('click', () => handleTileClick(el, tile));

  return el;
}

// ── 3D tilt ───────────────────────────────────────────────────────────
function handleTilt(e) {
  const el   = e.currentTarget;
  if (el.classList.contains('vanishing')) return;
  const rect = el.getBoundingClientRect();
  const cx   = rect.left + rect.width  / 2;
  const cy   = rect.top  + rect.height / 2;
  const dx   = (e.clientX - cx) / (rect.width  / 2);
  const dy   = (e.clientY - cy) / (rect.height / 2);
  el.style.transform = `perspective(500px) rotateY(${dx * 14}deg) rotateX(${-dy * 14}deg) scale(1.04)`;
}
function resetTilt(e) {
  e.currentTarget.style.transform = '';
}

// ── Tile click ────────────────────────────────────────────────────────
function handleTileClick(el, tile) {
  if (el.classList.contains('vanishing')) return;

  // Mark visited
  visited.add(tile.id);
  sessionStorage.setItem('missionsVisited', JSON.stringify([...visited]));

  // Vanish animation then navigate
  el.style.transform = '';
  el.classList.add('vanishing');

  const delay = tile.target === '_blank' ? 300 : 380;
  setTimeout(() => {
    if (tile.target === '_blank') {
      window.open(tile.url, '_blank', 'noopener');
      // Restore tile as revealed after opening external link
      el.classList.remove('vanishing');
      el.style.animation = 'none';
      el.classList.remove('mystery');
      el.classList.add('revealed');
      el.innerHTML = '';
      el.appendChild(buildRevealedContent(tile));
    } else {
      window.location.href = tile.url;
    }
  }, delay);
}

// ── Init tile grid ────────────────────────────────────────────────────
async function initTileGrid() {
  const t    = T[lang] || T.fr;
  const grid = document.getElementById('tile-grid');
  grid.innerHTML = `<div class="tile-loading">${t.loading}</div>`;

  tileList = await buildTileList();

  grid.innerHTML = '';
  tileList.forEach(tile => grid.appendChild(createTileEl(tile)));
}

// ── Update done states after polling ─────────────────────────────────
function updateAllTileDoneStates() {
  const scoredVideos = getScoredVideos();
  tileList.forEach(tile => {
    const isDone = tile.id.startsWith('video::')
      ? scoredVideos.has(tile.videoUrl)
      : !!doneMissions[tile.id];

    const el = document.querySelector(`.tile[data-id="${CSS.escape(tile.id)}"]`);
    if (!el || el.classList.contains('done')) return;

    if (isDone) {
      el.classList.remove('mystery', 'revealed');
      el.classList.add('done');
      el.innerHTML = '';
      el.appendChild(buildRevealedContent(tile));
      const chk = document.createElement('span');
      chk.className = 'tile-check';
      chk.textContent = '✓';
      el.appendChild(chk);
    }
  });
}

// ── Polling ───────────────────────────────────────────────────────────
async function pollStatus() {
  if (!teamId) return;
  try {
    const r    = await fetch(`/missions/status?team_id=${encodeURIComponent(teamId)}`, { cache: 'no-store' });
    const data = await r.json();

    workshopScore = data.workshop_score || 0;
    document.getElementById('score-val').textContent = workshopScore;

    const sess = data.session || {};
    if (sess.started_at && !sessionStartedAt) {
      startTimer(sess.started_at, sess.duration || 1200);
    }
    updateSessionUI(sess.active, sess.time_remaining || 0, sess.stopped);

    const newDone = data.done || {};
    let changed = false;
    Object.keys(newDone).forEach(id => {
      if (!doneMissions[id]) { doneMissions[id] = true; changed = true; }
    });
    if (changed) {
      doneMissions = { ...doneMissions, ...newDone };
      updateAllTileDoneStates();
    }

    // Also refresh video done states from sessionStorage
    updateAllTileDoneStates();

  } catch(e) { /* serveur non accessible */ }
}

// ── Init ──────────────────────────────────────────────────────────────
(function init() {
  if (!['fr','nl','en'].includes(lang)) lang = 'fr';
  teamId = teamId || '???';

  const displayName = teamId.charAt(0).toUpperCase() + teamId.slice(1);
  document.getElementById('agent-name').textContent = displayName;

  document.querySelectorAll('.lang-btn').forEach(b =>
    b.classList.toggle('active', b.textContent === lang.toUpperCase())
  );

  applyTranslations();
  document.getElementById('briefing-text').innerHTML = (T[lang] || T.fr).briefing(displayName);

  initTileGrid();
  pollStatus();
  setInterval(pollStatus, 4000);
})();
</script>
