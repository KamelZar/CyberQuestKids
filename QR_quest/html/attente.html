<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>⏳ CyberQuest — En attente</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #0a0a0f;
      --card:   #13131d;
      --border: #2a2a3d;
      --accent: #00e5ff;
      --muted:  #6b7280;
      --text:   #ffffff;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      text-align: center;
      gap: 28px;
    }

    /* ── Pulsing QR icon ── */
    .qr-icon {
      font-size: 80px;
      animation: pulse 2.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1);    opacity: 1; }
      50%       { transform: scale(1.1); opacity: 0.75; }
    }

    /* ── Title ── */
    h1 {
      font-size: clamp(22px, 6vw, 30px);
      font-weight: 900;
      color: var(--accent);
      letter-spacing: -0.5px;
      line-height: 1.2;
    }

    /* ── Subtitle ── */
    .subtitle {
      font-size: clamp(15px, 4vw, 18px);
      color: #d1d5db;
      line-height: 1.6;
      max-width: 440px;
    }

    /* ── Dots loader ── */
    .dots {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 8px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent);
      animation: dotBounce 1.4s ease-in-out infinite;
    }

    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dotBounce {
      0%, 80%, 100% { transform: translateY(0);    opacity: 0.4; }
      40%            { transform: translateY(-10px); opacity: 1; }
    }

    /* ── Team badge ── */
    .team-badge {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 28px;
      font-size: clamp(16px, 4.5vw, 20px);
      font-weight: 700;
      color: var(--accent);
      display: none;
    }

    /* ── Hint ── */
    .hint {
      font-size: clamp(12px, 3vw, 14px);
      color: var(--muted);
      max-width: 360px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <span class="qr-icon">📡</span>

  <h1 id="title">…</h1>
  <p class="subtitle" id="subtitle">…</p>

  <div class="dots">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>

  <div class="team-badge" id="team-badge"></div>

  <p class="hint" id="hint">…</p>

<script>
// ── Translations ──────────────────────────────────────────────────────────────
const T = {
  fr: {
    title:    'En attente des instructions…',
    subtitle: 'L\'animateur va bientôt distribuer les QR codes. Garde ton téléphone prêt !',
    hint:     'Ne ferme pas cette page. Le jeu commence très bientôt.',
    team:     'Équipe',
  },
  nl: {
    title:    'Wachten op instructies…',
    subtitle: 'De begeleider deelt straks de QR codes uit. Houd je telefoon gereed!',
    hint:     'Sluit deze pagina niet. Het spel begint heel snel.',
    team:     'Team',
  },
  en: {
    title:    'Waiting for instructions…',
    subtitle: 'The facilitator will hand out the QR codes shortly. Keep your phone ready!',
    hint:     'Don\'t close this page. The game is about to start.',
    team:     'Team',
  },
};

// ── Lang helper ───────────────────────────────────────────────────────────────
function getLang() {
  const urlLang = new URLSearchParams(window.location.search).get('lang');
  if (urlLang && T[urlLang]) return urlLang;
  const m = document.cookie.match(/cq_lang=([^;]+)/);
  const l = m ? m[1].trim() : 'fr';
  return T[l] ? l : 'fr';
}

function getTeam() {
  const m = document.cookie.match(/cq_team=([^;]+)/);
  return m ? decodeURIComponent(m[1].trim()) : null;
}

// ── Init ──────────────────────────────────────────────────────────────────────
const lang = getLang();
document.documentElement.lang = lang;

const tr = T[lang];
document.getElementById('title').textContent    = tr.title;
document.getElementById('subtitle').textContent = tr.subtitle;
document.getElementById('hint').textContent     = tr.hint;

// Afficher le nom d'équipe si cookie présent
const team = getTeam();
if (team) {
  const badge = document.getElementById('team-badge');
  badge.textContent = tr.team + ' — ' + team;
  badge.style.display = 'block';
}

// ── Poll session/state → redirect /missions dès démarrage ────────────
async function pollSession() {
  try {
    const r    = await fetch('/session/state', { cache: 'no-store' });
    const data = await r.json();
    if (data.active) {
      window.location.href = '/missions';
    }
  } catch(e) { /* serveur non accessible, on réessaie */ }
}

pollSession();
setInterval(pollSession, 3000);
</script>
</body>
</html>
