<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CyberQuest — Testeur de Robustesse</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Syne:wght@400;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ── Variables (même palette que init.html) ───────────────────── */
    :root {
      --bg:      #0a0c10;
      --surface: #111520;
      --border:  #1e2535;
      --accent:  #00ffd0;
      --danger:  #ff3b6b;
      --safe:    #00e676;
      --warn:    #ffcc00;
      --text:    #e8eaf2;
      --muted:   #5a6580;
      --card:    #13192a;
      --mono:    'Share Tech Mono', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }
    /* Scanlines globales */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 2px,
        rgba(0,255,208,.015) 2px, rgba(0,255,208,.015) 4px
      );
      pointer-events: none; z-index: 999;
    }

    /* ── Lang switcher ────────────────────────────────────────────── */
    .lang-switcher {
      position: fixed; top: 14px; right: 14px; z-index: 200;
      display: flex; gap: 6px;
    }
    .lang-btn {
      background: var(--surface); border: 1px solid var(--border);
      color: var(--muted); padding: 5px 11px; border-radius: 6px;
      cursor: pointer; font-family: var(--mono); font-size: 12px;
    }
    .lang-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(0,255,208,.08); }

    /* ── Screens ──────────────────────────────────────────────────── */
    .screen { display: none; }
    .screen.active {
      display: flex; flex-direction: column; align-items: center;
      min-height: 100vh; padding: 64px 16px 48px; gap: 22px;
    }

    /* ── Cadenas SVG ──────────────────────────────────────────────── */
    .lock-wrap {
      position: relative; width: 120px; height: 130px;
      display: flex; align-items: center; justify-content: center;
    }
    .lock-svg { width: 100px; height: 110px; overflow: visible; }

    /* Transitions des éléments SVG */
    .shackle    { transition: transform .55s cubic-bezier(.68,-.55,.27,1.55), stroke .4s; transform-origin: 40px 45px; }
    .body-rect  { transition: stroke .4s, fill .4s; }
    .keyhole    { transition: fill .4s; }

    /* Ligne de scan pendant l'analyse */
    .scan-beam {
      position: absolute; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0; top: 0; border-radius: 2px;
    }
    .scanning .scan-beam  { opacity: .85; animation: scan-move 1.6s linear infinite; }
    .scanning .lock-svg   { filter: drop-shadow(0 0 8px var(--accent)); animation: lock-pulse 2s ease-in-out infinite; }
    @keyframes scan-move  { 0%{top:0;opacity:.85} 85%{opacity:.85} 100%{top:100%;opacity:0} }
    @keyframes lock-pulse { 0%,100%{opacity:1} 50%{opacity:.6} }

    /* Résultat TROUVÉ */
    .lock-found .shackle   { transform: translateY(-12px) rotate(-35deg); stroke: var(--danger) !important; }
    .lock-found .body-rect { stroke: var(--danger) !important; fill: #1a0710 !important; }
    .lock-found .keyhole   { fill: var(--danger) !important; }
    .lock-found .lock-svg  { filter: drop-shadow(0 0 14px var(--danger)); animation: shake .4s ease-out; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 60%{transform:translateX(6px)} 80%{transform:translateX(-3px)} }

    /* Fissure */
    .crack { stroke-dasharray: 80; stroke-dashoffset: 80; }
    .lock-found .crack { animation: crack-draw .6s .2s ease-out forwards; }
    @keyframes crack-draw { to { stroke-dashoffset: 0; } }

    /* Résultat SÛR */
    .lock-safe .shackle   { stroke: var(--safe) !important; }
    .lock-safe .body-rect { stroke: var(--safe) !important; }
    .lock-safe .keyhole   { fill: var(--safe) !important; }
    .lock-safe .lock-svg  { filter: drop-shadow(0 0 14px var(--safe)); animation: safe-glow .8s ease-out; }
    @keyframes safe-glow  { from{filter:drop-shadow(0 0 24px var(--safe))} to{filter:drop-shadow(0 0 14px var(--safe))} }

    /* ── Formulaire ───────────────────────────────────────────────── */
    .page-title { font-size: 22px; font-weight: 800; letter-spacing: 1px; text-align: center; }
    .page-sub   { font-size: 13px; color: var(--muted); font-family: var(--mono); text-align: center; }

    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; padding: 24px; width: 100%; max-width: 400px;
      display: flex; flex-direction: column; gap: 16px;
    }
    .input-wrap { position: relative; display: flex; }
    .pwd-input {
      flex: 1; background: var(--surface); border: 1px solid var(--border);
      color: var(--text); font-family: var(--mono); font-size: 16px;
      padding: 13px 46px 13px 14px; border-radius: 10px; outline: none;
      transition: border-color .2s; letter-spacing: .05em;
    }
    .pwd-input:focus { border-color: var(--accent); }
    .eye-btn {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; font-size: 19px;
      color: var(--muted); padding: 4px; line-height: 1;
    }
    .eye-btn:hover { color: var(--accent); }

    .hint-row {
      display: flex; align-items: center; gap: 6px;
      font-family: var(--mono); font-size: 11px; color: var(--muted);
    }
    .strength-dots { display: flex; gap: 4px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border); transition: background .3s; }

    .btn-primary {
      background: var(--accent); color: #060809; font-weight: 800;
      border: none; border-radius: 10px; padding: 14px; font-size: 16px;
      cursor: pointer; font-family: 'Syne', sans-serif; letter-spacing: .4px;
      transition: opacity .2s, transform .1s;
    }
    .btn-primary:active { transform: scale(.97); }
    .btn-primary:hover  { opacity: .88; }
    .btn-primary:disabled { opacity: .4; cursor: default; }

    .disclaimer {
      font-size: 11px; color: var(--muted); font-family: var(--mono);
      text-align: center; line-height: 1.6; max-width: 380px;
    }

    /* ── Écran d'analyse ──────────────────────────────────────────── */
    .run-header { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }

    .phase-label {
      font-family: var(--mono); font-size: 12px; color: var(--accent);
      letter-spacing: 1px; text-align: center; min-height: 18px;
    }
    .time-bar-wrap {
      width: 100%; max-width: 320px; height: 5px;
      background: var(--border); border-radius: 3px; overflow: hidden;
    }
    .time-fill {
      height: 100%; width: 0%; background: var(--accent);
      border-radius: 3px; transition: width .6s linear;
    }
    .attempts-row {
      font-family: var(--mono); font-size: 12px; color: var(--muted); text-align: center;
    }
    .attempts-row strong { color: var(--text); font-size: 14px; }

    /* Terminal */
    .terminal {
      width: 100%; max-width: 500px; height: 240px;
      background: #060809; border: 1px solid var(--border); border-radius: 12px;
      padding: 14px 16px; overflow-y: auto; overflow-x: hidden;
      font-family: var(--mono); font-size: 12px; line-height: 1.85;
      scroll-behavior: smooth;
    }
    .terminal::-webkit-scrollbar { width: 4px; }
    .terminal::-webkit-scrollbar-track { background: transparent; }
    .terminal::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .l-dict  { color: #00ffd0; }
    .l-rules { color: #bf7fff; }
    .l-brute { color: #ffcc00; }
    .l-prog  { color: #3a4a60; }
    .l-found { color: #ff3b6b; font-weight: bold; }
    .l-safe  { color: #00e676; font-weight: bold; }
    .l-sep   { color: #1e2535; }

    /* ── Écran résultat ───────────────────────────────────────────── */
    .result-wrap { display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; max-width: 480px; }

    .result-title { font-size: 22px; font-weight: 800; letter-spacing: 1px; text-align: center; }
    .result-title.danger { color: var(--danger); }
    .result-title.safe   { color: var(--safe); }

    .stats-grid {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 12px; width: 100%;
    }
    .stat-box {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 14px 10px; display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    .stat-val { font-size: 20px; font-weight: 800; }
    .stat-lbl { font-size: 10px; color: var(--muted); font-family: var(--mono); text-align: center; letter-spacing: .5px; }

    /* ── Checklist critères ──────────────────────────────────────── */
    .criteria-list {
      width: 100%; max-width: 400px;
      display: flex; flex-direction: column; gap: 7px;
    }
    .criteria-item {
      display: flex; align-items: center; gap: 12px;
      background: var(--card); border-radius: 8px;
      padding: 10px 16px;
      border: 1px solid var(--border);
      font-size: 14px; font-weight: 600;
      transition: border-color .3s, color .3s;
    }
    .criteria-item.ok   { border-color: rgba(0,230,118,.4); color: var(--safe); }
    .criteria-item.fail { border-color: rgba(255,59,107,.35); color: var(--danger); }
    .criteria-icon { font-size: 15px; flex-shrink: 0; font-family: var(--mono); }

    .tips-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      padding: 20px; width: 100%;
    }
    .tips-title { font-size: 13px; font-weight: 700; letter-spacing: .5px; margin-bottom: 14px; }
    .tips-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .tips-list li { font-size: 13px; color: var(--text); display: flex; gap: 10px; line-height: 1.5; }
    .tips-list li::before { content: '→'; color: var(--accent); flex-shrink: 0; }

    .btn-retry {
      background: transparent; border: 1px solid var(--border); color: var(--muted);
      border-radius: 10px; padding: 12px 28px; cursor: pointer;
      font-family: var(--mono); font-size: 13px;
      transition: border-color .2s, color .2s;
    }
    .btn-retry:hover { border-color: var(--accent); color: var(--accent); }

    .btn-poster {
      background: rgba(0,255,208,.08); border: 1px solid var(--accent);
      color: var(--accent); border-radius: 10px; padding: 12px 24px;
      cursor: pointer; font-family: 'Syne', sans-serif; font-size: 13px;
      font-weight: 700; transition: background .2s, box-shadow .2s;
      text-decoration: none; display: inline-block; text-align: center;
    }
    .btn-poster:hover { background: rgba(0,255,208,.16); box-shadow: 0 0 16px rgba(0,255,208,.2); }
  </style>
</head>
<body>

<!-- ── Sélecteur de langue ─────────────────────────────────────────── -->
<div class="lang-switcher">
  <button class="lang-btn" onclick="setLang('fr')">FR</button>
  <button class="lang-btn" onclick="setLang('nl')">NL</button>
  <button class="lang-btn" onclick="setLang('en')">EN</button>
</div>

<!-- ═══════════════════════════════════════════════════════════════════
     ÉCRAN 1 : Formulaire
     ═══════════════════════════════════════════════════════════════════ -->
<div id="s-form" class="screen active">

  <!-- Cadenas décoratif -->
  <div class="lock-wrap" id="lock-form">
    <svg class="lock-svg" viewBox="0 0 80 100" xmlns="http://www.w3.org/2000/svg">
      <path class="shackle" d="M22 46 L22 26 Q22 6 40 6 Q58 6 58 26 L58 46"
            stroke="var(--accent)" stroke-width="7" fill="none" stroke-linecap="round"/>
      <rect class="body-rect" x="8" y="43" width="64" height="52" rx="8"
            fill="#13192a" stroke="var(--accent)" stroke-width="2"/>
      <circle class="keyhole" cx="40" cy="63" r="7" fill="var(--accent)" opacity=".7"/>
      <rect class="keyhole" x="37.5" y="63" width="5" height="11" rx="2.5"
            fill="var(--accent)" opacity=".7"/>
    </svg>
  </div>

  <h1 class="page-title" data-t="title">Testeur de Robustesse</h1>
  <p  class="page-sub"   data-t="subtitle">Votre mot de passe résisterait-il à une attaque ?</p>

  <form class="card" onsubmit="startTest(event)">
    <div class="input-wrap">
      <input id="pwd-input" class="pwd-input" type="password"
             autocomplete="off" spellcheck="false"
             data-t-ph="placeholder" placeholder="Mot de passe à tester"
             oninput="updateDots()" />
      <button type="button" class="eye-btn" onclick="toggleVis()">👁</button>
    </div>

    <!-- Indicateur de force visuel -->
    <div class="hint-row">
      <div class="strength-dots">
        <div class="dot" id="d0"></div>
        <div class="dot" id="d1"></div>
        <div class="dot" id="d2"></div>
        <div class="dot" id="d3"></div>
        <div class="dot" id="d4"></div>
      </div>
      <span id="strength-label" style="font-size:11px;color:var(--muted)"></span>
    </div>

    <button type="submit" id="btn-test" class="btn-primary" data-t="test_btn">Tester</button>
    <p class="disclaimer" data-t="disclaimer"></p>
  </form>

</div>

<!-- ═══════════════════════════════════════════════════════════════════
     ÉCRAN 2 : Analyse en cours
     ═══════════════════════════════════════════════════════════════════ -->
<div id="s-run" class="screen">

  <div class="run-header">
    <div class="lock-wrap scanning" id="lock-run">
      <svg class="lock-svg" viewBox="0 0 80 100" xmlns="http://www.w3.org/2000/svg">
        <path class="shackle" d="M22 46 L22 26 Q22 6 40 6 Q58 6 58 26 L58 46"
              stroke="var(--accent)" stroke-width="7" fill="none" stroke-linecap="round"/>
        <rect class="body-rect" x="8" y="43" width="64" height="52" rx="8"
              fill="#13192a" stroke="var(--accent)" stroke-width="2"/>
        <circle class="keyhole" cx="40" cy="63" r="7" fill="var(--accent)" opacity=".7"/>
        <rect class="keyhole" x="37.5" y="63" width="5" height="11" rx="2.5"
              fill="var(--accent)" opacity=".7"/>
      </svg>
      <div class="scan-beam"></div>
    </div>

    <div id="phase-label" class="phase-label" data-t="scanning">Analyse en cours…</div>

    <div class="time-bar-wrap">
      <div class="time-fill" id="time-fill"></div>
    </div>

    <div class="attempts-row">
      <strong id="attempt-count">0</strong>&nbsp;<span data-t="attempts">tentatives</span>
    </div>
  </div>

  <div class="terminal" id="terminal"></div>
</div>

<!-- ═══════════════════════════════════════════════════════════════════
     ÉCRAN 3 : Résultat
     ═══════════════════════════════════════════════════════════════════ -->
<div id="s-result" class="screen">
  <div class="result-wrap">

    <!-- Cadenas résultat (animé par JS) -->
    <div class="lock-wrap" id="lock-result">
      <svg class="lock-svg" viewBox="0 0 80 100" xmlns="http://www.w3.org/2000/svg">
        <path class="shackle" d="M22 46 L22 26 Q22 6 40 6 Q58 6 58 26 L58 46"
              stroke="var(--accent)" stroke-width="7" fill="none" stroke-linecap="round"/>
        <rect class="body-rect" x="8" y="43" width="64" height="52" rx="8"
              fill="#13192a" stroke="var(--accent)" stroke-width="2"/>
        <circle class="keyhole" cx="40" cy="63" r="7" fill="var(--accent)" opacity=".7"/>
        <rect class="keyhole" x="37.5" y="63" width="5" height="11" rx="2.5"
              fill="var(--accent)" opacity=".7"/>
        <!-- Fissure (invisible par défaut, animée si trouvé) -->
        <path class="crack" d="M36 43 L43 56 L38 65 L46 95"
              stroke="var(--danger)" stroke-width="2.5" fill="none"
              stroke-linecap="round" opacity="0"/>
      </svg>
    </div>

    <h2 class="result-title" id="result-title">—</h2>

    <!-- Mot de base révélé (mutation uniquement) -->
    <div id="base-word-box" style="display:none; flex-direction:column; align-items:center; gap:4px;">
      <span id="base-word-lbl" style="font-size:11px; color:var(--muted); font-family:var(--mono); letter-spacing:1px;">Variante de</span>
      <span id="base-word-val" style="font-size:28px; font-weight:800; color:var(--danger); letter-spacing:2px; font-family:var(--mono);"></span>
    </div>

    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-box">
        <span class="stat-val" id="stat-tries">—</span>
        <span class="stat-lbl" data-t="stat_tries">TENTATIVES</span>
      </div>
      <div class="stat-box">
        <span class="stat-val" id="stat-time">—</span>
        <span class="stat-lbl" id="stat-time-lbl" data-t="stat_time">SECONDES</span>
      </div>
      <div class="stat-box">
        <span class="stat-val" id="stat-method">—</span>
        <span class="stat-lbl" id="stat-method-lbl" data-t="stat_method">MÉTHODE</span>
      </div>
    </div>

    <!-- Checklist critères -->
    <div class="criteria-list" id="criteria-list"></div>

    <!-- Conseils -->
    <div class="tips-card">
      <div class="tips-title" id="tips-title"></div>
      <ul class="tips-list" id="tips-list"></ul>
    </div>

    <a id="btn-poster" class="btn-poster" href="/poster" target="_blank" data-t="poster_btn">📊 Voir ma position dans le tableau</a>
    <button class="btn-retry" onclick="doReset()" data-t="retry">Tester un autre</button>
  </div>
</div>

// ── Lang ──────────────────────────────────────────────────────────────
let curLang = 'fr';
let _lastCriteria = null;  // critères capturés avant effacement du champ

function getCookie(n) {
  const m = document.cookie.match('(^|;)\\s*' + n + '\\s*=\\s*([^;]+)');
  return m ? m.pop() : '';
}
function setLang(l) {
  if (!LANG[l]) return;
  curLang = l;
  document.querySelectorAll('.lang-btn').forEach(b =>
    b.classList.toggle('active', b.textContent === l.toUpperCase()));
  applyLang();
}
function applyLang() {
  const t = LANG[curLang];
  document.querySelectorAll('[data-t]').forEach(el => {
    const v = t[el.dataset.t];
    if (v !== undefined) el.textContent = v;
  });
  document.querySelectorAll('[data-t-ph]').forEach(el => {
    const v = t[el.dataset.tPh];
    if (v !== undefined) el.placeholder = v;
  });
  updateDots(); // refresh strength label
  // Si l'écran résultat est affiché en mode "résistant", re-appliquer les labels dynamiques
  const resultScreen = document.getElementById('s-result');
  if (resultScreen && resultScreen.classList.contains('active')) {
    const lockEl = document.getElementById('lock-result');
    if (lockEl && lockEl.classList.contains('lock-safe')) {
      document.getElementById('stat-time-lbl').textContent   = t.stat_time_safe;
      document.getElementById('stat-method-lbl').textContent = t.stat_method_safe;
      document.getElementById('stat-method').textContent     = t.m_all_phases;
    }
  }
}

// ── Indicateur de force (visuel, basé longueur + charset) ─────────────
const DOT_COLORS = ['#ff3b6b','#ff8c42','#ffcc00','#76ff7a','#00ffd0'];
function scorePassword(pwd) {
  if (!pwd) return -1;
  let s = 0;
  if (pwd.length >= 8)  s++;
  if (pwd.length >= 12) s++;
  if (/[A-Z]/.test(pwd) && /[a-z]/.test(pwd)) s++;
  if (/[0-9]/.test(pwd)) s++;
  if (/[^A-Za-z0-9]/.test(pwd)) s++;
  return Math.min(s, 4);
}
function updateDots() {
  const pwd   = document.getElementById('pwd-input').value;
  const score = scorePassword(pwd);
  for (let i = 0; i < 5; i++) {
    const dot = document.getElementById('d' + i);
    dot.style.background = (i <= score && score >= 0) ? DOT_COLORS[score] : 'var(--border)';
  }
  const lbl = document.getElementById('strength-label');
  if (score >= 0) {
    lbl.textContent = LANG[curLang]['sl_' + score];
    lbl.style.color = DOT_COLORS[score];
  } else {
    lbl.textContent = '';
  }
}

// ── Toggle visibilité ─────────────────────────────────────────────────
function toggleVis() {
  const i = document.getElementById('pwd-input');
  i.type = i.type === 'password' ? 'text' : 'password';
}

// ── Screens ───────────────────────────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ── SHA-256 côté navigateur ───────────────────────────────────────────
// Implémentation pure JS — fonctionne sur HTTP (192.168.x.x) et HTTPS.
// crypto.subtle ne fonctionne que sur localhost/HTTPS, pas sur HTTP LAN.
// Le texte en clair ne quitte JAMAIS le navigateur.
function sha256(msg) {
  function rr(w,b){return(w>>>b)|(w<<(32-b));}
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  let h=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const b=new TextEncoder().encode(msg);
  const len=b.length;
  const extra=((len+9)%64<=0?64:0)+64-((len+9)%64);
  const buf=new Uint8Array(len+1+extra+8);
  buf.set(b); buf[len]=0x80;
  const dv=new DataView(buf.buffer);
  dv.setUint32(buf.length-4,(len*8)&0xffffffff,false);
  dv.setUint32(buf.length-8,Math.floor(len/0x20000000),false);
  for(let i=0;i<buf.length;i+=64){
    const w=new Uint32Array(64);
    for(let j=0;j<16;j++) w[j]=dv.getUint32(i+j*4,false);
    for(let j=16;j<64;j++){
      const s0=rr(w[j-15],7)^rr(w[j-15],18)^(w[j-15]>>>3);
      const s1=rr(w[j-2],17)^rr(w[j-2],19)^(w[j-2]>>>10);
      w[j]=(w[j-16]+s0+w[j-7]+s1)>>>0;
    }
    let [a,b2,c,d,e,f,g,hh]=h;
    for(let j=0;j<64;j++){
      const S1=rr(e,6)^rr(e,11)^rr(e,25);
      const ch=(e&f)^(~e&g);
      const t1=(hh+S1+ch+K[j]+w[j])>>>0;
      const S0=rr(a,2)^rr(a,13)^rr(a,22);
      const maj=(a&b2)^(a&c)^(b2&c);
      const t2=(S0+maj)>>>0;
      hh=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b2;b2=a;a=(t1+t2)>>>0;
    }
    h[0]=(h[0]+a)>>>0;h[1]=(h[1]+b2)>>>0;h[2]=(h[2]+c)>>>0;h[3]=(h[3]+d)>>>0;
    h[4]=(h[4]+e)>>>0;h[5]=(h[5]+f)>>>0;h[6]=(h[6]+g)>>>0;h[7]=(h[7]+hh)>>>0;
  }
  return h.map(v=>v.toString(16).padStart(8,'0')).join('');
}

// ── Terminal helper ───────────────────────────────────────────────────
let _lastPhase = '', _lastDict = '';

function tlog(text, cls) {
  const term = document.getElementById('terminal');
  const line = document.createElement('div');
  if (cls) line.className = cls;
  line.textContent = text;
  term.appendChild(line);
  term.scrollTop = term.scrollHeight;
}

// ── Démarrage du test ─────────────────────────────────────────────────
async function startTest(e) {
  alert("Nous allons démarrer le test!");
  e.preventDefault();
  const input = document.getElementById('pwd-input');
  const pwd   = input.value;
  if (!pwd) return;

  // 1. Hash dans le navigateur — le plain text ne part jamais
  const pwdLen  = pwd.length;           // longueur capturée AVANT effacement
  _lastCriteria = {                     // critères capturés AVANT effacement
    pwdLen:  pwd.length,
    len:     pwd.length >= 8,
    lower:   /[a-z]/.test(pwd),
    upper:   /[A-Z]/.test(pwd),
    digit:   /[0-9]/.test(pwd),
    special: /[^a-zA-Z0-9]/.test(pwd),
  };
  const hashHex = await sha256(pwd);
  input.value = '';                     // effacement immédiat
  updateDots();

  // 2. Prépare l'écran d'analyse
  showScreen('s-run');
  document.getElementById('terminal').innerHTML = '';
  document.getElementById('attempt-count').textContent = '0';
  document.getElementById('time-fill').style.width = '0%';
  document.getElementById('phase-label').textContent = LANG[curLang].scanning;
  _lastPhase = ''; _lastDict = '';
  tlog('> ' + LANG[curLang].scanning, 'l-dict');

  // 3. POST du hash vers le serveur
  let job_id;
  try {
    const res  = await fetch('/password-check/start', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ hash: hashHex, lang: curLang, len: pwdLen }),
    });
    const data = await res.json();
    if (!res.ok || !data.job_id) throw new Error(data.error || 'start failed');
    job_id = data.job_id;
  } catch (err) {
    tlog('✗ Erreur serveur : ' + err.message, 'l-found');
    setTimeout(() => showScreen('s-form'), 3000);
    return;
  }

  // 4. Connexion SSE → flux de progression
  const es = new EventSource('/password-check/' + job_id + '/stream');

  es.onmessage = (evt) => {
    const msg = JSON.parse(evt.data);
    handleMsg(msg);
    if (msg.done) { es.close(); showResult(msg); }
  };
  es.onerror = () => {
    es.close();
    tlog('✗ Connexion SSE interrompue', 'l-found');
    setTimeout(() => showScreen('s-form'), 3000);
  };
}

// ── Traitement des événements SSE ─────────────────────────────────────
function handleMsg(msg) {
  const t = LANG[curLang];

  // Barre de temps
  if (msg.elapsed !== undefined) {
    document.getElementById('time-fill').style.width =
      Math.min(100, (msg.elapsed / 60) * 100) + '%';
  }
  // Compteur de tentatives
  if (msg.attempts !== undefined) {
    document.getElementById('attempt-count').textContent =
      msg.attempts.toLocaleString();
  }

  if (msg.phase === 'start') {
    // rien de spécial
  } else if (msg.phase === 'dict') {
    if (msg.dict !== _lastDict) {
      _lastDict = msg.dict;
      if (_lastPhase !== 'dict') {
        _lastPhase = 'dict';
        document.getElementById('phase-label').textContent = t.phase_dict;
        tlog('', 'l-sep');
        tlog('─── ' + t.phase_dict + ' ───', 'l-dict');
      }
      tlog('  📖 ' + msg.dict, 'l-dict');
    } else if (msg.elapsed !== undefined) {
      tlog('     · ' + (msg.attempts||0).toLocaleString() + ' mots / ' + msg.elapsed + 's', 'l-prog');
    }
  } else if (msg.phase === 'rules') {
    if (_lastPhase !== 'rules') {
      _lastPhase = 'rules';
      document.getElementById('phase-label').textContent = t.phase_rules;
      tlog('', 'l-sep');
      tlog('─── ' + t.phase_rules + ' ───', 'l-rules');
      tlog('  🔀 Leet speak · capitalize · suffixes numériques · années…', 'l-rules');
    }
    if (msg.stage === 'progress' && msg.word) {
      tlog('  ⟳  testing "' + msg.word + '" × ~1000 variantes'
           + '  ·  ' + (msg.attempts||0).toLocaleString() + ' essais'
           + '  ·  ' + (msg.pct||0) + '%', 'l-prog');
    }
  } else if (msg.phase === 'brute') {
    if (_lastPhase !== 'brute') {
      _lastPhase = 'brute';
      document.getElementById('phase-label').textContent = t.phase_brute;
      tlog('', 'l-sep');
      tlog('─── ' + t.phase_brute + ' ───', 'l-brute');
    }
    if (msg.elapsed !== undefined) {
      tlog('  ⚙  len=' + msg.length + ' [' + msg.charset + ']  '
           + (msg.attempts||0).toLocaleString() + ' essais / ' + msg.elapsed + 's', 'l-brute');
    }
  } else if (msg.done) {
    if (msg.found) {
      tlog('', 'l-sep');
      tlog('  ⚠  TROUVÉ — ' + (msg.attempts||0).toLocaleString()
           + ' essais en ' + msg.elapsed + 's', 'l-found');
    } else {
      tlog('', 'l-sep');
      tlog('  ✓  Non trouvé — mot de passe résistant (' + (msg.attempts||0).toLocaleString() + ' essais)', 'l-safe');
    }
  }
}

// ── Affichage du résultat ─────────────────────────────────────────────
function showResult(msg) {
  const t   = LANG[curLang];
  const lkEl = document.getElementById('lock-result');

  // Reset état précédent
  lkEl.classList.remove('lock-found', 'lock-safe');
  const crack = lkEl.querySelector('.crack');
  crack.style.opacity   = '0';
  crack.style.animation = 'none';

  if (msg.found) {
    // Force reflow pour que l'animation se relance
    void lkEl.offsetWidth;
    lkEl.classList.add('lock-found');
    setTimeout(() => {
      crack.style.opacity   = '1';
      crack.style.animation = '';
    }, 100);
  } else {
    lkEl.classList.add('lock-safe');
  }

  // Titre — si trouvé via mutation, affiche le mot de base ("variante de 'password'")
  const titleEl = document.getElementById('result-title');
  if (msg.found && msg.method === 'rules' && msg.base_word) {
    titleEl.textContent = t.found_title;
    document.getElementById('base-word-box').style.display = 'flex';
    document.getElementById('base-word-val').textContent   = msg.base_word;
    document.getElementById('base-word-lbl').textContent   = t.variant_of || 'Variante de';
  } else {
    document.getElementById('base-word-box').style.display = 'none';
    titleEl.textContent = msg.found ? t.found_title : t.safe_title;
  }
  titleEl.className = 'result-title ' + (msg.found ? 'danger' : 'safe');

  // Stats
  document.getElementById('stat-tries').textContent =
    (msg.attempts || 0).toLocaleString();
  document.getElementById('stat-time').textContent =
    (msg.elapsed ?? '—') + (msg.found ? '' : ' s');

  // Labels dynamiques : sens différent selon trouvé / résistant
  const timeLblEl   = document.getElementById('stat-time-lbl');
  const methLblEl   = document.getElementById('stat-method-lbl');
  if (msg.found) {
    timeLblEl.textContent = t.stat_time;        // "SECONDES"
    methLblEl.textContent = t.stat_method;      // "MÉTHODE"
    const methKey = msg.method === 'dictionary' ? 'm_dict'
                  : msg.method === 'rules'      ? 'm_rules'
                  :                               'm_brute';
    document.getElementById('stat-method').textContent = t[methKey];
  } else {
    timeLblEl.textContent = t.stat_time_safe;   // "ANALYSÉ EN"
    methLblEl.textContent = t.stat_method_safe; // "PHASES TESTÉES"
    document.getElementById('stat-method').textContent = t.m_all_phases;
  }

  // Lien poster : encode longueur + charset + langue dans l'URL
  const c0 = _lastCriteria || {};
  const csIdx    = c0.special ? 3 : (c0.upper && c0.digit) ? 2 : (c0.upper || c0.digit) ? 1 : 0;
  const lenParam = c0.pwdLen || 8;
  const foundParam  = msg.found ? '1' : '0';
  const elapsedParam = msg.elapsed ?? '';
  const methodParam  = msg.found ? (msg.method || '') : '';
  document.getElementById('btn-poster').href =
    `/poster?len=${lenParam}&cs=${csIdx}&lang=${curLang}&atk=2`
    + `&found=${foundParam}&elapsed=${elapsedParam}&method=${encodeURIComponent(methodParam)}`;

  // Checklist critères
  const crList = document.getElementById('criteria-list');
  crList.innerHTML = '';
  const c = _lastCriteria || {};
  // "Pas de mots courants" : vrai si non trouvé OU trouvé uniquement par brute force
  const noCommonWord = !msg.found || msg.method === 'brute-force';
  [
    { key: 'cr_len',     ok: c.len },
    { key: 'cr_lower',   ok: c.lower },
    { key: 'cr_upper',   ok: c.upper },
    { key: 'cr_digit',   ok: c.digit },
    { key: 'cr_special', ok: c.special },
    { key: 'cr_nodict',  ok: noCommonWord },
  ].forEach(({ key, ok }) => {
    const div = document.createElement('div');
    div.className = 'criteria-item ' + (ok ? 'ok' : 'fail');
    div.innerHTML = `<span class="criteria-icon">${ok ? '✓' : '✗'}</span><span>${t[key]}</span>`;
    crList.appendChild(div);
  });

  // Conseils
  document.getElementById('tips-title').textContent =
    msg.found ? t.tips_hdr_w : t.tips_hdr_s;

  const ul   = document.getElementById('tips-list');
  ul.innerHTML = '';
  (msg.found ? t.tips_weak : t.tips_strong).forEach(tip => {
    const li = document.createElement('li');
    li.textContent = tip;
    ul.appendChild(li);
  });

  showScreen('s-result');

  // ── Workshop score — high score uniquement ───────────────────────
  const pts = msg.found
    ? (msg.method === 'brute-force' ? 10 : 5)
    : 20;
  const prev = parseInt(sessionStorage.getItem('pwcheck_highScore') || '0', 10);
  if (pts > prev) {
    sessionStorage.setItem('pwcheck_highScore', String(pts));
    _submitWorkshopScore('password-check', pts - prev);
  }
}

// ── Workshop score helper ─────────────────────────────────────────────
function _submitWorkshopScore(activity, points) {
  const teamId = (document.cookie.match('(?:^|;)\\s*cq_team=([^;]*)') || [])[1];
  if (!teamId || points <= 0) return;
  fetch('/workshop/score', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ team_id: decodeURIComponent(teamId), activity, points }),
  }).catch(() => {});
}

// ── Reset ─────────────────────────────────────────────────────────────
function doReset() {
  document.getElementById('pwd-input').value = '';
  updateDots();
  showScreen('s-form');
}

// ── Init ──────────────────────────────────────────────────────────────
(function () {
  const ck  = getCookie('cq_lang');
  const nav = (navigator.language || 'fr').slice(0, 2);
  const l   = (LANG[ck] ? ck : (LANG[nav] ? nav : 'fr'));
  setLang(l);
})();
